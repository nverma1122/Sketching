":["22 g","50 g","44 g","28 g"],"answer":0,"explanation":"M(CaCO₃) = 100 g/mol, so 50 g = 0.5 mol. The equation is 1 : 1, so 0.5 mol CO₂ forms. Mass = 0.5 × 44 = 22 g. (The remaining 28 g is CaO — mass is conserved: 22 + 28 = 50 g.)","misconception":"28 g is the mass of calcium oxide left behind.","hints":["Convert 50 g of CaCO₃ to moles.","How many moles of CO₂ does each mole of CaCO₃ give?"],"time":90,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-045","subject":"Chemistry","topic":"Chemical Reactions","level":2,"type":"application","q":"Packets of potato chips are filled with nitrogen gas rather than air. Why?","options":["To make the chips crunchier by reacting with them","To prevent the oils from being oxidised and going rancid","To add nitrogen as a nutrient","Because nitrogen is lighter and makes the packet float"],"answer":1,"explanation":"Fats and oils react slowly with oxygen (oxidation), producing bad-smelling, bad-tasting compounds — rancidity. Nitrogen is unreactive, so replacing the air removes the oxygen and also cushions the chips.","hints":["Which gas in air causes food oils to spoil?"],"time":35,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-046","subject":"Chemistry","topic":"Acids, Bases & Salts","level":1,"type":"mcq","q":"A few drops of phenolphthalein turn a colourless solution pink. What is the most likely pH of the solution?","options":["7","1","11","3"],"answer":2,"explanation":"Phenolphthalein is colourless in acidic and neutral solutions and turns pink in basic solutions (roughly pH above 8–9). Only pH 11 is basic.","misconception":"Neutral solutions (pH 7) leave phenolphthalein colourless.","hints":["Phenolphthalein changes colour in which type of solution?"],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-047","subject":"Chemistry","topic":"Acids, Bases & Salts","level":2,"type":"numerical","q":"Solution P has pH 3 and solution Q has pH 6. How does the hydrogen-ion concentration of P compare with that of Q?","options":["2 times greater","3 times greater","1000 times greater","100 times greater"],"answer":2,"explanation":"The pH scale is logarithmic: each unit is a factor of 10 in [H⁺]. A difference of 3 units means 10³ = 1000 times greater H⁺ concentration in P.","misconception":"pH is not a linear scale; pH 3 is not simply “twice as acidic” as pH 6.","hints":["Each pH unit is a factor of what?"],"time":45,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-048","subject":"Chemistry","topic":"Acids, Bases & Salts","level":1,"type":"application","q":"A bee sting injects an acidic liquid. Which household substance would best relieve it?","options":["Baking soda paste","Tomato ketchup","Vinegar","Lemon juice"],"answer":0,"explanation":"Baking soda (sodium hydrogencarbonate) is mildly basic, so it neutralises the acid. Lemon juice, vinegar and ketchup are all acidic and would not help.","hints":["What neutralises an acid?"],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-049","subject":"Chemistry","topic":"Acids, Bases & Salts","level":3,"type":"what-if","q":"A solution of an acid with pH 5 is diluted 1000 times with pure water. What is the pH of the diluted solution closest to?","options":["2","8","Just below 7 — still very slightly acidic","Exactly 5, since dilution does not change pH"],"answer":2,"explanation":"A naïve calculation (pH 5 + 3) gives pH 8, which is impossible: adding water to an acid can never make it basic. As the acid’s H⁺ falls towards 10⁻⁸ mol/L, the H⁺ from water itself (10⁻⁷ mol/L) dominates, so the pH approaches 7 from below (about 6.96).","misconception":"Blindly adding 3 to the pH ignores that water itself provides H⁺ ions; an acid solution can approach neutral but never cross into basic by dilution.","hints":["Each 10-fold dilution raises pH by 1 — until what limit?","Can adding pure water ever make a solution basic?"],"time":80,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"CHE-050","subject":"Chemistry","topic":"Acids, Bases & Salts","level":2,"type":"mcq","q":"Plaster of Paris sets into a hard mass when mixed with water. Which change takes place?","options":["Sodium chloride crystallises.","Gypsum loses water to become anhydrous calcium sulphate.","Calcium sulphate hemihydrate absorbs water to become gypsum (CaSO₄·2H₂O).","Calcium carbonate decomposes to quicklime."],"answer":2,"explanation":"Plaster of Paris is CaSO₄·½H₂O. With water it re-forms gypsum, CaSO₄·2H₂O, whose interlocking crystals make a hard solid — used for casts and statues.","misconception":"Setting is gaining water; making Plaster of Paris from gypsum is losing water.","hints":["Does the plaster gain or lose water when it sets?"],"time":40,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-051","subject":"Chemistry","topic":"Metals & Non-metals","level":2,"type":"reasoning","q":"Aluminium is a fairly reactive metal, yet aluminium foil and window frames do not corrode away. Why?","options":["Aluminium does not react with oxygen.","A thin, tough layer of aluminium oxide forms on the surface and protects the metal beneath.","Aluminium is always painted.","Aluminium is below hydrogen in the reactivity series."],"answer":1,"explanation":"Aluminium reacts with oxygen almost immediately, forming a very thin, compact Al₂O₃ layer that sticks to the surface and stops further reaction (passivation). Anodising thickens this layer deliberately. Rust on iron, by contrast, is porous and flakes off.","misconception":"Being reactive and corroding badly are not the same; the nature of the oxide layer matters.","hints":["What forms on the surface of aluminium in air?"],"time":45,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-052","subject":"Chemistry","topic":"Metals & Non-metals","level":3,"type":"experiment","q":"A metal X displaces copper from copper sulphate solution but does NOT displace zinc from zinc sulphate solution. Which could X be?","options":["Iron","Gold","Silver","Magnesium"],"answer":0,"explanation":"X must be more reactive than copper but less reactive than zinc. In the reactivity series … Mg > Al > Zn > Fe > Pb > Cu > Ag > Au, so iron fits. Magnesium would also displace zinc; silver and gold would not displace copper.","misconception":"Magnesium passes the first test but fails the second — check both conditions.","hints":["What does “X displaces copper” tell you about X compared with copper?","Place X in the reactivity series using both observations."],"time":80,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"CHE-053","subject":"Chemistry","topic":"Metals & Non-metals","level":1,"type":"mcq","q":"Which non-metal is a liquid at room temperature?","options":["Mercury","Iodine","Sulphur","Bromine"],"answer":3,"explanation":"Bromine is the only non-metal that is liquid at room temperature (a red-brown, volatile liquid). Mercury is also liquid but it is a metal; iodine and sulphur are solids.","misconception":"Mercury is the liquid METAL.","hints":["Two elements are liquid at room temperature — one metal, one non-metal."],"time":25,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-054","subject":"Chemistry","topic":"Metals & Non-metals","level":2,"type":"application","q":"Why is sodium metal stored under kerosene?","options":["Kerosene makes it softer to cut.","Kerosene prevents it from melting.","It reacts vigorously with oxygen and moisture in air.","It dissolves in kerosene to make a solution."],"answer":2,"explanation":"Sodium is so reactive that it tarnishes quickly in air and reacts violently with water, releasing hydrogen that can catch fire. Kerosene does not react with sodium and keeps air and moisture away.","hints":["What happens when sodium meets water?"],"time":35,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-055","subject":"Chemistry","topic":"Carbon Chemistry","level":2,"type":"reasoning","q":"Diamond and graphite are both pure carbon. Why is graphite a good conductor of electricity while diamond is not?","options":["Graphite is softer, so electrons can push through.","Graphite contains metal impurities.","In graphite each carbon bonds to only three others, leaving one free (delocalised) electron per atom.","Diamond has no electrons."],"answer":2,"explanation":"In diamond every carbon is covalently bonded to four others in a rigid 3-D network — all four valence electrons are locked in bonds, so it is very hard and does not conduct. In graphite each carbon bonds to three others in flat hexagonal layers; the fourth electron is delocalised and can move, so graphite conducts. The weakly held layers slide, making it soft.","misconception":"Softness and conduction are separate effects of the same layered structure.","hints":["How many other carbon atoms does each carbon bond to in each form?"],"time":60,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-056","subject":"Chemistry","topic":"Carbon Chemistry","level":1,"type":"mcq","q":"Methane is CH₄ and ethane is C₂H₆. What is the formula of the next member of this homologous series?","options":["C₃H₁₀","C₂H₈","C₃H₆","C₃H₈"],"answer":3,"explanation":"Successive members of a homologous series differ by a –CH₂– unit. Alkanes follow CₙH₂ₙ₊₂, so for n = 3: C₃H₈ (propane).","misconception":"C₃H₆ is propene, an alkene (CₙH₂ₙ).","hints":["Add CH₂ to ethane."],"time":35,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-057","subject":"Chemistry","topic":"Carbon Chemistry","level":3,"type":"experiment","q":"Two students wash oily cloths in very hard water, one with soap and one with a synthetic detergent. The soap forms a sticky white scum and cleans poorly; the detergent cleans well. Why?","options":["Soap reacts with calcium and magnesium ions to form insoluble salts; detergents do not.","Detergents are acids that dissolve oil.","Hard water contains oil that blocks soap.","Soap cannot form micelles in any water."],"answer":0,"explanation":"Hard water contains Ca²⁺ and Mg²⁺ ions. Soap molecules (sodium salts of long-chain fatty acids) react with these ions to form insoluble calcium/magnesium salts — scum — wasting the soap. Detergents (e.g. sulphonate salts) do not form insoluble salts with these ions, so they still form micelles and clean.","hints":["What ions make water “hard”?"],"time":70,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-058","subject":"Chemistry","topic":"Everyday Chemistry","level":1,"type":"mcq","q":"Baking soda makes cakes rise. What gas does it release when heated or mixed with an acid?","options":["Hydrogen","Nitrogen","Carbon dioxide","Oxygen"],"answer":2,"explanation":"Baking soda is sodium hydrogencarbonate (NaHCO₃). On heating, 2NaHCO₃ → Na₂CO₃ + H₂O + CO₂; with an acid it also releases CO₂. The gas bubbles expand in the batter and make it rise.","hints":["Baking soda is a hydrogencarbonate."],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-059","subject":"Chemistry","topic":"Everyday Chemistry","level":2,"type":"experiment","q":"Cut apple slices turn brown quickly, but slices dipped in lemon juice stay pale for longer. What is the best explanation?","options":["Lemon juice reacts with the brown pigment to remove it.","Browning is an enzyme-driven oxidation in air; the acid in lemon juice slows the enzyme.","Apples turn brown because they absorb water from the air.","Lemon juice adds colour that hides the brown."],"answer":1,"explanation":"Cutting exposes compounds in the apple to oxygen, and an enzyme (polyphenol oxidase) catalyses their oxidation to brown pigments. Lemon juice is acidic (and contains vitamin C, an antioxidant), which reduces the enzyme’s activity and the oxidation.","hints":["What in the air reacts with the cut surface?"],"time":45,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-060","subject":"Chemistry","topic":"Everyday Chemistry","level":3,"type":"interdisciplinary","q":"Traditional kulfi is frozen by packing the moulds in a mixture of crushed ice and salt, which becomes colder than 0 °C. Where does the extra cooling come from?","options":["Salt lowers the freezing point, so ice melts and absorbs latent heat from the mixture and the moulds.","Salt is naturally colder than ice.","Salt reflects heat away from the moulds.","Salt reacts with ice in a reaction that produces cold."],"answer":0,"explanation":"Dissolved salt lowers the freezing point of water well below 0 °C. At 0 °C the ice is now above the freezing point of the salty water, so it keeps melting. Melting needs latent heat, which it takes from its surroundings — the mixture and the kulfi — driving the temperature down (to about −10 °C or lower).","misconception":"Salt does not “contain cold”. The cooling comes from the latent heat absorbed as the ice melts.","hints":["What does salt do to the freezing point of water?","Melting ice needs energy — where does it get it?"],"time":90,"tracks":["MVPP","GEN"],"iq":true,"verified":true}]'),dv=Object.freeze(Object.defineProperty({__proto__:null,default:hv},Symbol.toStringTag,{value:"Module"})),fv=JSON.parse('[{"id":"ENV-001","subject":"Environment & Technology","topic":"Climate Science","level":1,"type":"mcq","q":"Which gas makes the largest contribution to the human-caused increase in the greenhouse effect?","options":["Carbon dioxide","Argon","Nitrogen","Oxygen"],"answer":0,"explanation":"CO₂ from burning fossil fuels and deforestation is the largest contributor to recent warming. Oxygen, nitrogen and argon (together over 99% of dry air) do not absorb infrared radiation significantly.","misconception":"The most abundant gases in air are not greenhouse gases.","hints":["Which gas is released when coal, oil and gas burn?"],"time":30,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-002","subject":"Environment & Technology","topic":"Climate Science","level":2,"type":"reasoning","q":"Why is melting Arctic sea ice described as a “positive feedback” for global warming?","options":["Ice melts faster when the Sun is closer.","Melting floating ice raises sea level enormously.","Dark ocean water absorbs more sunlight than white ice, causing further warming and more melting.","Melting ice releases large amounts of oxygen."],"answer":2,"explanation":"Ice has a high albedo (it reflects most sunlight); open ocean is dark and absorbs most of it. As ice melts, more sunlight is absorbed, warming the water and melting more ice — the change reinforces itself. (Floating sea ice barely changes sea level when it melts.)","misconception":"“Positive” feedback means self-reinforcing, not “good”.","hints":["Compare how much sunlight ice and seawater reflect."],"time":55,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-003","subject":"Environment & Technology","topic":"Climate Science","level":2,"type":"statement","q":"Consider:\\nI. Without any greenhouse effect, Earth’s average temperature would be well below freezing.\\nII. The ozone hole is the main cause of global warming.\\nIII. Methane traps more heat per molecule than carbon dioxide.\\nWhich are correct?","options":["I and II only","I and III only","II and III only","I, II and III"],"answer":1,"explanation":"I: true — without it Earth would average about −18 °C instead of about +15 °C. II: false — ozone depletion lets in more UV; it is a separate problem from greenhouse warming. III: true — methane is a much more powerful greenhouse gas per molecule (roughly 80 times CO₂ over 20 years), though there is far less of it.","misconception":"The ozone hole and global warming are often confused, but they have different causes and effects.","hints":["Which atmospheric layer protects us from UV, and is it the same issue as warming?"],"time":60,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-004","subject":"Environment & Technology","topic":"Climate Science","level":3,"type":"data","q":"Atmospheric CO₂ measured at Mauna Loa, Hawaii (annual averages, rounded). What was the approximate average rate of increase between 2000 and 2020?","options":["44 ppm per year","1.1 ppm per year","4.4 ppm per year","2.2 ppm per year"],"answer":3,"explanation":"Increase = 414 − 370 = 44 ppm over 20 years = 2.2 ppm per year. For 1960–1980 the rate was (339 − 317)/20 ≈ 1.1 ppm/year — so not only is CO₂ rising, the rate of rise has roughly doubled.","misconception":"44 ppm is the total change, not the yearly rate.","hints":["Find the change in ppm, then divide by the number of years.","Compare with the 1960–1980 rate. What does it tell you?"],"time":90,"tracks":["GEN"],"iq":true,"table":{"head":["Year","1960","1980","2000","2020"],"rows":[["CO₂ (ppm)",317,339,370,414]]},"verified":true},{"id":"ENV-005","subject":"Environment & Technology","topic":"Biodiversity","level":2,"type":"reasoning","q":"Why is a forest with many species usually more stable than a plantation of a single tree species?","options":["Diverse forests receive more sunlight.","Monocultures grow more slowly.","Single-species plantations have no insects.","With many species and food links, the loss of one species or a disease has a smaller effect on the whole ecosystem."],"answer":3,"explanation":"In a diverse ecosystem, food webs have many alternative pathways and species respond differently to stresses, so one pest, disease or drought rarely collapses the whole system. A monoculture can be wiped out by a single pest that attacks that species.","hints":["What happens to a single-species plantation if one pest arrives?"],"time":50,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-006","subject":"Environment & Technology","topic":"Biodiversity","level":2,"type":"mcq","q":"The Chipko movement of the 1970s in the Garhwal Himalaya is famous for:","options":["Villagers, many of them women, hugging trees to stop them being felled","Building India’s first wildlife sanctuary","Introducing solar cookers","Cleaning the Ganga river"],"answer":0,"explanation":"“Chipko” means “to cling”. Village communities in Uttarakhand embraced trees to prevent commercial logging, highlighting the link between forests and local livelihoods. It inspired forest-conservation policy in India.","hints":["“Chipko” means “to cling” or “to hug”."],"time":40,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-007","subject":"Environment & Technology","topic":"Biodiversity","level":3,"type":"what-if","q":"In a forest, wolves are removed by hunting. Over the following years the deer population rises sharply, and later young tree saplings become rare. Which sequence explains this?","options":["Fewer predators → more deer → overgrazing of saplings → fewer young trees","Fewer predators → fewer deer → more saplings","More deer improve soil, killing saplings","Hunting directly destroys saplings"],"answer":0,"explanation":"Predators control herbivore numbers. Without wolves, deer multiply and browse heavily on young trees, so few saplings survive — an example of a trophic cascade. When wolves were reintroduced to Yellowstone (USA), browsing pressure fell and some tree growth recovered.","misconception":"Removing one species can affect organisms that it never eats directly.","hints":["What did the wolves eat?","What do deer eat?"],"time":80,"tracks":["GEN"],"iq":true,"verified":true},{"id":"ENV-008","subject":"Environment & Technology","topic":"Renewable Energy","level":1,"type":"mcq","q":"Which of these is a renewable source of energy?","options":["Wind","Coal","Petroleum","Natural gas"],"answer":0,"explanation":"Wind is renewed continuously by solar heating of the atmosphere. Coal, natural gas and petroleum are fossil fuels formed over millions of years; we use them far faster than they form.","hints":["Which source will not run out on a human timescale?"],"time":30,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-009","subject":"Environment & Technology","topic":"Renewable Energy","level":2,"type":"numerical","q":"Sunlight delivers about 1000 W per square metre on a clear day. How much electrical power does a 2 m² solar panel with 20% efficiency produce?","options":["100 W","2000 W","400 W","200 W"],"answer":2,"explanation":"Input power = 1000 × 2 = 2000 W. Output = 20% of 2000 = 400 W. The other 80% is reflected or turned into heat.","misconception":"200 W forgets that the panel is 2 m².","hints":["Total input = intensity × area.","Output = efficiency × input."],"time":60,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-010","subject":"Environment & Technology","topic":"Renewable Energy","level":3,"type":"reasoning","q":"The power available from wind is proportional to the CUBE of the wind speed. If the wind speed doubles, the available power becomes:","options":["2 times larger","8 times larger","16 times larger","4 times larger"],"answer":1,"explanation":"Power ∝ v³, so doubling v multiplies power by 2³ = 8. (Each second, twice as much air passes through, and each kilogram has four times the kinetic energy: 2 × 4 = 8.) This is why turbines are placed on windy ridges and offshore.","misconception":"4 times uses kinetic energy ∝ v² but forgets that more air also passes each second.","hints":["Kinetic energy of each kilogram of air depends on v².","How does the mass of air passing the blades each second depend on v? Multiply the two effects."],"time":80,"tracks":["GEN"],"iq":true,"verified":true},{"id":"ENV-011","subject":"Environment & Technology","topic":"Renewable Energy","level":2,"type":"mcq","q":"What is a major limitation of solar and wind power that energy storage helps to solve?","options":["They can only be built in deserts.","They release greenhouse gases.","They need imported fuel.","Their output varies with weather and time of day."],"answer":3,"explanation":"Solar produces nothing at night and less on cloudy days; wind varies with the weather. Batteries, pumped hydro storage and grid connections store or share energy so supply can meet demand.","hints":["When does a solar panel produce no electricity?"],"time":40,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-012","subject":"Environment & Technology","topic":"Pollution","level":2,"type":"reasoning","q":"Lakes receiving fertiliser run-off often develop a thick green scum of algae, after which many fish die. What is the main cause of the fish deaths?","options":["Decomposition of dead algae by bacteria uses up dissolved oxygen.","The water becomes too cold.","Fertilisers directly poison all fish.","Algae release poisonous oxygen."],"answer":0,"explanation":"Nitrates and phosphates cause an algal bloom (eutrophication). When the algae die, decomposing bacteria multiply and consume most of the dissolved oxygen, so fish suffocate. Algae also block light for submerged plants.","hints":["What do decomposing bacteria use up?"],"time":55,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-013","subject":"Environment & Technology","topic":"Pollution","level":2,"type":"mcq","q":"Which pollutants are mainly responsible for acid rain?","options":["Methane and CFCs","Oxygen and nitrogen","Carbon monoxide and ozone","Sulphur dioxide and nitrogen oxides"],"answer":3,"explanation":"SO₂ (from burning sulphur-containing coal) and NOₓ (from vehicle engines and power plants) react with water in the air to form sulphuric and nitric acids. Acid rain damages forests, lakes and buildings — including marble monuments such as the Taj Mahal.","hints":["Which gases form sulphuric and nitric acids?"],"time":40,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-014","subject":"Environment & Technology","topic":"Pollution","level":3,"type":"experiment","q":"To test whether a factory is polluting a river, a student measures dissolved oxygen at two points. Which design gives the most convincing evidence?","options":["Measure upstream and downstream of the factory outlet on the same days, at the same time and depth, repeated several times.","Measure only downstream once.","Measure upstream in winter and downstream in summer.","Measure at the outlet and in a different river."],"answer":0,"explanation":"A fair comparison changes one factor (position relative to the outlet) while controlling temperature, time, depth and season, which also affect dissolved oxygen. Repeats reduce random error. The upstream site acts as the control.","misconception":"Comparing different seasons or rivers mixes in other variables, so any difference could not be blamed on the factory.","hints":["What should be the only difference between the two measurements?"],"time":70,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-015","subject":"Environment & Technology","topic":"Biotechnology","level":2,"type":"mcq","q":"Before genetic engineering, insulin for diabetics was extracted from animal pancreases. Today most insulin is made by:","options":["synthesising it from glucose in factories","collecting it from human donors","extracting it from plants","bacteria or yeast into which the human insulin gene has been inserted"],"answer":3,"explanation":"Recombinant DNA technology inserts the human insulin gene into microbes such as E. coli or yeast, which then produce human insulin in large fermenters. It is identical to human insulin and available in large quantities.","hints":["Which organisms multiply quickly and can be given a human gene?"],"time":40,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-016","subject":"Environment & Technology","topic":"Biotechnology","level":3,"type":"reasoning","q":"CRISPR–Cas9 is often called “genetic scissors”. What does it allow scientists to do?","options":["Read the DNA of any organism without cutting it","Turn bacteria into viruses","Cut DNA at a precisely chosen sequence so that a gene can be disabled, corrected or replaced","Make exact copies of whole organisms"],"answer":2,"explanation":"A guide RNA directs the Cas9 enzyme to a matching DNA sequence, where it cuts both strands. The cell’s repair process can then disable the gene or insert a corrected version. It was adapted from a bacterial defence system against viruses; Emmanuelle Charpentier and Jennifer Doudna received the 2020 Nobel Prize in Chemistry for it.","misconception":"Cloning an organism and editing a gene are different technologies.","hints":["Scissors cut. What do they cut, and how do they know where?","What can a cell do after its DNA is cut at a chosen place?"],"time":80,"tracks":["GEN"],"iq":true,"verified":true},{"id":"ENV-017","subject":"Environment & Technology","topic":"Biotechnology","level":2,"type":"application","q":"Bt cotton is protected from bollworm caterpillars because it:","options":["carries a gene from the bacterium Bacillus thuringiensis that makes a protein toxic to the caterpillars","has thorns","is sprayed with chemical pesticide inside the seed","grows too fast for insects to eat"],"answer":0,"explanation":"A gene from Bacillus thuringiensis (Bt) was inserted into the cotton genome. The plant makes a crystal (Cry) protein that becomes toxic in the alkaline gut of certain caterpillars, but is harmless to humans and most other animals.","hints":["What does “Bt” stand for?"],"time":45,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-018","subject":"Environment & Technology","topic":"AI & Robotics","level":2,"type":"reasoning","q":"A machine-learning program is trained to recognise skin diseases using thousands of photos, almost all of light-skinned patients. What is the most likely problem?","options":["It will become conscious.","It may perform poorly on patients with darker skin, because it learnt from unrepresentative data.","It will refuse to work on any new photo.","It will work equally well for everyone because computers are objective."],"answer":1,"explanation":"Machine-learning models learn patterns from their training data. If the data are not representative, the model can be less accurate for under-represented groups — a form of bias. Good AI design needs diverse, carefully checked data and testing.","misconception":"Computers are not automatically objective; they reflect the data they were trained on.","hints":["What does the program learn from?"],"time":55,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-019","subject":"Environment & Technology","topic":"AI & Robotics","level":1,"type":"mcq","q":"A robot vacuum cleaner detects a wall and turns away. Which component lets it sense the wall?","options":["An actuator","A battery","A sensor (such as an infrared or bump sensor)","A solar panel"],"answer":2,"explanation":"Robots sense their surroundings with sensors (infrared, ultrasonic, touch, cameras), process the data with a controller, and act through actuators such as motors. Sense → think → act.","misconception":"Actuators produce movement; sensors gather information.","hints":["Which part gathers information about the surroundings?"],"time":30,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-020","subject":"Environment & Technology","topic":"Nanotechnology","level":2,"type":"numerical","q":"A cube of side 1 cm is divided into cubes of side 1 mm. By what factor does the total surface area increase?","options":["10 times","1000 times","6 times","100 times"],"answer":0,"explanation":"Original area = 6 × (1 cm)² = 6 cm². Cutting into 1 mm cubes gives 10 × 10 × 10 = 1000 cubes, each with area 6 × (0.1 cm)² = 0.06 cm², total 60 cm² — 10 times larger. Surface area per volume rises as size falls, which is why nanoparticles (far smaller still) are so reactive.","misconception":"1000 counts the number of small cubes, not the change in surface area.","hints":["Calculate the area of one small cube, then multiply by the number of cubes."],"time":60,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-021","subject":"Environment & Technology","topic":"Nanotechnology","level":3,"type":"reasoning","q":"Gold is unreactive as a bar, yet gold nanoparticles a few nanometres across can act as good catalysts. Which is the best explanation?","options":["Nanoparticles have a huge surface area per unit mass, and a large fraction of their atoms are at the surface with unusual properties.","Gold becomes radioactive at small sizes.","Small particles are heavier per atom.","Nanoparticles are made of a different element."],"answer":0,"explanation":"Catalysis happens at surfaces. In a particle only a few nanometres across, a large proportion of atoms are surface atoms, many at edges and corners with fewer neighbours, which makes them more reactive. Properties such as colour and melting point also change at the nanoscale.","misconception":"It is the same element — size alone changes the behaviour.","hints":["Where do catalytic reactions occur?","What fraction of atoms are on the surface of a very tiny particle?"],"time":70,"tracks":["GEN"],"iq":true,"verified":true},{"id":"ENV-022","subject":"Environment & Technology","topic":"Emerging Discoveries","level":2,"type":"mcq","q":"mRNA vaccines (used widely against COVID-19) work by:","options":["killing the virus directly in the blood","giving cells temporary instructions to make a harmless viral protein, which trains the immune system","changing the person’s DNA permanently","injecting live virus"],"answer":1,"explanation":"The mRNA is read by ribosomes in the cytoplasm to make a viral protein (e.g. the spike protein). The immune system learns to recognise it and forms memory cells. The mRNA breaks down within days and does not enter the nucleus or alter DNA.","misconception":"mRNA does not change a person’s DNA.","hints":["What do ribosomes do with mRNA?"],"time":40,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-023","subject":"Environment & Technology","topic":"Emerging Discoveries","level":3,"type":"interdisciplinary","q":"Gravitational waves were first directly detected in 2015 by the LIGO detectors. What produced the signal?","options":["An earthquake in the USA","The Moon’s tides","A solar flare","Two black holes spiralling together and merging over a billion light-years away"],"answer":3,"explanation":"The signal, GW150914, came from two black holes (about 36 and 29 times the Sun’s mass) merging about 1.3 billion light-years away. It confirmed a prediction of Einstein’s general relativity. India is building LIGO-India in Maharashtra to join the network.","hints":["Gravitational waves are ripples in space-time from extremely massive, violent events."],"time":80,"tracks":["GEN"],"iq":false,"verified":true},{"id":"ENV-024","subject":"Environment & Technology","topic":"Emerging Discoveries","level":2,"type":"application","q":"Why are LEDs replacing incandescent bulbs for lighting?","options":["LEDs only produce ultraviolet light.","LEDs do not need electricity.","LEDs convert a much larger fraction of electrical energy into light rather than heat.","LEDs produce more heat, so they warm rooms."],"answer":2,"explanation":"An incandescent bulb heats a filament until it glows; most of the energy (about 90% or more) is emitted as heat. LEDs produce light directly from electrons crossing a semiconductor junction, using far less power for the same brightness and lasting much longer.","hints":["Touch an old bulb and an LED after an hour — which is hotter?"],"time":50,"tracks":["GEN"],"iq":false,"verified":true}]'),mv=Object.freeze(Object.defineProperty({__proto__:null,default:fv},Symbol.toStringTag,{value:"Module"})),pv=JSON.parse(`[{"id":"PHY-001","subject":"Physics","topic":"Motion","level":1,"type":"mcq","q":"A runner completes exactly one lap of a 400 m circular track in 80 s. What are her average speed and average velocity for the lap?","options":["5 m/s and 5 m/s","2.5 m/s and 0 m/s","0 m/s and 5 m/s","5 m/s and 0 m/s"],"answer":3,"explanation":"Average speed = total distance ÷ time = 400 m ÷ 80 s = 5 m/s. Average velocity = displacement ÷ time; after one full lap she is back at the start, so displacement = 0 and average velocity = 0.","misconception":"Speed and velocity are not interchangeable: velocity uses displacement (with direction), which is zero for a closed loop.","hints":["Where does she finish compared with where she started?","Velocity uses displacement, speed uses distance."],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-002","subject":"Physics","topic":"Motion","level":2,"type":"numerical","q":"A car starts from rest, accelerates uniformly and covers 100 m in the first 10 s. What is its speed at the end of the 10 s?","options":["10 m/s","40 m/s","15 m/s","20 m/s"],"answer":3,"explanation":"s = ½at² gives 100 = ½ × a × 100, so a = 2 m/s². Then v = at = 2 × 10 = 20 m/s. Shortcut: for uniform acceleration from rest, average speed = v/2, so v = 2 × (100/10) = 20 m/s.","misconception":"10 m/s is the AVERAGE speed. Because the car started from rest, its final speed is twice the average.","hints":["Use s = ut + ½at² with u = 0.","Average speed for uniform acceleration = (u + v)/2."],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-003","subject":"Physics","topic":"Motion","level":2,"type":"data","q":"A cyclist’s velocity was recorded every 2 s (the velocity changes uniformly between readings). What is the total displacement in the 6 s?","options":["16 m","48 m","32 m","24 m"],"answer":2,"explanation":"Displacement = area under the velocity–time graph. 0–2 s: triangle ½ × 2 × 8 = 8 m; 2–4 s: rectangle 2 × 8 = 16 m; 4–6 s: triangle 8 m. Total = 32 m.","misconception":"48 m comes from treating the velocity as 8 m/s for the whole 6 s; the speeding-up and slowing-down phases only count half.","hints":["Sketch the v–t graph: it is a trapezium.","Area of a triangle = ½ × base × height."],"time":75,"tracks":["MVPP","VVM","GEN"],"iq":false,"table":{"head":["Time (s)","0","2","4","6"],"rows":[["Velocity (m/s)",0,8,8,0]]},"verified":true},{"id":"PHY-004","subject":"Physics","topic":"Motion","level":3,"type":"numerical","q":"A stone dropped from rest from the top of a tower travels 25 m during the LAST second before it hits the ground. How tall is the tower? (g = 10 m/s², ignore air resistance)","options":["45 m","31.25 m","61.25 m","50 m"],"answer":0,"explanation":"If the fall lasts T seconds, distance in the last second = ½g[T² − (T − 1)²] = 5(2T − 1). Setting 5(2T − 1) = 25 gives T = 3 s. Height = ½ × 10 × 3² = 45 m. Check: in 2 s it falls 20 m, so the last second covers 45 − 20 = 25 m ✓.","misconception":"Assuming the stone moves at a steady 25 m/s or that the last-second distance equals the height ignores that it keeps accelerating.","hints":["Let the total fall time be T. Write the distance fallen in T seconds and in (T − 1) seconds.","The difference of the two distances is 25 m: 5T² − 5(T − 1)² = 25."],"time":120,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-005","subject":"Physics","topic":"Motion","level":3,"type":"reasoning","q":"Train A (150 m long, 20 m/s) and train B (100 m long, 30 m/s) move towards each other on parallel tracks. How long do they take to pass each other completely, from fronts meeting to rears separating?","options":["12.5 s","8.3 s","5 s","25 s"],"answer":2,"explanation":"Relative speed for opposite directions = 20 + 30 = 50 m/s. To pass completely, the relative distance covered must equal the sum of the lengths, 250 m. Time = 250 ÷ 50 = 5 s.","misconception":"25 s uses the relative speed for trains moving in the SAME direction (30 − 20 = 10 m/s).","hints":["Imagine sitting on train A: how fast does B approach you?","The distance to cover is the total length of both trains."],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-006","subject":"Physics","topic":"Motion","level":1,"type":"mcq","q":"A car goes round a circular roundabout at a constant speed of 30 km/h. Which statement is correct?","options":["Its acceleration is along its direction of motion.","It is accelerating only if its speed increases.","Its velocity changes because its direction changes, so it is accelerating.","Its velocity is constant, so it is not accelerating."],"answer":2,"explanation":"Velocity is a vector. In circular motion the direction keeps changing, so velocity changes and the car accelerates even at constant speed. This (centripetal) acceleration points towards the centre of the circle, perpendicular to the motion.","misconception":"Acceleration is not just “speeding up”; any change of velocity — including a change of direction — is acceleration.","hints":["Is velocity a scalar or a vector?"],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-007","subject":"Physics","topic":"Motion","level":2,"type":"numerical","q":"A car travelling at 72 km/h brakes with uniform deceleration and stops in 4 s. How far does it travel while braking?","options":["40 m","80 m","144 m","20 m"],"answer":0,"explanation":"72 km/h = 72 × 1000/3600 = 20 m/s. With uniform deceleration, average speed = (20 + 0)/2 = 10 m/s. Distance = 10 × 4 = 40 m.","misconception":"144 m comes from using 72 directly without converting km/h to m/s; 80 m forgets that the speed falls to zero.","hints":["Convert km/h to m/s by dividing by 3.6.","Average speed = (initial + final)/2 for uniform deceleration."],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-008","subject":"Physics","topic":"Motion","level":3,"type":"what-if","q":"A car braking at 36 km/h stops in 10 m. If the driver brakes with exactly the same deceleration from 72 km/h, what is the braking distance?","options":["14.1 m","80 m","20 m","40 m"],"answer":3,"explanation":"From v² = u² + 2as with v = 0: s = u²/(2a). For the same deceleration, s ∝ u². Doubling the speed multiplies the braking distance by 2² = 4, so 10 m × 4 = 40 m. This is why speed limits matter so much near schools.","misconception":"Doubling speed does not double braking distance — kinetic energy (and so the braking distance) grows with the SQUARE of speed.","hints":["Which equation links speed and distance without time?","With v = 0, s = u²/2a. What happens to u²?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-009","subject":"Physics","topic":"Motion","level":1,"type":"mcq","q":"What does the slope of a distance–time graph represent?","options":["Speed","Acceleration","Force","Distance travelled"],"answer":0,"explanation":"Slope = change in distance ÷ change in time = speed. A steeper line means a faster object; a horizontal line means the object is at rest. (The slope of a velocity–time graph gives acceleration.)","misconception":"Students often mix this up with the velocity–time graph, whose slope is acceleration and whose area is displacement.","hints":["Slope = rise ÷ run. What is distance ÷ time?"],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-010","subject":"Physics","topic":"Motion","level":2,"type":"statement","q":"Consider the statements:\\nI. A body can have zero velocity and a non-zero acceleration at the same instant.\\nII. A body moving at constant speed cannot be accelerating.\\nIII. Acceleration is always in the direction of motion.\\nWhich are correct?","options":["I, II and III","Only I","I and II","II and III"],"answer":1,"explanation":"I is true: a ball thrown upward has v = 0 at the top but a = g downward. II is false: uniform circular motion has constant speed but is accelerated. III is false: a braking car accelerates opposite to its motion, and in circular motion acceleration is perpendicular to motion.","misconception":"It is tempting to think “stopped” means “no acceleration”, but acceleration depends on how velocity is changing, not on its current value.","hints":["Think of a ball at the very top of its flight.","Think of a car going round a bend at steady speed."],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-011","subject":"Physics","topic":"Force & Newton's Laws","level":1,"type":"application","q":"A standing passenger falls backwards when a stationary bus starts suddenly. This is best explained by:","options":["Newton's third law","friction from the floor pushing backwards","inertia of rest","inertia of motion"],"answer":2,"explanation":"The bus floor drags the passenger’s feet forward, but the upper body tends to stay at rest because of inertia (Newton’s first law). The body therefore appears to fall backwards relative to the bus.","misconception":"No backward force pushes the passenger; the upper body simply resists the change from rest.","hints":["Which part of the body is pulled forward by the bus, and which is not?"],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-012","subject":"Physics","topic":"Force & Newton's Laws","level":2,"type":"numerical","q":"A 150 g cricket ball moving at 20 m/s is caught and brought to rest in 0.1 s. What is the average force exerted by the fielder’s hands?","options":["30 N","3 N","0.3 N","300 N"],"answer":0,"explanation":"Change in momentum = m × v = 0.15 kg × 20 m/s = 3 kg m/s. Average force = Δp/Δt = 3/0.1 = 30 N.","misconception":"300 N comes from using 150 instead of 0.15 kg and dividing wrongly; always convert grams to kilograms.","hints":["Force = change in momentum ÷ time.","Convert 150 g to kg first."],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-013","subject":"Physics","topic":"Force & Newton's Laws","level":2,"type":"application","q":"A fielder pulls his hands back while catching a fast cricket ball. Why does this reduce the sting?","options":["It increases the time over which the momentum changes, reducing the force.","It reduces the ball’s change in momentum.","It reduces the mass of the ball relative to the hands.","It converts the ball’s momentum into heat."],"answer":0,"explanation":"The ball must lose all its momentum either way (Δp is fixed). Since F = Δp/Δt, spreading the stop over a longer time Δt reduces the average force on the hands. Airbags, crumple zones and sand pits for long jumpers use the same idea.","misconception":"The momentum change is the same whether or not the hands move back — only the time, and therefore the force, changes.","hints":["Is the ball’s total change in momentum different?","F = Δp ÷ Δt."],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-014","subject":"Physics","topic":"Force & Newton's Laws","level":2,"type":"numerical","q":"A 20 g bullet leaves a 5 kg rifle at 500 m/s. With what speed does the rifle recoil?","options":["0.2 m/s","20 m/s","5 m/s","2 m/s"],"answer":3,"explanation":"Momentum before firing = 0, so after firing the momenta are equal and opposite: 0.02 × 500 = 5 × v → v = 10/5 = 2 m/s, backwards.","misconception":"Using 20 instead of 0.02 kg gives a huge recoil — always convert mass to kilograms.","hints":["Total momentum before firing is zero.","m_bullet × v_bullet = m_rifle × v_rifle."],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-015","subject":"Physics","topic":"Force & Newton's Laws","level":3,"type":"reasoning","q":"Blocks of 3 kg and 2 kg touch each other on a frictionless floor. A 10 N horizontal push is applied to the 3 kg block, so both move together. What force does the 3 kg block exert on the 2 kg block?","options":["10 N","6 N","2 N","4 N"],"answer":3,"explanation":"Acceleration of the pair = 10 N ÷ 5 kg = 2 m/s². The only horizontal force on the 2 kg block is the push from the 3 kg block, which must give it 2 m/s²: F = 2 × 2 = 4 N. (The 3 kg block feels 10 N forward and 4 N backward: net 6 N = 3 × 2 ✓.)","misconception":"The full 10 N is not passed on: part of it is needed to accelerate the 3 kg block itself.","hints":["First find the common acceleration of both blocks.","Now apply F = ma to the 2 kg block alone."],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-016","subject":"Physics","topic":"Force & Newton's Laws","level":2,"type":"assertion-reason","q":"Assertion (A): A person standing on a weighing scale in a lift reads more than their true weight while the lift accelerates upward.\\nReason (R): To accelerate the person upward, the normal force from the scale must be greater than the person’s weight.","options":["Both A and R are true, and R correctly explains A.","Both A and R are true, but R does not explain A.","A is true, but R is false.","A is false, but R is true."],"answer":0,"explanation":"Net upward force = N − mg = ma, so N = m(g + a) > mg. The scale reads the normal force N, so it shows more than the true weight. R is exactly the reason for A.","misconception":"The scale does not measure mass or gravity directly — it measures the push it must give you.","hints":["Write Newton’s second law for the person: which two forces act?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-017","subject":"Physics","topic":"Force & Newton's Laws","level":3,"type":"what-if","q":"An 80 kg astronaut floating at rest outside a space station throws a 2 kg wrench away at 4 m/s. What happens to the astronaut?","options":["Moves at 4 m/s in the opposite direction","Moves at 0.1 m/s in the opposite direction","Stays still, because there is no air to push against","Moves at 0.1 m/s in the same direction as the wrench"],"answer":1,"explanation":"Total momentum starts at zero and is conserved (no external force). 2 × 4 = 80 × v gives v = 0.1 m/s, opposite to the wrench. Rockets work the same way — they need no air to push on.","misconception":"Propulsion does not need air. The thrown object pushes back on the thrower (Newton’s third law), in a vacuum too.","hints":["Is any external force acting on astronaut + wrench?","Momentum before = momentum after = 0."],"time":75,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-018","subject":"Physics","topic":"Force & Newton's Laws","level":1,"type":"mcq","q":"Why do action and reaction forces never cancel each other out?","options":["They act in the same direction.","They act on different bodies.","They act at different times.","Reaction is always slightly smaller than action."],"answer":1,"explanation":"Newton’s third-law forces are equal in size and opposite in direction, but each acts on a DIFFERENT body. Forces can only cancel if they act on the same body.","misconception":"Equal and opposite does not mean balanced: balanced forces must act on the same object.","hints":["When you push a wall, which object feels your push and which feels the wall’s push?"],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-019","subject":"Physics","topic":"Force & Newton's Laws","level":3,"type":"reasoning","q":"A horse pulls a cart. By Newton’s third law the cart pulls back on the horse with an equal force. Why, then, can the horse–cart system accelerate forward?","options":["Because the cart’s mass is smaller than the horse’s.","Because the horse’s pull is slightly larger than the cart’s pull.","Because action and reaction cancel, leaving no force.","Because the ground pushes the horse forward (friction) more than the ground’s friction holds the cart back."],"answer":3,"explanation":"The pull of horse on cart and cart on horse are internal to the system and always equal. The system accelerates because of EXTERNAL forces: the horse pushes the ground backwards, so the ground pushes the horse forwards. If that forward friction exceeds the rolling resistance on the cart, the system accelerates.","misconception":"The third-law pair (horse ↔ cart) never decides whether the system moves; only external forces do.","hints":["Draw the forces on the horse alone. Which force points forward?"],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-020","subject":"Physics","topic":"Force & Newton's Laws","level":1,"type":"numerical","q":"A 5 kg box is pushed along the floor with a horizontal force of 30 N while friction opposes it with 10 N. What is its acceleration?","options":["8 m/s²","6 m/s²","4 m/s²","2 m/s²"],"answer":2,"explanation":"Net force = 30 − 10 = 20 N. a = F/m = 20/5 = 4 m/s².","misconception":"6 m/s² ignores friction; Newton’s second law uses the NET force.","hints":["Find the net force first."],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-021","subject":"Physics","topic":"Force & Newton's Laws","level":3,"type":"interdisciplinary","q":"In a crash, a passenger’s 5 kg head moving at 15 m/s is stopped by an airbag in 0.1 s instead of by the dashboard in 0.01 s. What is the average force on the head with the airbag?","options":["75 N","1500 N","750 N","7500 N"],"answer":2,"explanation":"Δp = 5 × 15 = 75 kg m/s in both cases. With the airbag F = 75/0.1 = 750 N; with the dashboard F = 75/0.01 = 7500 N. Increasing the stopping time tenfold reduces the force tenfold — the physics behind car safety design.","misconception":"7500 N is the dashboard force. The airbag does not change the momentum lost, only the time taken.","hints":["Momentum change is the same in both cases.","F = Δp/Δt with Δt = 0.1 s."],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-022","subject":"Physics","topic":"Gravitation","level":1,"type":"mcq","q":"An astronaut has a mass of 60 kg on Earth. What is her mass on the Moon, where gravity is about one-sixth as strong?","options":["0 kg","10 kg","360 kg","60 kg"],"answer":3,"explanation":"Mass is the amount of matter and does not change with location. Her WEIGHT on the Moon is about one-sixth of her weight on Earth (≈ 98 N instead of ≈ 588 N), but her mass stays 60 kg.","misconception":"Mass and weight are different quantities: weight is a force (N) that depends on g; mass (kg) does not.","hints":["Does the amount of matter in her body change?"],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-023","subject":"Physics","topic":"Gravitation","level":2,"type":"numerical","q":"The gravitational force between two bodies is F. If the mass of one body is doubled and the distance between them is halved, the new force is:","options":["8F","16F","2F","4F"],"answer":0,"explanation":"F ∝ m₁m₂/r². Doubling one mass multiplies F by 2; halving r multiplies F by 1/(½)² = 4. New force = 2 × 4 × F = 8F.","misconception":"Halving the distance quadruples the force (inverse SQUARE), not doubles it.","hints":["Treat each change separately and multiply the factors."],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-024","subject":"Physics","topic":"Gravitation","level":3,"type":"numerical","q":"A newly discovered planet has the same average density as Earth but twice Earth’s radius. What is the acceleration due to gravity on its surface? (g on Earth = 9.8 m/s²)","options":["19.6 m/s²","4.9 m/s²","9.8 m/s²","39.2 m/s²"],"answer":0,"explanation":"g = GM/R² and M = ρ × (4/3)πR³, so g = (4/3)πGρR — proportional to R for a fixed density. Doubling R doubles g: 2 × 9.8 = 19.6 m/s². (The mass becomes 8 times larger, but the radius-squared term divides by 4.)","misconception":"4.9 m/s² assumes the mass stays the same while the radius doubles; but at the same density, a bigger planet has much more mass.","hints":["Write the planet’s mass in terms of density and radius.","Substitute into g = GM/R² — what power of R remains?"],"time":100,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-025","subject":"Physics","topic":"Gravitation","level":1,"type":"experiment","q":"A feather and a coin are released together inside a long tube from which all the air has been pumped out. What is observed?","options":["The coin lands first.","Both land together.","The feather lands first.","The feather floats."],"answer":1,"explanation":"Without air resistance, every object near Earth’s surface falls with the same acceleration g, whatever its mass. In air the feather falls slowly only because air resistance is large compared with its tiny weight.","misconception":"Heavier objects do not fall faster: a larger mass has a proportionally larger weight, so a = W/m = g is the same.","hints":["What slows the feather down in ordinary air?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-026","subject":"Physics","topic":"Gravitation","level":3,"type":"numerical","q":"At what height above Earth’s surface does the acceleration due to gravity fall to one-quarter of its surface value? (Earth’s radius ≈ 6400 km)","options":["6400 km","12,800 km","3200 km","1600 km"],"answer":0,"explanation":"g ∝ 1/r², where r is distance from Earth’s CENTRE. For g to become g/4, r must double: r = 2R. Height above the surface = 2R − R = R = 6400 km.","misconception":"12,800 km is the distance from the centre, not the height above the surface.","hints":["Gravity depends on distance from the centre of the Earth.","For ¼ of g, by what factor must that distance grow?"],"time":100,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-027","subject":"Physics","topic":"Gravitation","level":2,"type":"statement","q":"Consider:\\nI. Your weight can change from place to place on Earth.\\nII. g is slightly greater at the poles than at the equator.\\nIII. The universal gravitational constant G decreases with altitude.\\nWhich are correct?","options":["II and III only","I, II and III","I and III only","I and II only"],"answer":3,"explanation":"I: weight = mg and g varies, so weight varies. II: Earth is slightly flattened and spinning, so g ≈ 9.83 m/s² at the poles vs ≈ 9.78 m/s² at the equator. III: G is a universal constant (6.67 × 10⁻¹¹ N m² kg⁻²); it is g, not G, that changes.","misconception":"Mixing up g (local, variable) and G (universal constant) is one of the most common errors in gravitation.","hints":["Which symbol is a universal constant: g or G?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-028","subject":"Physics","topic":"Gravitation","level":3,"type":"what-if","q":"A simple pendulum of fixed length is taken to a planet where the acceleration due to gravity is four times that on Earth. What happens to its time period?","options":["It stays the same, because the length is unchanged.","It doubles.","It becomes one-quarter.","It halves."],"answer":3,"explanation":"T = 2π√(L/g). With g four times larger, √(1/4) = ½, so the period halves: the pendulum swings faster because the stronger gravity pulls it back more quickly.","misconception":"The period depends on the square ROOT of g, not on g directly, so ×4 gravity gives ½ the period, not ¼.","hints":["Recall T = 2π√(L/g).","What is √(1/4)?"],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-029","subject":"Physics","topic":"Gravitation","level":2,"type":"numerical","q":"A stone is dropped from rest from a cliff 80 m high. How long does it take to reach the ground? (g = 10 m/s², ignore air resistance)","options":["16 s","8 s","4 s","2.8 s"],"answer":2,"explanation":"h = ½gt² → 80 = 5t² → t² = 16 → t = 4 s.","misconception":"8 s comes from forgetting the ½ in h = ½gt²; 16 s forgets to take the square root.","hints":["Use h = ½gt²."],"time":45,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-030","subject":"Physics","topic":"Pressure & Buoyancy","level":1,"type":"application","q":"Why does a sharp knife cut vegetables more easily than a blunt one, for the same push?","options":["The sharp edge has a larger area, so the force is greater.","A sharp knife has less friction, so the force is greater.","A sharp knife is heavier.","The sharp edge has a smaller area, so the pressure is greater."],"answer":3,"explanation":"Pressure = force ÷ area. The same force acting on the tiny area of a sharp edge produces a much greater pressure, enough to break the vegetable’s cells.","misconception":"Sharpening does not change the force you apply — it changes the area over which it acts.","hints":["Pressure = force ÷ area. Which changes when a knife is sharpened?"],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-031","subject":"Physics","topic":"Pressure & Buoyancy","level":2,"type":"numerical","q":"A 2 kg brick rests on a table on its face measuring 10 cm × 20 cm. What pressure does it exert on the table? (g = 10 m/s²)","options":["4000 Pa","10 Pa","100 Pa","1000 Pa"],"answer":3,"explanation":"Weight = 2 × 10 = 20 N. Area = 0.1 m × 0.2 m = 0.02 m². Pressure = 20/0.02 = 1000 Pa.","misconception":"Using 200 cm² without converting to m² gives 0.1 — areas must be in m² for pascals (1 m² = 10,000 cm²).","hints":["Find the weight (force) first.","Convert cm to m before multiplying."],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-032","subject":"Physics","topic":"Pressure & Buoyancy","level":2,"type":"numerical","q":"Ice (density 900 kg/m³) floats in fresh water (1000 kg/m³). What percentage of an ice cube’s volume is above the water surface?","options":["90%","1%","10%","50%"],"answer":2,"explanation":"For a floating body, fraction submerged = ρ_body/ρ_liquid = 900/1000 = 0.9, i.e. 90% under water. So 10% is above the surface — the origin of “the tip of the iceberg”.","misconception":"90% is the fraction BELOW the surface.","hints":["Fraction submerged = density of body ÷ density of liquid."],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-033","subject":"Physics","topic":"Pressure & Buoyancy","level":3,"type":"what-if","q":"A glass is filled to the brim with water with an ice cube floating in it. The ice cube melts completely. What happens?","options":["The water level stays exactly at the brim.","It depends on the room temperature.","The water level falls.","Water overflows."],"answer":0,"explanation":"A floating ice cube displaces its own WEIGHT of water. When it melts, it becomes water of exactly that weight, which occupies exactly the volume it was already displacing. So the level does not change. (Melting LAND ice, which is not floating, does raise sea level.)","misconception":"The part of the ice above water seems as if it should overflow, but ice is less dense than water — it shrinks to fill exactly the “hole” it made.","hints":["How much water does a floating object displace — its volume or its weight?","What weight of water does the cube become when it melts?"],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-034","subject":"Physics","topic":"Pressure & Buoyancy","level":3,"type":"numerical","q":"A metal object weighs 10 N in air and 6 N when fully submerged in water (density 1000 kg/m³). What is the density of the metal?","options":["1667 kg/m³","2500 kg/m³","1500 kg/m³","4000 kg/m³"],"answer":1,"explanation":"Buoyant force = 10 − 6 = 4 N = weight of water displaced. Relative density = weight in air ÷ loss of weight in water = 10/4 = 2.5, so density = 2500 kg/m³.","misconception":"1667 kg/m³ comes from dividing by the apparent weight (6 N) instead of by the LOSS of weight (4 N).","hints":["The loss of weight equals the buoyant force.","Relative density = weight in air ÷ loss of weight in water."],"time":100,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-035","subject":"Physics","topic":"Pressure & Buoyancy","level":2,"type":"what-if","q":"An egg sinks in a glass of tap water but floats after enough salt is dissolved. What is the best explanation?","options":["Salt makes the egg lighter.","Salt dissolves the egg shell, making it hollow.","Salt reduces the surface tension of water.","Salt water is denser, so the same displaced volume weighs more and gives a larger upthrust."],"answer":3,"explanation":"Upthrust = volume displaced × density of liquid × g. Dissolving salt raises the density of the water. Once the liquid is denser than the egg, the upthrust on the fully submerged egg exceeds its weight and it rises until it floats.","misconception":"The egg’s weight does not change. An object floats or sinks depending on its density compared with the LIQUID’s density.","hints":["Which changes: the egg or the liquid?","Upthrust depends on the density of the liquid."],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-036","subject":"Physics","topic":"Pressure & Buoyancy","level":3,"type":"what-if","q":"A boat carrying a heavy iron anchor floats in a swimming pool. The anchor is thrown overboard and sinks to the bottom. What happens to the water level in the pool?","options":["It falls.","It rises.","It rises, then returns to the original level.","It stays the same."],"answer":0,"explanation":"In the boat, the anchor is floating indirectly, so it displaces water equal to its WEIGHT. Iron is about 8 times denser than water, so that is a large volume. On the bottom it displaces only its own VOLUME, which is much smaller. Less water is displaced, so the level falls.","misconception":"Many expect no change because “the same things are in the pool”. What matters is how much water is displaced: weight-equivalent when floating, volume-equivalent when sunk.","hints":["How much water does the anchor displace while it rides in the boat?","How much does it displace lying on the bottom? Compare, given iron is denser than water."],"time":100,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-037","subject":"Physics","topic":"Pressure & Buoyancy","level":1,"type":"numerical","q":"What is the pressure due to water alone at a depth of 10 m in a lake? (density of water 1000 kg/m³, g = 10 m/s²)","options":["1 × 10³ Pa","1 × 10⁴ Pa","1 × 10⁶ Pa","1 × 10⁵ Pa"],"answer":3,"explanation":"P = hρg = 10 × 1000 × 10 = 100,000 Pa = 1 × 10⁵ Pa — roughly the same as atmospheric pressure. So a diver at 10 m feels about twice the pressure at the surface.","misconception":"Pressure in a liquid depends on depth, not on the size or shape of the lake.","hints":["Use P = hρg."],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-038","subject":"Physics","topic":"Work, Energy & Power","level":2,"type":"reasoning","q":"How much work does Earth’s gravity do on a satellite moving in a perfectly circular orbit during one revolution?","options":["Positive, because gravity pulls the satellite","Zero, because the force is always perpendicular to the displacement","mgh, where h is the height of the orbit","Negative, because the satellite moves away from Earth"],"answer":1,"explanation":"W = Fs cos θ. In a circular orbit, gravity points to the centre while the motion is tangential, so θ = 90° and cos 90° = 0 at every instant. No work is done, which is why the satellite’s speed stays constant.","misconception":"A force can act continuously yet do no work if it is perpendicular to the motion.","hints":["What is the angle between gravity and the satellite’s velocity?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-039","subject":"Physics","topic":"Work, Energy & Power","level":2,"type":"numerical","q":"A 1000 kg car speeds up from 10 m/s to 20 m/s. How much work must the net force do on it?","options":["200 kJ","100 kJ","50 kJ","150 kJ"],"answer":3,"explanation":"Work–energy theorem: W = ΔKE = ½m(v² − u²) = ½ × 1000 × (400 − 100) = 150,000 J = 150 kJ.","misconception":"50 kJ uses ½m(v − u)², squaring the change in speed instead of taking the change in v².","hints":["Work done = change in kinetic energy.","Compute KE at each speed separately."],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-040","subject":"Physics","topic":"Work, Energy & Power","level":1,"type":"numerical","q":"A motor lifts a 200 kg load through a height of 15 m in 30 s at steady speed. What is the power output of the motor? (g = 10 m/s²)","options":["1000 W","600 W","100 W","3000 W"],"answer":0,"explanation":"Work = mgh = 200 × 10 × 15 = 30,000 J. Power = work/time = 30,000/30 = 1000 W = 1 kW.","misconception":"Forgetting g (using mass instead of weight) gives 100 W.","hints":["Work done against gravity = mgh.","Power = work ÷ time."],"time":45,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-041","subject":"Physics","topic":"Work, Energy & Power","level":3,"type":"numerical","q":"A pendulum bob is pulled aside until it is 45 cm higher than its lowest point and then released. Ignoring air resistance, how fast is it moving as it passes through the lowest point? (g = 10 m/s²)","options":["4.5 m/s","3 m/s","9 m/s","2.1 m/s"],"answer":1,"explanation":"Energy conservation: mgh = ½mv², so v = √(2gh) = √(2 × 10 × 0.45) = √9 = 3 m/s. The mass cancels, and the length of the string does not matter — only the drop in height.","misconception":"You do not need the length of the string or the mass of the bob: only the vertical height drop matters.","hints":["Which energy changes into which?","Set mgh = ½mv² and solve for v (h in metres)."],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-042","subject":"Physics","topic":"Work, Energy & Power","level":3,"type":"interdisciplinary","q":"A pump that is 75% efficient lifts 300 kg of water into a tank 20 m above the ground. How much electrical energy does it use? (g = 10 m/s²)","options":["75 kJ","80 kJ","45 kJ","60 kJ"],"answer":1,"explanation":"Useful work = mgh = 300 × 10 × 20 = 60,000 J. Efficiency = useful output/input, so input = 60,000/0.75 = 80,000 J = 80 kJ. The extra 20 kJ is wasted, mostly as heat and sound.","misconception":"45 kJ multiplies by 0.75 instead of dividing: the input must always be LARGER than the useful output.","hints":["Find the useful energy first.","Input energy = useful energy ÷ efficiency."],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-043","subject":"Physics","topic":"Work, Energy & Power","level":1,"type":"assertion-reason","q":"Assertion (A): A person holding a heavy suitcase while standing still does no work on the suitcase.\\nReason (R): Work done is zero when the displacement is zero.","options":["Both A and R are true, and R correctly explains A.","Both A and R are true, but R does not explain A.","A is true, but R is false.","A is false, but R is true."],"answer":0,"explanation":"W = Fs cos θ; with s = 0, W = 0 regardless of the force. The person still gets tired because muscles use chemical energy internally, but no mechanical work is done on the suitcase.","misconception":"Feeling tired is not evidence of mechanical work.","hints":["Does the suitcase move?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-044","subject":"Physics","topic":"Sound","level":1,"type":"mcq","q":"Astronauts on a spacewalk cannot hear each other directly even when shouting close by. Why?","options":["Sound needs a material medium, and space is almost a vacuum.","Sound is too slow in space.","Their frequencies are too high.","Cosmic radiation absorbs sound."],"answer":0,"explanation":"Sound is a mechanical wave — vibrations passed from particle to particle. In the near-vacuum of space there are almost no particles, so sound cannot travel. Astronauts use radio (an electromagnetic wave), which does not need a medium.","misconception":"Light and radio cross a vacuum because they are electromagnetic waves; sound cannot.","hints":["What does sound travel through?"],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-045","subject":"Physics","topic":"Sound","level":1,"type":"numerical","q":"A sound wave has a frequency of 500 Hz and a wavelength of 0.68 m. What is its speed?","options":["0.00136 m/s","735 m/s","340 m/s","170 m/s"],"answer":2,"explanation":"v = fλ = 500 × 0.68 = 340 m/s, the speed of sound in air at about 20 °C.","misconception":"Dividing f by λ instead of multiplying gives a meaningless 735.","hints":["Use v = f × λ."],"time":35,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-046","subject":"Physics","topic":"Sound","level":3,"type":"numerical","q":"The sensation of a sound persists in our brain for about 0.1 s. What is the minimum distance from a reflecting wall for a distinct echo to be heard, if the speed of sound is 344 m/s?","options":["8.6 m","34.4 m","172 m","17.2 m"],"answer":3,"explanation":"For a distinct echo, the reflected sound must arrive at least 0.1 s after the original. In 0.1 s sound travels 34.4 m — but that is the round trip, there and back. So the wall must be at least 34.4/2 = 17.2 m away.","misconception":"34.4 m forgets that the sound has to travel to the wall AND back.","hints":["How far does sound go in 0.1 s?","An echo is a round trip."],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-047","subject":"Physics","topic":"Sound","level":3,"type":"what-if","q":"A sound wave passes from air into water, where sound travels about four times faster. Which describes the wave in water?","options":["Same frequency, longer wavelength","Lower frequency, longer wavelength","Higher frequency, same wavelength","Same frequency, shorter wavelength"],"answer":0,"explanation":"Frequency is set by the source and does not change when a wave crosses into a new medium (every incoming vibration produces one vibration on the other side). Since v = fλ and v increases about 4 times, λ increases about 4 times.","misconception":"Pitch (frequency) does not change at a boundary — the wavelength changes instead.","hints":["What decides frequency: the source or the medium?","Then use v = fλ."],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"PHY-048","subject":"Physics","topic":"Sound","level":2,"type":"numerical","q":"A ship’s SONAR sends an ultrasonic pulse straight down. The echo from the seabed returns after 2 s. If sound travels at 1500 m/s in sea water, how deep is the sea?","options":["1500 m","3000 m","6000 m","750 m"],"answer":0,"explanation":"Total path = 1500 × 2 = 3000 m, which is down and back up. Depth = 3000/2 = 1500 m.","misconception":"3000 m forgets that the pulse travels the depth twice.","hints":["Distance = speed × time — but for which journey?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-049","subject":"Physics","topic":"Sound","level":2,"type":"reasoning","q":"Putting your ear to a railway line, you can hear an approaching train before you hear it through the air. Why?","options":["Sound travels faster in steel than in air.","Sound travels in straight lines only through solids.","Steel amplifies sound.","Air absorbs all low-frequency sound."],"answer":0,"explanation":"In solids, particles are tightly bound and very stiff, so vibrations pass on quickly: sound travels at about 5000–6000 m/s in steel compared with about 340 m/s in air. The sound through the rail arrives first.","misconception":"It is not that steel makes sound louder; the key difference is speed.","hints":["In which state of matter does sound travel fastest?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"PHY-050","subject":"Physics","topic":"Light","level":1,"type":"mcq","q":"Which set describes the image formed by a plane mirror?","options":["Real, erect and magnified","Virtual, inverted and smaller","Virtual, erect, laterally inverted and the same size","Real, inverted and the same size"],"answer":2,"explanation":"Reflected rays from a plane mirror diverge; they only appear to come from a point behind the mirror, so the image is virtual. It is upright, the same size, as far behind the mirror as the object is in front, and left–right reversed (lateral inversion).","misconception":"The image is not “on” the mirror — it is located behind it.","hints":["Can the image be caught on a screen?"],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-051","subject":"Physics","topic":"Light","level":2,"type":"numerical","q":"Light travels at 3 × 10⁸ m/s in vacuum and 2.25 × 10⁸ m/s in water. What is the refractive index of water?","options":["1.33","0.75","2.25","1.5"],"answer":0,"explanation":"n = c/v = (3 × 10⁸)/(2.25 × 10⁸) = 1.33. Refractive index is always greater than 1 for a material medium because light is slower in it than in vacuum.","misconception":"0.75 is v/c, the inverse ratio.","hints":["n = speed in vacuum ÷ speed in medium."],"time":40,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-052","subject":"Physics","topic":"Light","level":3,"type":"numerical","q":"An object is placed 15 cm in front of a convex lens of focal length 10 cm. Where is the image formed?","options":["6 cm on the same side (virtual)","30 cm on the other side of the lens (real)","15 cm on the other side (real)","60 cm on the other side (real)"],"answer":1,"explanation":"Lens formula 1/v − 1/u = 1/f with u = −15 cm, f = +10 cm: 1/v = 1/10 − 1/15 = 1/30, so v = +30 cm. Positive v means a real image on the opposite side; magnification = v/u = −2 (inverted, twice the size).","misconception":"6 cm comes from adding 1/10 + 1/15 — the sign convention for the object distance matters.","hints":["Use 1/v − 1/u = 1/f with u negative.","The object is between f and 2f; where should the image be?"],"time":90,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-053","subject":"Physics","topic":"Light","level":3,"type":"what-if","q":"A glass convex lens (refractive index 1.5) is placed under water (refractive index 1.33). How does its behaviour change?","options":["It converges light less strongly — its focal length increases.","It becomes a diverging lens.","It converges light more strongly — its focal length decreases.","Nothing changes; focal length depends only on the curvature."],"answer":0,"explanation":"A lens bends light because of the DIFFERENCE between its refractive index and that of the surrounding medium. Glass in water has a much smaller contrast (1.5 vs 1.33) than glass in air (1.5 vs 1.0), so rays bend less and the focal length becomes longer (about four times longer for these values). It stays converging because glass is still optically denser than water.","misconception":"Focal length depends on the surrounding medium as well as the curvature.","hints":["Why does a lens bend light at all?","Compare the index contrast glass–air with glass–water."],"time":80,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"PHY-054","subject":"Physics","topic":"Light","level":2,"type":"reasoning","q":"Why does the clear daytime sky look blue, while the Sun looks reddish at sunset?","options":["Air molecules scatter short (blue) wavelengths much more than long (red) ones.","Blue light travels faster through air than red light.","Ozone is blue in colour.","The oceans reflect blue light into the sky."],"answer":0,"explanation":"Small air molecules scatter light far more strongly at short wavelengths, so blue light is scattered across the sky and reaches our eyes from all directions. At sunset sunlight passes through much more air, so most blue is scattered out of the direct beam and the remaining light reaching us is reddish.","misconception":"The sky is not blue because of reflection from the sea — the sky is blue over deserts too.","hints":["What happens to sunlight when it meets tiny air molecules?"],"time":50,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-055","subject":"Physics","topic":"Light","level":2,"type":"numerical","q":"A concave (diverging) lens has a focal length of 50 cm. What is its power?","options":["−50 D","−2 D","−0.5 D","+2 D"],"answer":1,"explanation":"P = 1/f with f in metres. A diverging lens has negative focal length: f = −0.5 m, so P = 1/(−0.5) = −2 dioptres. Such lenses correct short-sightedness.","misconception":"−50 D uses centimetres instead of metres; +2 D ignores the sign of a diverging lens.","hints":["Convert the focal length to metres.","Diverging lenses have negative focal length."],"time":40,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-056","subject":"Physics","topic":"Electricity","level":1,"type":"mcq","q":"Three different resistors are connected in series to a battery. Which quantity is the same for all three?","options":["Potential difference across each","Power dissipated in each","Current through each","Resistance of each"],"answer":2,"explanation":"In a series circuit there is only one path, so the same charge per second (current) passes through every component. The potential difference divides in proportion to the resistances (V = IR), and so does the power (P = I²R).","misconception":"In series, current is shared equally — it is voltage that is split. In parallel it is the other way round.","hints":["How many paths does the current have in a series circuit?"],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-057","subject":"Physics","topic":"Electricity","level":2,"type":"what-if","q":"A wire has a resistance of 5 Ω. A second wire of the same material and the same cross-sectional area is twice as long. What is its resistance?","options":["20 Ω","10 Ω","5 Ω","2.5 Ω"],"answer":1,"explanation":"R = ρL/A. With the same material (ρ) and area (A), resistance is directly proportional to length. Twice the length → twice the resistance = 10 Ω. Electrons have twice as far to travel through the obstructing lattice.","misconception":"20 Ω applies to a wire STRETCHED to double length, where the area also halves; here the area is unchanged.","hints":["Write R in terms of ρ, L and A.","Which of these change?"],"time":50,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"PHY-058","subject":"Physics","topic":"Electricity","level":3,"type":"numerical","q":"Two 6 Ω resistors are connected in parallel, and this combination is connected in series with a third 6 Ω resistor across an 18 V battery. What current does the battery supply?","options":["6 A","1 A","3 A","2 A"],"answer":3,"explanation":"Two 6 Ω in parallel: 1/R = 1/6 + 1/6 → R = 3 Ω. Adding the series 6 Ω gives 9 Ω total. I = V/R = 18/9 = 2 A.","misconception":"1 A treats all three as one series chain (18 Ω); 6 A forgets the series resistor (18 ÷ 3); 3 A uses a single 6 Ω resistor. Simplify the parallel pair first, then add the series part.","hints":["Simplify the parallel pair first.","Then add the series resistor and use I = V/R."],"t
