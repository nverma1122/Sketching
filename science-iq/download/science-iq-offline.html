ime":90,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-059","subject":"Physics","topic":"Electricity","level":3,"type":"reasoning","q":"A 100 W bulb and a 60 W bulb (both rated for 220 V) are connected in SERIES across a 220 V supply. Which glows more brightly?","options":["Both equally","The 100 W bulb","The 60 W bulb","Neither glows at all"],"answer":2,"explanation":"From P = V²/R at rated voltage, R = V²/P: the 60 W bulb has the larger resistance (≈ 807 Ω vs 484 Ω). In series, both carry the same current, so the power P = I²R is greater in the bulb with greater resistance — the 60 W bulb glows brighter. (Both glow dimmer than normal.)","misconception":"The power rating applies only at 220 V across EACH bulb; in series neither gets its rated voltage.","hints":["Which bulb has the higher resistance? Use R = V²/P.","In series, which quantity is common to both bulbs?"],"time":100,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"PHY-060","subject":"Physics","topic":"Electricity","level":2,"type":"numerical","q":"A 1500 W electric heater is used for 2 hours. How much electrical energy does it use, in kilowatt-hours?","options":["0.75 kWh","30 kWh","3 kWh","3000 kWh"],"answer":2,"explanation":"Energy = power × time = 1.5 kW × 2 h = 3 kWh (3 “units” on an electricity bill). In joules this is 3 × 3.6 × 10⁶ = 1.08 × 10⁷ J.","misconception":"3000 kWh forgets to convert watts to kilowatts.","hints":["Convert 1500 W to kW.","Energy (kWh) = kW × hours."],"time":40,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-061","subject":"Physics","topic":"Magnetism","level":1,"type":"mcq","q":"Why can two magnetic field lines never cross each other?","options":["Field lines repel each other.","Field lines only exist outside the magnet.","At a crossing point the field would have two directions at once, which is impossible.","Field lines always run parallel."],"answer":2,"explanation":"The tangent to a field line at any point gives the direction a compass needle would point. If two lines crossed, a compass at that point would have to point two ways at once — impossible, since the field has a single direction at each point.","misconception":"Field lines are a model of direction; they are not physical strings that push each other.","hints":["What does the direction of a field line at a point tell you?"],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-062","subject":"Physics","topic":"Magnetism","level":2,"type":"application","q":"Which change would NOT make an electromagnet stronger?","options":["Increasing the current","Winding the coil more tightly around the same soft-iron core","Replacing the soft-iron core with a copper core","Increasing the number of turns of wire"],"answer":2,"explanation":"An electromagnet’s strength increases with current and with the number of turns, and a soft-iron core concentrates the field enormously because iron is magnetic. Copper is non-magnetic, so replacing iron with copper would make the electromagnet much WEAKER.","misconception":"Copper is an excellent conductor, but conducting electricity is not the same as being magnetic.","hints":["Which of these materials is attracted to a magnet?"],"time":45,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-063","subject":"Physics","topic":"Magnetism","level":3,"type":"experiment","q":"A coil is connected to a sensitive galvanometer. Consider:\\nI. Pushing a bar magnet into the coil deflects the needle.\\nII. Holding the magnet still inside the coil keeps the needle deflected.\\nIII. Pulling the magnet out deflects the needle the opposite way.\\nIV. Moving the magnet faster gives a larger deflection.\\nWhich are correct?","options":["I and II only","I, III and IV only","All four","I, II and III only"],"answer":1,"explanation":"Electromagnetic induction (Faraday): a current is induced only while the magnetic field through the coil is CHANGING. A stationary magnet causes no change, so no current (II is false). Reversing the motion reverses the current (III), and faster change gives a larger induced current (IV).","misconception":"A magnet sitting in a coil does not produce electricity — only change does.","hints":["What has to be changing for a current to be induced?"],"time":80,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-064","subject":"Physics","topic":"Magnetism","level":2,"type":"mcq","q":"Fleming’s left-hand rule is used to find the direction of:","options":["the magnetic field around a straight wire","the poles of a bar magnet","the force on a current-carrying conductor in a magnetic field","the induced current in a generator"],"answer":2,"explanation":"Left hand: First finger = Field, seCond finger = Current, thuMb = Motion (force). It gives the force on a current-carrying conductor — the principle of the electric motor. The RIGHT-hand rule gives induced current (generators).","misconception":"Left hand → motors; right hand → generators.","hints":["Which device turns current into motion?"],"time":35,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-065","subject":"Physics","topic":"Heat","level":1,"type":"mcq","q":"Heat from the Sun reaches Earth through the near-vacuum of space by:","options":["conduction","convection","radiation","both conduction and convection"],"answer":2,"explanation":"Conduction and convection need particles of matter. Radiation is the transfer of energy by electromagnetic waves (infrared, visible light), which travel through a vacuum.","misconception":"Convection needs a fluid to flow; there is almost none in space.","hints":["Which method of heat transfer needs no medium?"],"time":25,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-066","subject":"Physics","topic":"Heat","level":2,"type":"numerical","q":"How much heat is needed to raise the temperature of 2 kg of water from 20 °C to 70 °C? (specific heat capacity of water = 4200 J kg⁻¹ °C⁻¹)","options":["210 kJ","420 kJ","42 kJ","840 kJ"],"answer":1,"explanation":"Q = mcΔT = 2 × 4200 × 50 = 420,000 J = 420 kJ.","misconception":"840 kJ uses 100 °C rise or doubles twice; ΔT is 70 − 20 = 50 °C.","hints":["Q = m × c × ΔT."],"time":50,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-067","subject":"Physics","topic":"Heat","level":3,"type":"numerical","q":"1 kg of water at 80 °C is mixed with 3 kg of water at 20 °C in an insulated container. What is the final temperature?","options":["30 °C","50 °C","40 °C","35 °C"],"answer":3,"explanation":"Heat lost by hot water = heat gained by cold water: 1 × c × (80 − T) = 3 × c × (T − 20) → 80 − T = 3T − 60 → T = 35 °C. It is a weighted average of the temperatures, weighted by mass.","misconception":"50 °C is the simple average, which only applies to equal masses.","hints":["Heat lost = heat gained.","Should the answer be closer to 80 or to 20? Why?"],"time":80,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"PHY-068","subject":"Physics","topic":"Heat","level":1,"type":"application","q":"Why are small gaps left between sections of railway track?","options":["To save steel","To allow the rails to expand in hot weather without buckling","To reduce the noise of trains","To drain rainwater"],"answer":1,"explanation":"Metals expand when heated. Without gaps, rails heated by summer sun would push against each other and buckle. (Modern continuous welded rail is pre-stressed to manage the same problem.)","hints":["What happens to the length of a steel rail when it gets hot?"],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"PHY-069","subject":"Physics","topic":"Heat","level":3,"type":"what-if","q":"What would happen to the boiling point of water if the atmospheric pressure above it were increased?","options":["It would rise above 100 °C.","Water would no longer boil at any temperature.","It would fall below 100 °C.","It would stay at 100 °C, a fixed property of water."],"answer":0,"explanation":"Water boils when its vapour pressure equals the pressure above it. Higher outside pressure means the water must be hotter before its vapour pressure is high enough. That is why a pressure cooker (≈ 2 atm) cooks at about 120 °C, while at high altitude water boils below 100 °C.","misconception":"100 °C is the boiling point only at standard atmospheric pressure — not a fixed constant.","hints":["When does a liquid boil: think about bubbles of vapour pushing against the surroundings.","Compare cooking on a mountain with a pressure cooker."],"time":70,"tracks":["MVPP","GEN"],"iq":true,"verified":true}]`),gv=Object.freeze(Object.defineProperty({__proto__:null,default:pv},Symbol.toStringTag,{value:"Module"})),yv=JSON.parse('[{"id":"REA-001","subject":"Scientific Reasoning","topic":"Patterns","level":1,"type":"reasoning","q":"The gaps between the terms of 2, 6, 12, 20, 30 follow a rule. Which term comes after 30?","options":["44","42","36","40"],"answer":1,"explanation":"Differences are 4, 6, 8, 10 — increasing by 2 — so the next difference is 12: 30 + 12 = 42. (The terms are also n(n + 1): 1×2, 2×3, 3×4 … 6×7 = 42.)","hints":["Look at the differences between consecutive terms."],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-002","subject":"Scientific Reasoning","topic":"Patterns","level":2,"type":"reasoning","q":"Each term of 3, 5, 9, 17, 33 is obtained from the one before it by the same two operations. What is the next term?","options":["66","49","57","65"],"answer":3,"explanation":"Each term is double the previous minus 1: 3×2−1 = 5, 5×2−1 = 9, … 33×2−1 = 65. Equivalently, the differences 2, 4, 8, 16 double, so the next difference is 32.","misconception":"49 assumes the differences grow by a fixed amount.","hints":["Compare each term with twice the previous one."],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-003","subject":"Scientific Reasoning","topic":"Patterns","level":3,"type":"reasoning","q":"Which number continues the sequence 1, 4, 27, 256?","options":["1296","3125","625","1024"],"answer":1,"explanation":"The terms are nⁿ: 1¹ = 1, 2² = 4, 3³ = 27, 4⁴ = 256, so the next is 5⁵ = 3125.","misconception":"625 = 5⁴ continues only the base, not the exponent.","hints":["Try writing each term as a power.","Is the base or the exponent changing — or both?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"REA-004","subject":"Scientific Reasoning","topic":"Patterns","level":2,"type":"reasoning","q":"Find the next letter: A, C, F, J, O, ?","options":["U","T","S","V"],"answer":0,"explanation":"Positions are 1, 3, 6, 10, 15 — the gaps are +2, +3, +4, +5 — so add 6: 15 + 6 = 21 = U.","hints":["Convert letters to their positions in the alphabet."],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-005","subject":"Scientific Reasoning","topic":"Patterns","level":1,"type":"reasoning","q":"Which is the odd one out?","options":["Silver","Aluminium","Sulphur","Copper"],"answer":2,"explanation":"Copper, silver and aluminium are metals (good conductors of heat and electricity). Sulphur is a non-metal and a poor conductor.","hints":["Group them by a property such as conductivity."],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-006","subject":"Scientific Reasoning","topic":"Patterns","level":2,"type":"reasoning","q":"Thermometer : Temperature :: Ammeter : ?","options":["Voltage","Power","Resistance","Current"],"answer":3,"explanation":"A thermometer measures temperature; an ammeter measures electric current (in amperes). A voltmeter measures potential difference.","hints":["What unit does an ammeter’s name come from?"],"time":35,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-007","subject":"Scientific Reasoning","topic":"Logical Reasoning","level":2,"type":"reasoning","q":"If CAT is coded as DBU, how is DOG coded?","options":["EOG","DPH","EPH","CNF"],"answer":2,"explanation":"Each letter moves one place forward: C→D, A→B, T→U. So D→E, O→P, G→H: EPH.","hints":["Compare each letter with its code letter."],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-008","subject":"Scientific Reasoning","topic":"Logical Reasoning","level":3,"type":"reasoning","q":"In a code, TEA is written as BFU. Using the same rule, how is SUN written?","options":["MTR","OVT","OUT","TVO"],"answer":1,"explanation":"The rule is: reverse the word, then move each letter one place forward. TEA → AET → BFU ✓. SUN → NUS → OVT.","misconception":"TVO shifts the letters but forgets to reverse the order.","hints":["Compare the first letter of the code with the LAST letter of the word.","Reverse first, then look at the shift."],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"REA-009","subject":"Scientific Reasoning","topic":"Logical Reasoning","level":2,"type":"reasoning","q":"A girl walks 5 km north, turns right and walks 3 km, then turns right again and walks 9 km. How far and in which direction is she from her starting point?","options":["5 km north-east","5 km south-east","4 km south","17 km south-east"],"answer":1,"explanation":"North 5, then right (east) 3, then right (south) 9: she ends 3 km east and 9 − 5 = 4 km south of the start. Distance = √(3² + 4²) = 5 km, towards the south-east.","misconception":"17 km is the total distance walked, not the displacement.","hints":["Turning right from north faces east; right again faces south.","Find the net east and net south distances."],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-010","subject":"Scientific Reasoning","topic":"Logical Reasoning","level":2,"type":"reasoning","q":"Pointing to a girl in a photograph, Ravi says, “She is the daughter of the only son of my paternal grandfather.” How is the girl related to Ravi?","options":["Sister","Cousin","Niece","Aunt"],"answer":0,"explanation":"The only son of Ravi’s paternal grandfather is Ravi’s father. The daughter of Ravi’s father is Ravi’s sister.","misconception":"Cousin would need the grandfather to have another son or a daughter.","hints":["Who is the only son of Ravi’s father’s father?"],"time":45,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-011","subject":"Scientific Reasoning","topic":"Logical Reasoning","level":1,"type":"reasoning","q":"In a row of 40 students, Meena is 12th from the left. What is her position from the right?","options":["29th","30th","28th","52nd"],"answer":0,"explanation":"Position from right = total − position from left + 1 = 40 − 12 + 1 = 29.","misconception":"28 forgets to add 1 (Meena herself is counted in both directions).","hints":["How many students stand to her right?"],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-012","subject":"Scientific Reasoning","topic":"Logical Reasoning","level":3,"type":"reasoning","q":"What is the angle between the hour hand and the minute hand of a clock at 3:40?","options":["140°","120°","150°","130°"],"answer":3,"explanation":"Minute hand: 40 × 6° = 240° from 12. Hour hand: 3 × 30° + 40 × 0.5° = 110° (it moves 0.5° per minute). Angle = 240° − 110° = 130°.","misconception":"150° ignores that the hour hand has moved past the 3 by 20°.","hints":["The minute hand moves 6° per minute.","The hour hand also moves: 0.5° per minute."],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-013","subject":"Scientific Reasoning","topic":"Logical Reasoning","level":2,"type":"reasoning","q":"1 January 2025 was a Wednesday. On which day of the week did 1 January 2026 fall?","options":["Friday","Wednesday","Tuesday","Thursday"],"answer":3,"explanation":"2025 is not a leap year, so it has 365 days = 52 weeks + 1 day. The day of the week moves forward by one: Wednesday → Thursday.","misconception":"Friday would apply after a leap year (366 days = 52 weeks + 2 days).","hints":["How many days are left over after removing complete weeks from 365?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-014","subject":"Scientific Reasoning","topic":"Logical Reasoning","level":2,"type":"reasoning","q":"Statements: All roses are flowers. Some flowers fade quickly.\\nConclusion: Some roses fade quickly.\\nDoes the conclusion follow?","options":["No — roses are not flowers.","Yes — roses are flowers, so some must fade quickly.","Yes — all flowers fade quickly.","No — the flowers that fade quickly may not include any roses."],"answer":3,"explanation":"Roses are a subset of flowers, and “some flowers” fade quickly — but those could all be non-roses. Since a Venn diagram can be drawn where no rose fades quickly, the conclusion does not necessarily follow.","misconception":"A conclusion must be true in EVERY possible arrangement, not just one.","hints":["Can you draw a diagram where the statements are true but no rose fades quickly?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-015","subject":"Scientific Reasoning","topic":"Logical Reasoning","level":3,"type":"reasoning","q":"If “+” means “×”, “×” means “−”, “−” means “÷” and “÷” means “+”, what is the value of 8 + 3 − 6 × 2 ÷ 1?","options":["3","5","1","7"],"answer":0,"explanation":"Substitute: 8 × 3 ÷ 6 − 2 + 1. Using the normal order (÷ and × first, left to right): 24 ÷ 6 = 4, then 4 − 2 + 1 = 3.","misconception":"Working strictly left to right after substitution happens to give the same here; the common slip is substituting the wrong symbol.","hints":["Rewrite the expression with the real operations first.","Then apply the usual order of operations."],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-016","subject":"Scientific Reasoning","topic":"Numerical Reasoning","level":3,"type":"reasoning","q":"In a class of 50 students, 30 like Physics, 25 like Chemistry and 10 like both. How many like neither?","options":["10","0","15","5"],"answer":3,"explanation":"Students who like at least one = 30 + 25 − 10 = 45 (the 10 who like both were counted twice). Neither = 50 − 45 = 5.","misconception":"0 assumes 30 + 25 = 55 covers everyone, double-counting the 10.","hints":["Draw a Venn diagram with two overlapping circles.","Students who like both are counted in both totals."],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-017","subject":"Scientific Reasoning","topic":"Numerical Reasoning","level":2,"type":"numerical","q":"Pipe A alone fills a tank in 6 hours and pipe B alone fills it in 3 hours. How long do both together take?","options":["9 hours","1.5 hours","4.5 hours","2 hours"],"answer":3,"explanation":"In one hour A fills 1/6 and B fills 1/3 = 2/6 of the tank; together 3/6 = 1/2 per hour, so 2 hours.","misconception":"4.5 hours averages the times — adding pipes must make it faster than either alone.","hints":["What fraction of the tank does each pipe fill in one hour?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-018","subject":"Scientific Reasoning","topic":"Numerical Reasoning","level":3,"type":"numerical","q":"A bus travels from town P to town Q at 60 km/h and returns along the same road at 40 km/h. What is its average speed for the round trip?","options":["52 km/h","50 km/h","48 km/h","45 km/h"],"answer":2,"explanation":"Let the distance be d. Time = d/60 + d/40 = 5d/120 = d/24. Average speed = 2d ÷ (d/24) = 48 km/h. The bus spends longer at the slower speed, so the average is below 50.","misconception":"50 km/h averages the speeds, which works only for equal TIMES, not equal distances.","hints":["Average speed = total distance ÷ total time.","Try a convenient distance such as 120 km each way."],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"REA-019","subject":"Scientific Reasoning","topic":"Numerical Reasoning","level":1,"type":"numerical","q":"On a map with scale 1 : 50,000, two villages are 4 cm apart. What is the real distance between them?","options":["0.2 km","20 km","2 km","200 m"],"answer":2,"explanation":"4 cm × 50,000 = 200,000 cm = 2000 m = 2 km.","hints":["1 km = 100,000 cm."],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-020","subject":"Scientific Reasoning","topic":"Numerical Reasoning","level":2,"type":"numerical","q":"A bacterial population doubles every 20 minutes. Starting with 100 bacteria, how many will there be after 2 hours (with no limits on growth)?","options":["600","3200","1200","6400"],"answer":3,"explanation":"2 hours = 120 minutes = 6 doubling periods. 100 × 2⁶ = 100 × 64 = 6400. Exponential growth quickly outpaces linear growth: adding 100 every 20 minutes would give only 700.","misconception":"1200 multiplies 100 by 12 (or 2 × 6) instead of doubling six times.","hints":["How many 20-minute periods are in 2 hours?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-021","subject":"Scientific Reasoning","topic":"Numerical Reasoning","level":3,"type":"numerical","q":"Estimate: about how many times does a human heart beat in a 70-year life at an average 70 beats per minute?","options":["≈ 2.58 × 10¹²","≈ 2.58 × 10⁶","≈ 4.9 × 10⁷","≈ 2.58 × 10⁹"],"answer":3,"explanation":"Beats = 70 per min × 60 min × 24 h × 365 days × 70 years ≈ 2.58 × 10⁹ — about two and a half billion. Order-of-magnitude estimates like this are a key scientific skill.","misconception":"4.9 × 10⁷ stops after one year’s minutes; carry the calculation through every unit.","hints":["Beats per year = beats per minute × minutes in a year.","Then multiply by the number of years."],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"REA-022","subject":"Scientific Reasoning","topic":"Experimental Design","level":1,"type":"experiment","q":"A student investigates how the amount of fertiliser affects the height of bean plants. Which is the independent variable?","options":["The amount of fertiliser","The type of soil","The height of the plants","The amount of water"],"answer":0,"explanation":"The independent variable is the one the experimenter deliberately changes (fertiliser amount). Plant height is the dependent variable (measured). Soil type and water are control variables that should be kept the same.","misconception":"The variable you measure is the dependent variable, not the independent one.","hints":["Which variable does the student choose and change?"],"time":35,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-023","subject":"Scientific Reasoning","topic":"Experimental Design","level":2,"type":"experiment","q":"A company claims its new toothpaste prevents cavities. Which test would give the most reliable evidence?","options":["Compare the company’s staff with people from another city.","Ask ten people who like the toothpaste whether they got fewer cavities.","Randomly split many similar volunteers into two groups using identical-looking tubes — new toothpaste or ordinary — and compare new cavities after a year.","Give the new toothpaste to everyone and count cavities after a year."],"answer":2,"explanation":"A large, randomised, controlled and blinded trial keeps everything except the toothpaste similar between groups, so any difference can be attributed to the toothpaste. The other designs lack a fair control group or introduce bias.","misconception":"Without a control group, there is nothing to compare with.","hints":["What should the only difference between the groups be?","Why might it matter if people know which toothpaste they are using?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-024","subject":"Scientific Reasoning","topic":"Experimental Design","level":3,"type":"experiment","q":"A student wants to find out whether the length of a pendulum affects its time period. Which set of variables must be kept CONSTANT?","options":["The mass of the bob and the starting angle (kept small)","Only the colour of the bob","The length and the mass","The time period and the length"],"answer":0,"explanation":"Length is the independent variable and the period is the dependent variable. To make the test fair, other factors that might affect the period — the mass of the bob and the amplitude (starting angle, kept small) — must be held constant. (In fact, the period barely depends on mass, but the experiment must not assume that.)","misconception":"You cannot keep length constant — it is the variable being tested.","hints":["Which variable is changed and which is measured?","What else might affect how a pendulum swings?"],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"REA-025","subject":"Scientific Reasoning","topic":"Experimental Design","level":2,"type":"experiment","q":"Why do scientists repeat an experiment several times and average the results?","options":["To change the independent variable","To reduce the effect of random errors and check that results are reliable","To remove systematic errors completely","To make the experiment take longer"],"answer":1,"explanation":"Random errors scatter readings above and below the true value, so averaging repeats reduces their effect, and consistent repeats show the result is reliable. Systematic errors (e.g. a balance that always reads 2 g high) shift every reading and are NOT removed by averaging.","misconception":"Repeating does not fix a systematic error such as a zero error on an instrument.","hints":["Which kind of error makes readings vary randomly?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-026","subject":"Scientific Reasoning","topic":"Experimental Design","level":3,"type":"experiment","q":"Bean seeds are set up in four tubes for a week:\\nA – dry cotton, warm, air\\nB – moist cotton, warm, air\\nC – moist cotton, in a refrigerator, air\\nD – seeds under boiled, cooled water with a layer of oil on top, warm\\nOnly the seeds in B germinate. What is the correct conclusion?","options":["Germination needs light.","Germination needs only warmth.","Germination needs water, a suitable temperature and oxygen.","Germination needs only water."],"answer":2,"explanation":"Compare each tube with B: A lacks water, C lacks warmth, D lacks oxygen (boiling removes dissolved air and the oil stops more dissolving). Each fails, so each factor is necessary. Light was not tested — all tubes could be in the same light.","misconception":"Light cannot be concluded because no tube tested it.","hints":["Compare each failing tube with B — what is missing?","Why was the water in D boiled and covered with oil?"],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"REA-027","subject":"Scientific Reasoning","topic":"Data Interpretation","level":2,"type":"data","q":"A toy car starts from rest. Its distance is recorded each second. Assuming uniform acceleration, what is the acceleration?","options":["8 m/s²","16 m/s²","2 m/s²","4 m/s²"],"answer":3,"explanation":"Distance grows as t² (2 × 1, 2 × 4, 2 × 9, 2 × 16), the signature of uniform acceleration from rest. s = ½at² → 32 = ½ × a × 16 → a = 4 m/s². Check at t = 1: ½ × 4 × 1 = 2 m ✓.","misconception":"2 m/s² reads the coefficient of t² directly and forgets the ½.","hints":["Is the distance proportional to t or t²?","Use s = ½at² with any row."],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":false,"table":{"head":["Time (s)","0","1","2","3","4"],"rows":[["Distance (m)",0,2,8,18,32]]},"verified":true},{"id":"REA-028","subject":"Scientific Reasoning","topic":"Data Interpretation","level":3,"type":"data","q":"The table shows the solubility of potassium nitrate in water. A saturated solution in 100 g of water at 60 °C is cooled to 20 °C. What mass of crystals forms?","options":["32 g","78 g","110 g","46 g"],"answer":1,"explanation":"At 60 °C, 110 g dissolves in 100 g of water. At 20 °C only 32 g can stay dissolved. The excess, 110 − 32 = 78 g, crystallises out. This is how crystallisation purifies substances.","misconception":"46 g uses the 40 °C to 60 °C difference.","hints":["How much was dissolved at 60 °C, and how much can stay dissolved at 20 °C?"],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":false,"table":{"head":["Temperature (°C)","20","40","60"],"rows":[["Solubility (g per 100 g water)",32,64,110]]},"verified":true},{"id":"REA-029","subject":"Scientific Reasoning","topic":"Data Interpretation","level":2,"type":"data","q":"The activity of an enzyme was measured at different temperatures. Which conclusion is best supported?","options":["Temperature has no effect on activity.","Activity always increases with temperature.","The enzyme works best at 55 °C.","Activity is highest near 37 °C and falls sharply above it, as the enzyme is denatured."],"answer":3,"explanation":"Activity rises from 10 °C to a peak at 37 °C (the optimum) because molecules move faster and collide more. Above the optimum, heat changes the enzyme’s shape (denaturation), so activity drops to almost zero at 55 °C.","hints":["Where is the peak?","What happens after the peak?"],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":false,"table":{"head":["Temperature (°C)","10","20","30","37","45","55"],"rows":[["Activity (units)",5,12,25,40,22,3]]},"verified":true},{"id":"REA-030","subject":"Scientific Reasoning","topic":"Data Interpretation","level":3,"type":"data","q":"A study of 5 towns found that towns with more storks also had more babies born. Which conclusion is most scientifically sound?","options":["Storks bring babies.","Babies attract storks.","There is no relationship in the data.","Both increase with town size, so the correlation does not show that storks cause births."],"answer":3,"explanation":"Both stork pairs and births rise with population — larger towns have more buildings for nests and more people. A third variable (town size) explains the correlation. Correlation alone never proves causation.","misconception":"A strong correlation can be produced entirely by a hidden third factor.","hints":["Look at the third row of the table.","Could one factor cause both of the others?"],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":true,"table":{"head":["Town","A","B","C","D","E"],"rows":[["Stork pairs",2,5,9,14,20],["Births per year",80,150,260,390,560],["Population (thousands)",4,8,13,20,28]]},"verified":true},{"id":"REA-031","subject":"Scientific Reasoning","topic":"Observation & Inference","level":1,"type":"reasoning","q":"Which of these is an OBSERVATION rather than an inference?","options":["The powder was impure.","The powder contains copper.","A chemical reaction released energy.","The solution turned blue when the powder was added."],"answer":3,"explanation":"An observation is what is directly detected with the senses or instruments (a colour change). The other statements are inferences — explanations or conclusions drawn from observations, which could be wrong.","hints":["Which statement simply describes what was seen?"],"time":35,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-032","subject":"Scientific Reasoning","topic":"Observation & Inference","level":2,"type":"reasoning","q":"You see puddles on the road early in the morning. Which statement is an inference?","options":["It rained during the night.","There is water on the road.","The road is wet in several places.","The puddles are shallow."],"answer":0,"explanation":"Seeing water is an observation. “It rained” is an inference — a possible explanation that might be wrong (a water tanker or burst pipe could also explain it). Good scientists test inferences against other evidence.","hints":["Which statement could turn out to be wrong even though the others are true?"],"time":45,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-033","subject":"Scientific Reasoning","topic":"Observation & Inference","level":3,"type":"reasoning","q":"Records show that fires attended by more fire engines cause more damage. A councillor proposes sending fewer engines to reduce damage. What is wrong with this reasoning?","options":["More engines always cause traffic jams.","Bigger fires cause both more damage and more engines being sent; engines do not cause the damage.","Records about fires are always wrong.","Fire engines spread fire with water."],"answer":1,"explanation":"The size of the fire is a confounding variable: large fires do more damage AND need more engines. Reducing engines would make fires worse. This is a classic case of mistaking correlation for causation.","hints":["What decides how many engines are sent?","Could one hidden factor explain both quantities?"],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"REA-034","subject":"Scientific Reasoning","topic":"Applying Principles","level":2,"type":"interdisciplinary","q":"A balloon filled with helium rises, but the same balloon filled with air from your lungs sinks slowly. Why?","options":["Helium is pulled upward by the Sun.","Helium is less dense than air, so the upthrust exceeds the balloon’s weight; exhaled air is slightly denser than room air.","Helium has no mass.","Your breath makes the balloon magnetic."],"answer":1,"explanation":"Upthrust equals the weight of air displaced. Helium (≈ 0.18 kg/m³) is much lighter than air (≈ 1.2 kg/m³), so the total weight of balloon + helium is less than the upthrust. Exhaled air is warm but contains CO₂ and is close to room-air density, so balloon + breath is heavier than the air it displaces.","misconception":"Helium does have mass — it is just much less dense than air.","hints":["Archimedes’ principle works in gases as well as liquids."],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-035","subject":"Scientific Reasoning","topic":"Applying Principles","level":3,"type":"application","q":"A vacuum flask keeps tea hot. Which feature mainly reduces heat loss by RADIATION?","options":["The outer plastic case","The plastic stopper","The silvered (shiny) inner surfaces","The vacuum between the double walls"],"answer":2,"explanation":"Shiny silvered surfaces are poor emitters and good reflectors of infrared radiation, so they reflect heat back into the tea. The vacuum stops conduction and convection (which need particles) but not radiation; the stopper reduces convection and evaporation at the top.","misconception":"The vacuum cannot stop radiation — radiation crosses a vacuum (that is how sunlight reaches us).","hints":["Which method of heat transfer can cross a vacuum?","Which surfaces reflect infrared best?"],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"REA-036","subject":"Scientific Reasoning","topic":"Applying Principles","level":1,"type":"assertion-reason","q":"Assertion (A): A diver feels pressure in the ears when diving deep in a swimming pool.\\nReason (R): Pressure in a liquid increases with depth.","options":["Both A and R are true, and R correctly explains A.","Both A and R are true, but R does not explain A.","A is true, but R is false.","A is false, but R is true."],"answer":0,"explanation":"P = hρg: the deeper the diver goes, the greater the water pressure pushing on the eardrum compared with the air inside the middle ear. R correctly explains A.","hints":["How does liquid pressure depend on depth?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-037","subject":"Scientific Reasoning","topic":"Applying Principles","level":2,"type":"assertion-reason","q":"Assertion (A): Cooking rice in an open pot takes longer at high altitudes.\\nReason (R): At high altitudes water boils at a higher temperature.","options":["Both A and R are true, and R correctly explains A.","Both A and R are true, but R does not explain A.","A is true, but R is false.","A is false, but R is true."],"answer":2,"explanation":"A is true, but R is false. Atmospheric pressure is lower at high altitude, so water boils at a LOWER temperature (about 70 °C on top of Mount Everest). Food cooks more slowly in this cooler boiling water — hence pressure cookers are used in the hills.","misconception":"Lower pressure lowers the boiling point; it does not raise it.","hints":["Is air pressure higher or lower on a mountain?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-038","subject":"Scientific Reasoning","topic":"Applying Principles","level":3,"type":"assertion-reason","q":"Assertion (A): A body moving in a circle at constant speed has a constant acceleration.\\nReason (R): The direction of the centripetal acceleration changes continuously as the body moves.","options":["Both A and R are true, and R correctly explains A.","Both A and R are true, but R does not explain A.","A is true, but R is false.","A is false, but R is true."],"answer":3,"explanation":"A is false: the acceleration has constant MAGNITUDE (v²/r), but its direction (always towards the centre) keeps changing, so the acceleration vector is not constant. R is true, and it is exactly why A is false.","misconception":"A vector is constant only if both its size and its direction are constant.","hints":["Is acceleration a vector?","Does the direction towards the centre stay the same as the body moves round?"],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"REA-039","subject":"Scientific Reasoning","topic":"Applying Principles","level":2,"type":"assertion-reason","q":"Assertion (A): Burning a candle involves both physical and chemical changes.\\nReason (R): The wax melts (a physical change), and the wax vapour burns to form carbon dioxide and water (a chemical change).","options":["Both A and R are true, and R correctly explains A.","Both A and R are true, but R does not explain A.","A is true, but R is false.","A is false, but R is true."],"answer":0,"explanation":"Melting wax can be reversed by cooling — a physical change. Combustion produces new substances (CO₂ and H₂O) and releases energy — a chemical change. R correctly explains A.","hints":["Which part of the process forms new substances?"],"time":55,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"REA-040","subject":"Scientific Reasoning","topic":"Applying Principles","level":3,"type":"interdisciplinary","q":"Desert plants such as cacti have spines instead of broad leaves, and open their stomata mainly at night. Which principle links these adaptations?","options":["Reducing water loss by transpiration, which is greatest from large surfaces in hot, dry daytime air","Increasing photosynthesis by catching more light","Making the plant heavier so it is not blown away","Protecting the plant from cold"],"answer":0,"explanation":"Transpiration increases with leaf area, temperature, wind and low humidity. Spines drastically reduce the surface area for water loss (photosynthesis happens in the green stem). Opening stomata in the cool night (CAM plants store CO₂ as acids for daytime use) cuts water loss further.","hints":["What is the scarcest resource in a desert?","When and from where do plants lose the most water?"],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true}]'),vv=Object.freeze(Object.defineProperty({__proto__:null,default:yv},Symbol.toStringTag,{value:"Module"})),bv=JSON.parse('[{"id":"SPA-001","subject":"Space Science","topic":"Solar System","level":2,"type":"reasoning","q":"Mercury is the planet closest to the Sun, yet Venus has the hottest surface in the Solar System (about 465 °C). Why?","options":["Venus’s thick carbon dioxide atmosphere traps heat by a runaway greenhouse effect.","Venus has active volcanoes covering its whole surface.","Venus rotates faster, causing friction heating.","Venus is larger, so it receives more sunlight."],"answer":0,"explanation":"Venus’s atmosphere is about 96% CO₂ and roughly 90 times as dense as Earth’s. It lets sunlight in but traps outgoing infrared, so heat cannot escape. Mercury has almost no atmosphere, so its night side cools to about −180 °C.","misconception":"Distance from the Sun is not the only factor — the atmosphere controls how much heat is retained.","hints":["What is Venus’s atmosphere made of, and how thick is it?"],"time":50,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-002","subject":"Space Science","topic":"Solar System","level":1,"type":"mcq","q":"Why does Mars appear reddish?","options":["Its atmosphere is made of red gas.","It reflects red light from the Sun only.","Its surface dust and rocks contain iron oxide (rust).","It is very hot."],"answer":2,"explanation":"Martian soil is rich in iron oxides, which give it a rusty red colour. Mars is actually cold (average about −60 °C).","hints":["What gives rust its colour?"],"time":25,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-003","subject":"Space Science","topic":"Solar System","level":2,"type":"mcq","q":"Which planet has an average density lower than that of water?","options":["Mercury","Earth","Saturn","Jupiter"],"answer":2,"explanation":"Saturn is made mostly of hydrogen and helium; its average density is about 0.69 g/cm³, less than water (1 g/cm³). Earth is the densest planet (about 5.5 g/cm³).","misconception":"Being the biggest (Jupiter) does not make a planet the least dense.","hints":["Which gas giant is famous for being “light enough to float”?"],"time":35,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-004","subject":"Space Science","topic":"Solar System","level":3,"type":"reasoning","q":"A comet’s tail always points away from the Sun, even when the comet is moving away from the Sun. Why?","options":["The Sun’s gravity repels the tail.","The tail is left behind as the comet moves, like smoke from a train.","The tail is a reflection of sunlight.","Radiation pressure and the solar wind push the gas and dust away from the Sun."],"answer":3,"explanation":"Near the Sun, ice in the comet’s nucleus vaporises. The streaming solar wind (charged particles) and the pressure of sunlight push the released gas and dust outward, so the tails point away from the Sun regardless of the comet’s direction of travel.","misconception":"A comet’s tail is not a trail left behind by motion, so it can even lead the comet.","hints":["What flows outward from the Sun?","If the tail were just left behind, which way would it point when the comet moves away from the Sun?"],"time":70,"tracks":["GEN"],"iq":true,"verified":true},{"id":"SPA-005","subject":"Space Science","topic":"Astronomy","level":1,"type":"mcq","q":"What causes the seasons on Earth?","options":["Changes in the Sun’s brightness","Earth being much closer to the Sun in summer","The Moon’s gravity","The tilt of Earth’s axis (about 23.5°) as it orbits the Sun"],"answer":3,"explanation":"Because Earth’s axis is tilted, each hemisphere leans towards the Sun for part of the year (longer days, more direct sunlight — summer) and away for the other part (winter). Earth is actually closest to the Sun in early January, during the northern winter.","misconception":"Distance from the Sun is not the cause: the two hemispheres have opposite seasons at the same distance.","hints":["Why do Australia and India have opposite seasons at the same time?"],"time":30,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-006","subject":"Space Science","topic":"Astronomy","level":2,"type":"reasoning","q":"Why do we see phases of the Moon (new moon, crescent, full moon …)?","options":["We see different amounts of the Moon’s sunlit half as it orbits Earth.","Earth’s shadow covers different parts of the Moon.","Clouds hide part of the Moon.","The Moon produces less light at some times."],"answer":0,"explanation":"The Sun always lights half of the Moon. As the Moon orbits Earth (about 29.5 days from new moon to new moon), the fraction of that lit half facing us changes. Earth’s shadow only falls on the Moon during a lunar eclipse.","misconception":"Phases are not caused by Earth’s shadow — that would be an eclipse.","hints":["How much of the Moon does the Sun light at any time?"],"time":50,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-007","subject":"Space Science","topic":"Astronomy","level":2,"type":"numerical","q":"The Sun is about 1.5 × 10⁸ km from Earth and light travels at 3 × 10⁵ km/s. About how long does sunlight take to reach us?","options":["0.5 minutes","8.3 minutes","8.3 seconds","83 minutes"],"answer":1,"explanation":"t = d/c = 1.5 × 10⁸ ÷ 3 × 10⁵ = 500 s ≈ 8.3 minutes. So we always see the Sun as it was about 8 minutes ago.","misconception":"0.5 minutes forgets to convert 500 s properly; 500 s is 8.3 minutes.","hints":["Time = distance ÷ speed; then convert seconds to minutes."],"time":50,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-008","subject":"Space Science","topic":"Astronomy","level":2,"type":"reasoning","q":"Stars twinkle in the night sky, but planets usually shine steadily. Why?","options":["Stars are moving very fast.","Planets produce their own steady light.","Stars are effectively point sources, so atmospheric refraction makes their light flicker; planets appear as tiny discs whose flickers average out.","Planets are hotter than stars."],"answer":2,"explanation":"Turbulent layers of air keep changing their refractive index, bending starlight slightly and rapidly. A distant star is essentially a point, so its brightness and position flicker. A planet is close enough to appear as a small disc; the variations from different points of the disc average out.","misconception":"Planets do not make their own light — they reflect sunlight.","hints":["What does the atmosphere do to light passing through it?","How big does a star look compared with a planet?"],"time":50,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-009","subject":"Space Science","topic":"Stars & Galaxies","level":1,"type":"mcq","q":"A light-year is a unit of:","options":["speed","brightness","time","distance"],"answer":3,"explanation":"A light-year is the distance light travels in one year — about 9.46 × 10¹² km. The nearest star after the Sun, Proxima Centauri, is about 4.2 light-years away.","misconception":"Despite the word “year”, it measures distance, not time.","hints":["Speed × time = ?"],"time":25,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-010","subject":"Space Science","topic":"Stars & Galaxies","level":2,"type":"mcq","q":"What is the source of the Sun’s energy?","options":["Nuclear fission of uranium","Burning of gases like a fire","Gravitational energy from falling meteors","Nuclear fusion of hydrogen into helium in its core"],"answer":3,"explanation":"In the Sun’s core (about 15 million °C), hydrogen nuclei fuse to form helium. A small amount of mass is converted to a large amount of energy (E = mc²). Chemical burning would have used up the Sun in a few thousand years.","misconception":"Fission (splitting heavy nuclei) powers nuclear reactors; stars run on fusion.","hints":["Does the Sun split heavy atoms or join light ones?"],"time":40,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-011","subject":"Space Science","topic":"Stars & Galaxies","level":3,"type":"reasoning","q":"What will the Sun most likely become at the end of its life?","options":["A supernova, then a black hole","A neutron star","A brown dwarf, then a planet","A red giant, then a white dwarf"],"answer":3,"explanation":"Stars of about the Sun’s mass swell into red giants when hydrogen in the core runs out, shed their outer layers as a planetary nebula, and leave a hot, dense core — a white dwarf. Only stars more than about 8 times the Sun’s mass end in supernovae that may leave neutron stars or black holes.","misconception":"The Sun is not massive enough to explode as a supernova or form a black hole.","hints":["Does a star’s mass decide how it dies?"],"time":70,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-012","subject":"Space Science","topic":"Stars & Galaxies","level":3,"type":"what-if","q":"Light from a distant galaxy is observed to be shifted towards longer (redder) wavelengths. What does this tell astronomers?","options":["The galaxy is moving towards us.","The galaxy contains only red stars.","The galaxy is very hot.","The galaxy is moving away from us."],"answer":3,"explanation":"A source moving away stretches the waves it emits, increasing their wavelength — a redshift (like the falling pitch of a passing siren, the Doppler effect). Hubble found that more distant galaxies have larger redshifts, evidence that the universe is expanding.","misconception":"Redshift is not about the colour of the stars themselves; it is a shift of the whole spectrum.","hints":["Think of the sound of an ambulance siren as it drives away.","Moving away stretches or squashes the waves?"],"time":70,"tracks":["GEN"],"iq":true,"verified":true},{"id":"SPA-013","subject":"Space Science","topic":"Stars & Galaxies","level":2,"type":"mcq","q":"Why is a black hole “black”?","options":["It is too far away to be seen.","Its gravity is so strong that not even light can escape from within its event horizon.","It is made of dark rock.","It absorbs only visible light but emits radio waves."],"answer":1,"explanation":"A black hole forms when matter collapses into a tiny region. Inside the event horizon the escape velocity exceeds the speed of light, so no light or signal can leave. We detect black holes by their effects on nearby stars and hot gas.","hints":["What would the escape velocity have to be for light to be trapped?"],"time":35,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-014","subject":"Space Science","topic":"Satellites & Orbits","level":2,"type":"mcq","q":"A geostationary communication satellite appears fixed in the sky. Which is true of its orbit?","options":["It orbits over the poles once a day.","It orbits just above the atmosphere every 90 minutes.","It orbits above the equator once a day in the same direction as Earth rotates.","It is stationary in space with no orbit."],"answer":2,"explanation":"A geostationary satellite orbits about 35,800 km above the equator with a period equal to one rotation of Earth, moving in the same direction, so it stays above the same place. Dish antennas can then point at it without moving.","misconception":"It is not motionless — it moves at about 3 km/s, matching Earth’s rotation.","hints":["For a satellite to stay over one place, its period must match what?"],"time":40,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-015","subject":"Space Science","topic":"Satellites & Orbits","level":3,"type":"numerical","q":"Earth orbits the Sun at 1 astronomical unit (AU) in 1 year. Using Kepler’s third law (T² ∝ r³), what is the orbital period of a planet at 9 AU?","options":["27 years","81 years","9 years","3 years"],"answer":0,"explanation":"T² ∝ r³ → T = r^1.5 in years when r is in AU: 9^1.5 = (√9)³ = 3³ = 27 years. (Saturn, at about 9.5 AU, takes about 29 years.)","misconception":"81 years uses T ∝ r²; 9 years assumes T ∝ r.","hints":["T² = r³ when T is in years and r in AU.","√9 = 3. What is 3³?"],"time":80,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-016","subject":"Space Science","topic":"Satellites & Orbits","level":3,"type":"reasoning","q":"Two satellites are in the same circular orbit around Earth, one of 500 kg and one of 5000 kg. How do their orbital speeds compare?","options":["They are equal.","The heavier satellite falls to Earth.","The lighter satellite is 10 times faster.","The heavier satellite is 10 times faster."],"answer":0,"explanation":"Gravity provides the centripetal force: GMm/r² = mv²/r, so v = √(GM/r). The satellite’s mass m cancels. Orbital speed depends only on Earth’s mass and the orbital radius — just as all objects fall with the same acceleration.","misconception":"A heavier satellite feels more gravity, but also has more inertia — the two effects cancel exactly.","hints":["Write gravitational force = centripetal force for a satellite of mass m.","Does m appear on both sides?"],"time":70,"tracks":["GEN"],"iq":true,"verified":true},{"id":"SPA-017","subject":"Space Science","topic":"Gravity in Space","level":3,"type":"numerical","q":"The International Space Station orbits about 400 km above Earth’s surface (Earth’s radius ≈ 6400 km). Approximately what percentage of surface gravity acts on it there?","options":["0%","50%","89%","100%"],"answer":2,"explanation":"g ∝ 1/r²: g_ISS/g = (6400/6800)² ≈ 0.886, about 89%. Gravity is far from zero; astronauts feel weightless because they and the station are in continuous free fall around Earth.","misconception":"“Zero gravity” in orbit is a myth — the station is falling around Earth under almost full gravity.","hints":["Use distances from Earth’s CENTRE: 6400 km and 6800 km.","g varies as 1/r²."],"time":90,"tracks":["GEN"],"iq":true,"verified":true},{"id":"SPA-018","subject":"Space Science","topic":"Gravity in Space","level":1,"type":"numerical","q":"Gravity on the Moon is about 1.6 m/s². What is the weight of a 60 kg astronaut on the Moon?","options":["37.5 N","96 N","588 N","60 N"],"answer":1,"explanation":"Weight = mg = 60 × 1.6 = 96 N, about one-sixth of the 588 N the astronaut weighs on Earth. The mass is still 60 kg.","misconception":"37.5 N divides instead of multiplying; 588 N is the Earth weight.","hints":["Weight = mass × gravitational acceleration."],"time":40,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-019","subject":"Space Science","topic":"Gravity in Space","level":2,"type":"mcq","q":"Why can the Moon keep only an extremely thin trace of atmosphere?","options":["The Moon is too cold for gases.","Its weak gravity (low escape velocity) lets gas molecules escape into space.","The Moon has no rocks to release gases.","The Sun blows away every planet’s atmosphere."],"answer":1,"explanation":"The Moon’s escape velocity is only about 2.4 km/s (Earth’s is 11.2 km/s). Sunlight heats gas molecules on the dayside to speeds at which many can escape over time, so the Moon cannot hold a substantial atmosphere.","hints":["Compare the Moon’s escape velocity with Earth’s."],"time":35,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-020","subject":"Space Science","topic":"Indian Space Missions","level":1,"type":"mcq","q":"Chandrayaan-3’s Vikram lander made India the first country to soft-land near the Moon’s south pole. In which year did it land?","options":["2019","2008","2023","2014"],"answer":2,"explanation":"Chandrayaan-3’s Vikram lander touched down near the lunar south pole on 23 August 2023, and the Pragyan rover explored the surface. (Chandrayaan-1 launched in 2008; Chandrayaan-2’s lander was lost in 2019; 2014 is when Mangalyaan reached Mars.)","hints":["This date is now celebrated in India as National Space Day."],"time":30,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-021","subject":"Space Science","topic":"Indian Space Missions","level":2,"type":"mcq","q":"What was special about India’s Mars Orbiter Mission (Mangalyaan), which entered Mars orbit in September 2014?","options":["India became the first Asian nation to reach Mars orbit, and the first nation to do so on its first attempt.","It carried astronauts.","It was the first spacecraft ever to land on Mars.","It brought samples back from Mars."],"answer":0,"explanation":"Launched on 5 November 2013 by PSLV and inserted into Mars orbit on 24 September 2014, MOM made ISRO the fourth space agency to reach Mars and the first to succeed on its maiden attempt, at a famously low cost.","misconception":"Mangalyaan was an orbiter, not a lander.","hints":["“Orbiter” is in the mission’s name."],"time":40,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-022","subject":"Space Science","topic":"Indian Space Missions","level":3,"type":"reasoning","q":"India’s solar observatory Aditya-L1 is placed near Lagrange point L1, about 1.5 million km from Earth towards the Sun. What is the main advantage of this position?","options":["There is no gravity at L1.","It can land on the Sun from there.","It can watch the Sun continuously, without being blocked by Earth or eclipses.","It is closer to the Sun than Mercury, so it sees more detail."],"answer":2,"explanation":"At L1, the combined pull of the Sun and Earth lets a spacecraft keep pace with Earth in its orbit, staying between Earth and the Sun. From a halo orbit there it has an uninterrupted view of the Sun — no night, no eclipses — ideal for studying solar flares and the solar wind before they reach Earth. 1.5 million km is only about 1% of the Earth–Sun distance.","misconception":"Gravity is not zero at L1; the forces combine so that the orbit period matches Earth’s.","hints":["What could block a satellite’s view of the Sun if it orbited close to Earth?","1.5 million km compared with 150 million km — is it close to the Sun?"],"time":70,"tracks":["GEN"],"iq":true,"verified":true},{"id":"SPA-023","subject":"Space Science","topic":"Indian Space Missions","level":2,"type":"mcq","q":"Which instrument aboard India’s Chandrayaan-1 (2008) helped find evidence of water molecules on the Moon’s surface?","options":["The Hubble Space Telescope","The Pragyan rover","NASA’s Moon Mineralogy Mapper (M3)","The Vikram lander"],"answer":2,"explanation":"Chandrayaan-1 carried international instruments. NASA’s Moon Mineralogy Mapper detected the infrared signature of water and hydroxyl on the lunar surface, announced in 2009. Its Moon Impact Probe also supported the findings. Pragyan and Vikram belong to Chandrayaan-3.","hints":["Pragyan and Vikram flew on a later mission."],"time":35,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-024","subject":"Space Science","topic":"Space Exploration","level":2,"type":"numerical","q":"When Mars is 2.25 × 10⁸ km from Earth, how long does a radio command take to reach a Mars rover? (speed of light = 3 × 10⁸ m/s)","options":["12.5 seconds","12.5 minutes","750 minutes","1.25 minutes"],"answer":1,"explanation":"Convert km to m: 2.25 × 10¹¹ m. t = d/c = 2.25 × 10¹¹ / 3 × 10⁸ = 750 s = 12.5 minutes. A reply takes another 12.5 minutes, which is why Mars rovers must drive partly by themselves.","misconception":"750 minutes forgets that 750 is in seconds.","hints":["Convert km to m first.","Then convert seconds to minutes."],"time":60,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-025","subject":"Space Science","topic":"Space Exploration","level":1,"type":"mcq","q":"Why are space telescopes such as Hubble and James Webb placed above Earth’s atmosphere?","options":["Telescopes work only in the dark.","The atmosphere blurs images and absorbs many wavelengths such as infrared, ultraviolet and X-rays.","They need to be closer to the stars.","There is no gravity in space."],"answer":1,"explanation":"Turbulent air distorts light (the reason stars twinkle), and the atmosphere blocks much of the ultraviolet, X-ray and infrared light that carries valuable information. Above the atmosphere, telescopes get sharper images across more wavelengths.","misconception":"Being a few hundred km “closer” to stars light-years away makes no practical difference.","hints":["What does the atmosphere do to starlight?"],"time":30,"tracks":["GEN"],"iq":false,"verified":true},{"id":"SPA-026","subject":"Space Science","topic":"Space Exploration","level":3,"type":"interdisciplinary","q":"Long-duration astronauts on the ISS often return with weaker bones and muscles. What is the main cause?","options":["In free fall, bones and muscles no longer have to support the body’s weight, so the body reduces bone and muscle mass.","Cosmic rays dissolve calcium.","Low air pressure in the station.","Food in space contains no calcium."],"answer":0,"explanation":"Bone and muscle respond to load. In continuous free fall the skeleton bears no weight, so bone is broken down faster than it is rebuilt (astronauts can lose roughly 1–1.5% of bone mass per month in weight-bearing bones) and muscles waste. Astronauts exercise about two hours a day to slow this.","hints":["What does gravity normally make your bones and muscles do all day?","What happens to a muscle that is never used?"],"time":80,"tracks  0)/40 = 0.5 m/s²","s = ut + ½at² = 0 + ½ × 0.5 × 40² = 400 m","Check with average velocity: (0 + 20)/2 × 40 = 400 m ✓"]},{q:"A car moving at 30 m/s brakes at 6 m/s². Find the stopping distance.",steps:["v² = u² + 2as → 0 = 900 − 12s","s = 75 m"]}]},{id:"newton",subject:"Physics",topic:"Force & Newton's Laws",title:"Force and Newton's Laws",intro:"Forces change the state of motion of objects. Newton’s three laws explain when, how and why motion changes.",principle:"First law: without a net force, velocity stays constant (inertia). Second law: net force = rate of change of momentum, F = ma. Third law: forces come in equal and opposite pairs acting on DIFFERENT bodies.",definitions:[["Inertia","Resistance of a body to change in its state of motion; measured by mass."],["Momentum","p = mv, a vector (kg m/s)."],["Impulse","Force × time = change in momentum."],["Net force","Vector sum of all forces on a body."]],formulas:[["F = ma","net force and acceleration"],["F = Δp / Δt","general form of the second law"],["m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂","conservation of momentum (no external force)"]],examples:["A cricketer pulls the hands back while catching to increase the time and reduce the force.","A rocket pushes gas backwards; the gas pushes the rocket forwards — no air needed.","Passengers lurch forward when a bus brakes suddenly (inertia of motion)."],misconceptions:["“A moving object needs a force to keep moving.” Only friction makes it seem so; with no net force it moves on at constant velocity.","“Action and reaction cancel.” They act on different bodies, so they cannot cancel each other."],worked:[{q:"A 1200 kg car accelerates from 10 m/s to 25 m/s in 5 s. Find the net force.",steps:["a = (25 − 10)/5 = 3 m/s²","F = ma = 1200 × 3 = 3600 N"]},{q:"A 50 g bullet leaves a 4 kg gun at 400 m/s. Find the recoil speed.",steps:["Total momentum before = 0","0.05 × 400 = 4 × v → v = 5 m/s (backwards)"]}]},{id:"gravitation",subject:"Physics",topic:"Gravitation",title:"Gravitation",intro:"Every mass attracts every other mass. The same force that makes an apple fall keeps the Moon in orbit.",principle:"F = Gm₁m₂/r²: the force is proportional to the product of the masses and inversely proportional to the square of the distance between their centres. Near a planet, g = GM/R². Mass is fixed; weight (mg) depends on where you are.",definitions:[["G","Universal gravitational constant, 6.67 × 10⁻¹¹ N m² kg⁻²."],["g","Acceleration due to gravity, ≈ 9.8 m/s² at Earth’s surface."],["Weight","Gravitational force on a body, W = mg (newtons)."],["Free fall","Motion under gravity alone."]],formulas:[["F = Gm₁m₂ / r²","law of gravitation"],["g = GM / R²","surface gravity of a planet"],["g ∝ ρR","for planets of density ρ (since M = ⁴⁄₃πR³ρ)"]],examples:["Your weight on the Moon is about one-sixth of that on Earth; your mass is unchanged.","Astronauts in orbit feel weightless because they and their spacecraft fall together, not because gravity is absent."],misconceptions:["“Heavier objects fall faster.” Without air resistance, all objects fall with the same acceleration g.","“There is no gravity in space.” At the ISS altitude (≈ 400 km), g is still about 90% of its surface value."],worked:[{q:"If the distance between two bodies is tripled, what happens to the force?",steps:["F ∝ 1/r²","(1/3)² = 1/9 → the force becomes one-ninth."]},{q:"A planet has twice Earth’s mass and twice its radius. Find g there.",steps:["g = GM/R² → g′ = G(2M)/(2R)² = (2/4) g","g′ = g/2 ≈ 4.9 m/s²"]}]},{id:"work-energy",subject:"Physics",topic:"Work, Energy & Power",title:"Work, Energy and Power",intro:"Energy is the capacity to do work. It is never created or destroyed — only transformed.",principle:"Work = force × displacement in the direction of the force (W = Fs cos θ). KE = ½mv², PE = mgh. In the absence of friction, mechanical energy is conserved. Power is the rate of doing work.",definitions:[["Joule","1 J = 1 N × 1 m."],["Watt","1 W = 1 J/s."],["Efficiency","useful output energy ÷ input energy."]],formulas:[["W = F s cos θ","work"],["KE = ½ m v²","kinetic energy"],["PE = m g h","gravitational potential energy near Earth"],["P = W / t = F v","power"]],examples:["Carrying a bag horizontally at constant speed: the lifting force is vertical, displacement horizontal, so (ideally) no work is done on the bag.","A hydroelectric dam converts the PE of stored water into KE and then electrical energy."],misconceptions:["“Doubling speed doubles kinetic energy.” KE ∝ v², so it quadruples.","“Feeling tired means work was done.” Holding a heavy box still does no mechanical work on the box (s = 0)."],worked:[{q:"A 2 kg ball is dropped from 20 m. Find its speed just before landing (g = 10 m/s²).",steps:["PE lost = mgh = 2 × 10 × 20 = 400 J","½ × 2 × v² = 400 → v = 20 m/s"]},{q:"A 60 kg student climbs 4 m of stairs in 8 s. Find the power.",steps:["W = mgh = 60 × 10 × 4 = 2400 J","P = 2400 / 8 = 300 W"]}]},{id:"sound",subject:"Physics",topic:"Sound",title:"Sound and Waves",intro:"Sound is a mechanical wave: a travelling pattern of compressions and rarefactions in a medium.",principle:"Sound needs a medium and travels as a longitudinal wave. Its speed depends on the medium (fastest in solids, slowest in gases), not on frequency. v = fλ links speed, frequency and wavelength. Echoes are reflected sound.",definitions:[["Frequency","Oscillations per second (Hz); decides pitch."],["Amplitude","Maximum disturbance; decides loudness."],["Ultrasound","Frequency above 20 kHz."],["Infrasound","Frequency below 20 Hz."]],formulas:[["v = f λ","wave equation"],["d = v t / 2","distance to a reflector from echo time t"]],examples:["Bats and SONAR use ultrasound echoes to locate objects.","You see lightning before you hear thunder because light is about a million times faster than sound."],misconceptions:["“Higher-pitched sound travels faster.” In a given medium all frequencies travel at the same speed; λ adjusts.","“Sound travels faster in air on a still day than in water.” Sound is about 4 times faster in water (~1500 m/s) than in air (~340 m/s)."],worked:[{q:"An echo from a cliff returns after 3 s. Speed of sound 340 m/s. How far is the cliff?",steps:["Sound travels to the cliff and back: total path = 340 × 3 = 1020 m","Distance = 1020 / 2 = 510 m"]},{q:"A 680 Hz note in air (340 m/s): find λ.",steps:["λ = v/f = 340/680 = 0.5 m"]}]},{id:"pressure",subject:"Physics",topic:"Pressure & Buoyancy",title:"Pressure, Buoyancy and Floating",intro:"Pressure explains why knives cut, why dams are thicker at the bottom and why ships float.",principle:"Pressure = force ÷ area. In a liquid, pressure increases with depth: P = hρg. A body in a fluid feels an upward buoyant force equal to the weight of fluid it displaces (Archimedes). It floats if its average density is less than the fluid’s.",definitions:[["Thrust","Force acting perpendicular to a surface."],["Pascal","1 Pa = 1 N/m²."],["Relative density","Density of a substance ÷ density of water (no unit)."]],formulas:[["P = F / A","pressure"],["P = h ρ g","liquid pressure at depth h"],["F_b = V ρ_fluid g","buoyant force"],["Fraction submerged = ρ_body / ρ_fluid","for a floating body"]],examples:["Camels’ broad feet spread their weight and stop them sinking into sand.","A ship floats higher in sea water than in river water because sea water is denser."],misconceptions:["“Heavy things sink.” A steel ship floats because its hollow shape gives it a low average density.","“Buoyant force depends on the depth.” For a fully submerged incompressible body, it depends only on the displaced volume and the fluid density."],worked:[{q:"A wooden block of density 600 kg/m³ floats in water. What fraction is submerged?",steps:["Fraction = 600 / 1000 = 0.6","60% below the surface, 40% above."]},{q:"Find the water pressure (excluding atmosphere) 5 m below the surface (g = 10).",steps:["P = hρg = 5 × 1000 × 10 = 5 × 10⁴ Pa"]}]},{id:"light",subject:"Physics",topic:"Light",title:"Light: Reflection and Refraction",intro:"Light travels in straight lines, bounces off surfaces and bends when it changes medium.",principle:"Reflection: angle of incidence = angle of reflection. Refraction: light slows in denser media and bends towards the normal; refractive index n = c/v. Mirrors and lenses follow 1/f = 1/v ± 1/u with a sign convention.",definitions:[["Refractive index","n = speed of light in vacuum ÷ speed in the medium."],["Focal length","Distance from the pole/optical centre to the principal focus."],["Power of a lens","P = 1/f (f in metres), unit dioptre (D)."]],formulas:[["n = c / v","refractive index"],["1/v − 1/u = 1/f","lens formula (Cartesian signs)"],["m = v / u","magnification for a lens"],["P = 1 / f","lens power"]],examples:["A pencil in water looks bent because light from it refracts at the surface.","Rainbows form by dispersion: different colours refract by different amounts in raindrops."],misconceptions:["“A plane mirror image is formed on the mirror surface.” It is as far behind the mirror as the object is in front.","“Light bends because it hits the surface.” It bends because its speed changes at the boundary."],worked:[{q:"Light travels at 2 × 10⁸ m/s in glass. Find n.",steps:["n = 3 × 10⁸ / 2 × 10⁸ = 1.5"]},{q:"Power of a convex lens of focal length 25 cm?",steps:["f = 0.25 m","P = 1/0.25 = +4 D"]}]},{id:"electricity",subject:"Physics",topic:"Electricity",title:"Electric Current and Circuits",intro:"Electric current is the flow of charge. Resistance controls how much current flows for a given voltage.",principle:"Ohm’s law: V = IR (at constant temperature). R = ρL/A: resistance rises with length and falls with cross-sectional area. Series resistors add; in parallel, reciprocals add. Power P = VI = I²R = V²/R.",definitions:[["Current","I = Q/t, in amperes."],["Potential difference","Work done per unit charge, in volts."],["Resistivity ρ","Property of the material (Ω m), independent of shape."]],formulas:[["V = I R","Ohm's law"],["R = ρ L / A","resistance of a wire"],["R_s = R₁ + R₂","series"],["1/R_p = 1/R₁ + 1/R₂","parallel"],["P = V I = I² R = V² / R","electrical power"]],examples:["Household appliances are wired in parallel so each gets the full mains voltage and can be switched separately.","A fuse wire melts when the current exceeds its rating, protecting the circuit."],misconceptions:["“Current is used up by a bulb.” Current is the same everywhere in a series loop; energy is transferred, charge is not consumed.","“Adding more resistors always increases total resistance.” Adding a resistor in parallel decreases it."],worked:[{q:"A wire of resistance 4 Ω is stretched to twice its length (volume unchanged). New resistance?",steps:["Length ×2, so area ×½ (volume constant)","R = ρL/A → ×2 × 2 = ×4","New R = 16 Ω"]},{q:"Two 6 Ω resistors in parallel across 12 V: total current?",steps:["R_p = 3 Ω","I = 12/3 = 4 A"]}]},{id:"matter",subject:"Chemistry",topic:"Matter",title:"Matter and Its States",intro:"Everything with mass and volume is matter, made of particles that are constantly moving and attracting each other.",principle:"The state of matter depends on the balance between particle kinetic energy (temperature) and inter-particle attraction (pressure helps by pushing particles together). During a change of state, temperature stays constant because the heat supplied (latent heat) breaks attractions instead of raising kinetic energy.",definitions:[["Latent heat","Heat absorbed or released during a change of state at constant temperature."],["Evaporation","Escape of surface particles below the boiling point."],["Sublimation","Solid → gas without becoming liquid (e.g. camphor, dry ice)."],["Diffusion","Spontaneous mixing of particles due to their motion."]],formulas:[["K = °C + 273","Kelvin conversion"],["Q = m L","heat for a change of state"]],examples:["Sweating cools you because evaporation takes latent heat from your skin.","Pressure cookers cook faster: higher pressure raises the boiling point of water above 100 °C."],misconceptions ate","Insoluble solid formed in a solution reaction."]],formulas:[["Zn + CuSO₄ → ZnSO₄ + Cu","displacement"],["CaCO₃ → CaO + CO₂","thermal decomposition"],["AgNO₃ + NaCl → AgCl↓ + NaNO₃","double displacement (precipitation)"]],examples:["Rusting of iron is slow oxidation.","Respiration is a combustion-like redox reaction that releases energy from glucose."],misconceptions:["“Balancing means changing subscripts.” Only coefficients change; changing subscripts changes the substance.","“Oxidation always involves oxygen.” Loss of electrons counts, even with no oxygen present."],worked:[{q:"Balance: Fe + O₂ → Fe₂O₃",steps:["Need even O: 2 Fe₂O₃ → 6 O → 3 O₂","Fe: 4 Fe","4Fe + 3O₂ → 2Fe₂O₃"]},{q:"In CuO + H₂ → Cu + H₂O, what is oxidised?",steps:["H₂ gains oxygen → oxidised","CuO loses oxygen → reduced"]}]},{id:"acids",subject:"Chemistry",topic:"Acids, Bases & Salts",title:"Acids, Bases and Salts",intro:"Acids and bases are everywhere — in lemons, soaps, stomachs and soil.",principle:"Acids release H⁺ (H₃O⁺) ions in water; bases release OH⁻. Neutralisation forms salt and water. pH measures H⁺ concentration on a logarithmic scale: each unit is a factor of 10.",definitions:[["pH","7 neutral, < 7 acidic, > 7 basic (at 25 °C)."],["Indicator","Substance that changes colour with pH (litmus, phenolphthalein)."],["Alkali","A base that dissolves in water."]],formulas:[["Acid + Base → Salt + Water","neutralisation"],["Metal carbonate + Acid → Salt + H₂O + CO₂",""],["pH 3 has 10× the [H⁺] of pH 4","log scale"]],examples:["Antacids (e.g. milk of magnesia) neutralise excess stomach acid.","Baking soda (NaHCO₃) releases CO₂ that makes cakes rise."],misconceptions:["“A strong acid is the same as a concentrated acid.” Strength = degree of ionisation; concentration = amount per volume.","“pH 4 is twice as acidic as pH 2.” pH 2 has 100 times the H⁺ concentration of pH 4."],worked:[{q:"Solution A has pH 2 and B has pH 5. Compare [H⁺].",steps:["Difference 3 units → 10³","A has 1000 times the H
