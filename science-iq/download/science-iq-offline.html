rgy.","hints":["Where does aerobic respiration take place?"],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-002","subject":"Biology","topic":"Cell Biology","level":2,"type":"experiment","q":"Onion-peel cells are mounted in a concentrated salt solution and observed under a microscope. What will be seen, and why?","options":["The cells swell and burst because salt enters.","The cytoplasm shrinks away from the cell wall because water leaves the cell by osmosis.","The cell wall dissolves in salt.","Nothing changes because the cell wall is impermeable."],"answer":1,"explanation":"The salt solution has a lower water concentration than the cell sap (it is hypertonic). Water moves out of the cell through the selectively permeable membrane by osmosis; the vacuole and cytoplasm shrink and pull away from the rigid cell wall — plasmolysis. The wall itself is freely permeable and keeps its shape.","misconception":"Plant cells do not burst in water because of their cell wall — and in salt the wall stays, but the membrane pulls away from it.","hints":["Where is water more concentrated: inside the cell or in the salt solution?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-003","subject":"Biology","topic":"Cell Biology","level":2,"type":"statement","q":"Consider:\\nI. Plant cells have both chloroplasts and mitochondria.\\nII. Bacterial cells have a membrane-bound nucleus.\\nIII. Ribosomes are found in both prokaryotic and eukaryotic cells.\\nIV. Animal cells usually have large central vacuoles.\\nWhich are correct?","options":["I and III only","I, III and IV only","II and IV only","I, II and III only"],"answer":0,"explanation":"I: true — plants photosynthesise in chloroplasts AND respire in mitochondria. II: false — bacteria are prokaryotes with no membrane-bound nucleus (DNA lies in the nucleoid). III: true — all cells need ribosomes to make proteins. IV: false — animal cells have small, temporary vacuoles; a large central vacuole is typical of plant cells.","misconception":"A common misconception is that plants have chloroplasts instead of mitochondria. They have both.","hints":["Do plants respire as well as photosynthesise?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-004","subject":"Biology","topic":"Cell Biology","level":3,"type":"what-if","q":"A drug destroys all the ribosomes in a cell but leaves everything else intact. What will the cell first become unable to do?","options":["Store food in vacuoles","Store genetic information","Let water in by osmosis","Make new proteins, including enzymes"],"answer":3,"explanation":"Ribosomes are the sites of protein synthesis: they read messenger RNA and join amino acids. Without them, no new proteins — enzymes, membrane proteins, hormones — can be made. DNA would still be stored in the nucleus, and osmosis (a passive process) would continue, but the cell would soon die as worn-out proteins were not replaced.","misconception":"DNA carries the instructions, but ribosomes are needed to carry them out.","hints":["What is the job of ribosomes?","Which of the options does not depend on making proteins at all?"],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"BIO-005","subject":"Biology","topic":"Cell Biology","level":2,"type":"numerical","q":"A human skin cell contains 46 chromosomes. How many chromosomes does each human egg cell contain?","options":["46","12","92","23"],"answer":3,"explanation":"Gametes are made by meiosis, which halves the chromosome number (diploid 2n = 46 → haploid n = 23). At fertilisation, egg (23) + sperm (23) restores 46.","misconception":"46 would be the number after mitosis, which keeps the number unchanged.","hints":["Which type of cell division produces eggs and sperm?"],"time":45,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-006","subject":"Biology","topic":"Cell Biology","level":3,"type":"reasoning","q":"Why is it essential that gametes are produced by meiosis rather than by mitosis?","options":["Mitosis cannot happen in reproductive organs.","Otherwise the chromosome number would double in every generation after fertilisation.","Mitosis is too slow to produce enough gametes.","Meiosis produces identical cells, which is necessary for fertilisation."],"answer":1,"explanation":"If eggs and sperm each had the full 46 chromosomes, the zygote would have 92, and the next generation 184. Meiosis halves the number so that fertilisation restores the normal diploid number. Meiosis also creates variation (it does NOT produce identical cells).","misconception":"Meiosis produces genetically different cells — that variation is a second advantage.","hints":["Fertilisation combines two gametes. What happens to the chromosome number?","Work out the zygote’s chromosome number if each gamete had 46."],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"BIO-007","subject":"Biology","topic":"Cell Biology","level":1,"type":"mcq","q":"Which part of a plant cell is freely permeable and gives the cell its rigid shape?","options":["Vacuole membrane","Plasma membrane","Nuclear membrane","Cell wall"],"answer":3,"explanation":"The cellulose cell wall is fully permeable — it lets almost all substances pass — but is strong and rigid, giving shape and protection. The plasma membrane inside it is selectively permeable.","misconception":"The wall is permeable; the membrane is selectively permeable.","hints":["Which layer is made of cellulose?"],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-008","subject":"Biology","topic":"Cell Biology","level":3,"type":"experiment","q":"Three potato strips of equal length are placed in (P) pure water, (Q) 5% sugar solution and (R) 30% sugar solution for an hour. P becomes longer, Q is unchanged and R becomes shorter. What can be inferred?","options":["The potato cell sap has roughly the same water concentration as 5% sugar solution.","Sugar enters the cells in R, making them shrink.","The cell sap is more concentrated than 30% sugar solution.","Potato cells are impermeable to water."],"answer":0,"explanation":"In P water entered (cells were more concentrated than water); in R water left (solution more concentrated than cells). In Q there was no net movement, so the solution and the cell sap had about the same water concentration. This is how the concentration of cell sap can be estimated experimentally.","misconception":"Shrinking in R is due to water leaving, not sugar entering.","hints":["No change in length means no net movement of what?"],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-009","subject":"Biology","topic":"Tissues","level":1,"type":"mcq","q":"Which plant tissue carries water and dissolved minerals from the roots to the leaves?","options":["Epidermis","Phloem","Xylem","Parenchyma"],"answer":2,"explanation":"Xylem (vessels and tracheids, mostly dead, thick-walled cells) conducts water and minerals upwards. Phloem carries food made in the leaves to other parts.","misconception":"Xylem carries water; phloem carries food — “phloem = food”.","hints":["Which tissue moves water?"],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-010","subject":"Biology","topic":"Tissues","level":2,"type":"reasoning","q":"Which type of muscle is striated (striped) under a microscope but works involuntarily?","options":["None of these","Smooth muscle","Skeletal muscle","Cardiac muscle"],"answer":3,"explanation":"Skeletal muscle is striated and voluntary; smooth muscle (gut, blood vessels) is unstriated and involuntary; cardiac muscle is striated, branched and involuntary, and contracts rhythmically throughout life without tiring.","hints":["Think of the one muscle that beats all your life without your control."],"time":45,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-011","subject":"Biology","topic":"Tissues","level":2,"type":"mcq","q":"A sprained ankle involves damage to the tissue that connects bone to bone. What is this tissue?","options":["Areolar tissue","Tendon","Cartilage","Ligament"],"answer":3,"explanation":"Ligaments are strong, slightly elastic connective tissue joining bone to bone at joints. Tendons join muscle to bone and are tough but not very elastic. Over-stretching a ligament causes a sprain.","misconception":"Tendon = muscle-to-bone; ligament = bone-to-bone.","hints":["What holds two bones together at a joint?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-012","subject":"Biology","topic":"Tissues","level":3,"type":"what-if","q":"A ring of bark (including the phloem) is removed from around the trunk of a tree, leaving the xylem intact. After some weeks the bark just ABOVE the ring swells. Why?","options":["The roots send extra food upward.","Food moving down from the leaves in the phloem cannot pass the ring and accumulates above it.","The cut surface absorbs water from the air.","Water moving up in the xylem collects above the ring."],"answer":1,"explanation":"Phloem carries sugars from the leaves down to the roots. Removing the ring (girdling) breaks the phloem, so food piles up above the cut, causing swelling. Water still rises because the xylem is intact — so the leaves stay green for a while, but the roots eventually starve and the tree dies.","misconception":"The xylem is still intact, so water flow is not the cause of the swelling.","hints":["Which tissue was removed with the bark, and what does it carry?","In which direction does food travel from the leaves?"],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"BIO-013","subject":"Biology","topic":"Tissues","level":1,"type":"mcq","q":"Blood is classified as which type of tissue?","options":["Nervous tissue","Muscular tissue","Fluid connective tissue","Epithelial tissue"],"answer":2,"explanation":"Blood has cells (RBCs, WBCs, platelets) suspended in a fluid matrix (plasma) and connects different parts of the body by transporting materials — so it is a fluid connective tissue.","misconception":"Being a liquid does not stop blood being a tissue.","hints":["Blood links and transports between all parts of the body."],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-014","subject":"Biology","topic":"Tissues","level":2,"type":"application","q":"Grass grows back after mowing because it has a meristem near the base of its leaves. Which type of meristem is this?","options":["Permanent tissue","Lateral meristem (cambium)","Intercalary meristem","Apical meristem"],"answer":2,"explanation":"Intercalary meristem lies at the base of leaves or internodes. Because mowing removes the tips but not the base, the grass continues to grow. Apical meristems are at shoot and root tips; lateral meristem (cambium) increases girth.","hints":["Where on the grass blade is the growing region?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-015","subject":"Biology","topic":"Diversity of Organisms","level":2,"type":"mcq","q":"In the five-kingdom classification, why are fungi placed in a kingdom separate from plants?","options":["They are all single-celled.","They have no cell walls.","They are prokaryotes.","They lack chlorophyll and absorb food from outside (saprophytic nutrition), and their walls are made of chitin."],"answer":3,"explanation":"Fungi are eukaryotic and mostly multicellular, but they cannot photosynthesise; they secrete enzymes onto food and absorb the products. Their cell walls contain chitin, not cellulose. These differences in nutrition and structure justify a separate kingdom.","misconception":"Yeast is single-celled but most fungi (moulds, mushrooms) are multicellular.","hints":["How do fungi get their food?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-016","subject":"Biology","topic":"Diversity of Organisms","level":2,"type":"reasoning","q":"Why are viruses usually NOT placed in any of the five kingdoms?","options":["They show life processes only inside a host cell and have no cellular structure of their own.","They contain no genetic material.","They are all harmless.","They are too small to see with any microscope."],"answer":0,"explanation":"Viruses are particles of genetic material (DNA or RNA) in a protein coat. They have no cytoplasm, ribosomes or metabolism, and reproduce only by hijacking a host cell. Because they are not cells, they fall outside the five-kingdom system based on cell type.","misconception":"Viruses do have genetic material — that is how they reproduce inside cells.","hints":["Are viruses made of cells?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-017","subject":"Biology","topic":"Diversity of Organisms","level":1,"type":"mcq","q":"Which of these animals is a mammal?","options":["Bat","Shark","Crocodile","Penguin"],"answer":0,"explanation":"Bats have hair and feed their young on milk — defining features of mammals. Penguins are birds, sharks are fish (cartilaginous), crocodiles are reptiles.","misconception":"Flying does not make an animal a bird; the bat is the only truly flying mammal.","hints":["Which one feeds its young on milk?"],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-018","subject":"Biology","topic":"Diversity of Organisms","level":3,"type":"reasoning","q":"An organism is multicellular, has cells with cell walls and chloroplasts, produces seeds, but its seeds are not enclosed in a fruit. To which group does it belong?","options":["Angiosperms","Bryophytes","Pteridophytes","Gymnosperms"],"answer":3,"explanation":"Seeds rule out bryophytes and pteridophytes (which reproduce by spores). Among seed plants, angiosperms enclose their seeds in a fruit; gymnosperms (“naked seeds”, e.g. pine, cycas) do not.","hints":["Which plant groups produce seeds?","“Gymno” means naked."],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-019","subject":"Biology","topic":"Diversity of Organisms","level":2,"type":"mcq","q":"In the scientific name Panthera tigris, what does “Panthera” represent?","options":["The species","The kingdom","The genus","The family"],"answer":2,"explanation":"Binomial nomenclature (Linnaeus) gives two names: the genus (capitalised, here Panthera) and the species epithet (lower case, tigris). Lions are Panthera leo — the same genus, different species.","hints":["The first word of a binomial name is…?"],"time":35,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-020","subject":"Biology","topic":"Human Physiology","level":2,"type":"mcq","q":"Which part of the brain coordinates balance and precise voluntary movements such as riding a bicycle?","options":["Cerebrum","Medulla oblongata","Cerebellum","Hypothalamus"],"answer":2,"explanation":"The cerebellum (hind-brain) coordinates muscular activity, posture and balance. The cerebrum handles thinking and voluntary decisions; the medulla controls involuntary actions such as heartbeat and breathing; the hypothalamus regulates temperature, hunger and hormones.","hints":["It sits at the back of the brain, below the cerebrum."],"time":40,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-021","subject":"Biology","topic":"Human Physiology","level":2,"type":"reasoning","q":"You touch a hot pan and pull your hand away before you even feel the pain. Why?","options":["Hormones make the hand move.","The brain decides very quickly to move the hand.","The muscles of the hand sense heat directly.","It is a reflex action controlled by the spinal cord, without waiting for the brain."],"answer":3,"explanation":"In a reflex arc, the sensory neuron carries the signal to the spinal cord, a relay neuron passes it directly to a motor neuron, and the arm muscle contracts. The signal reaches the brain slightly later, which is when you become aware of the pain.","hints":["Which part of the nervous system handles reflexes?"],"time":50,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-022","subject":"Biology","topic":"Human Physiology","level":3,"type":"interdisciplinary","q":"A person with uncontrolled diabetes produces too little insulin. Which observation would you expect?","options":["High blood glucose, with glucose appearing in the urine","Glucose being absorbed more quickly into body cells","Increased storage of glucose as glycogen in the liver","Low blood glucose and no glucose in urine"],"answer":0,"explanation":"Insulin, from the pancreas, makes cells take up glucose and makes the liver store it as glycogen. With too little insulin, glucose stays in the blood. When blood glucose is very high, the kidneys cannot reabsorb it all, so glucose appears in the urine.","misconception":"Less insulin means LESS glucose uptake and storage, not more.","hints":["What does insulin do to blood glucose?","What happens when the kidneys are given more glucose than they can reabsorb?"],"time":80,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"BIO-023","subject":"Biology","topic":"Human Physiology","level":2,"type":"mcq","q":"Which is the functional unit of the human kidney that filters blood?","options":["Nephron","Villus","Alveolus","Neuron"],"answer":0,"explanation":"Each kidney has about a million nephrons. In each, blood is filtered in the glomerulus (inside Bowman’s capsule); useful substances such as glucose and much of the water are then reabsorbed, and the remaining fluid becomes urine.","misconception":"Neurons are nerve cells; alveoli are air sacs in the lungs; villi are in the small intestine.","hints":["Its name contains “nephr-”, meaning kidney."],"time":35,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-024","subject":"Biology","topic":"Human Physiology","level":3,"type":"what-if","q":"Vaccination introduces a harmless form of a pathogen. Why does a vaccinated person usually not fall ill when later exposed to the real pathogen?","options":["Vaccines make the pathogen unable to infect any cell.","The immune system has memory cells that recognise the pathogen and respond quickly before it multiplies.","The vaccine stays in the blood forever as a drug.","The vaccine kills every pathogen that enters later."],"answer":1,"explanation":"The vaccine triggers a primary immune response that produces antibodies and long-lived memory cells. On real exposure, memory cells mount a faster, stronger secondary response that destroys the pathogen before it can cause disease.","misconception":"A vaccine is not a medicine that kills germs directly; it trains the immune system.","hints":["What does the immune system “remember” after the first exposure?","Compare a first response with a second response."],"time":80,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"BIO-025","subject":"Biology","topic":"Nutrition","level":1,"type":"mcq","q":"Which nutrient deficiency causes scurvy, with bleeding gums?","options":["Iodine","Iron","Vitamin D","Vitamin C"],"answer":3,"explanation":"Vitamin C is needed to make collagen, a protein in gums, skin and blood vessels. Without it, gums bleed and wounds heal poorly. Citrus fruits and amla are rich sources. (Vitamin D deficiency → rickets; iron → anaemia; iodine → goitre.)","hints":["Sailors on long voyages avoided this disease by eating citrus fruit."],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-026","subject":"Biology","topic":"Nutrition","level":2,"type":"experiment","q":"A student adds iodine solution to two test tubes of starch solution. Saliva is added to tube A only, and both are kept at 37 °C for 20 minutes before testing. Tube A stays brown–yellow; tube B turns blue-black. What does this show?","options":["Salivary amylase digests starch.","Iodine digests starch at 37 °C.","Saliva contains starch.","Temperature alone breaks down starch."],"answer":0,"explanation":"Iodine turns blue-black with starch. Tube B (no saliva, the control) still has starch. Tube A has none left, so something in saliva — the enzyme salivary amylase — broke the starch down into sugars. Because both tubes were at 37 °C, temperature alone cannot explain the difference.","misconception":"The control tube (B) is what rules out temperature as the cause.","hints":["What is the only difference between the two tubes?"],"time":55,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-027","subject":"Biology","topic":"Nutrition","level":2,"type":"reasoning","q":"Why is the inner wall of the small intestine folded into millions of finger-like villi?","options":["To produce bile","To grind food into smaller pieces","To greatly increase the surface area for absorbing digested food","To slow down the movement of food completely"],"answer":2,"explanation":"Villi (and the microvilli on their cells) enormously increase the surface area, and each villus has a rich blood supply and a lacteal, so digested food is absorbed quickly. Bile is made by the liver; grinding happens in the mouth and stomach.","hints":["Absorption happens across a surface. How do you make a surface bigger in a small space?"],"time":45,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-028","subject":"Biology","topic":"Nutrition","level":3,"type":"what-if","q":"A person’s gall bladder is removed, so bile can no longer be stored and released in large amounts after a meal. Digestion of which food is most affected?","options":["Proteins","Fats","Vitamins C and B","Starch"],"answer":1,"explanation":"Bile contains no enzymes, but its salts emulsify fats — breaking large fat globules into tiny droplets so that lipase can act on a much larger surface area. Without a burst of bile after a fatty meal, fat digestion is slower and less complete. (Bile still trickles directly from the liver, so people manage with a low-fat diet.)","misconception":"Bile does not digest fat chemically; it emulsifies it so enzymes can work faster.","hints":["What does bile do to fat globules?","Which enzyme then acts on the fat?"],"time":80,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"BIO-029","subject":"Biology","topic":"Respiration","level":2,"type":"mcq","q":"During a sprint, muscles start to ache with cramp. What is building up in them?","options":["Ethanol from fermentation","Lactic acid from anaerobic respiration","Carbon dioxide from aerobic respiration","Excess oxygen"],"answer":1,"explanation":"When oxygen supply cannot keep up, muscle cells respire anaerobically: glucose → lactic acid + a little energy. Accumulating lactic acid contributes to fatigue and cramps. Yeast produces ethanol and CO₂ in anaerobic respiration, but human muscle does not.","misconception":"Ethanol is the product in yeast, not in human muscle.","hints":["What happens when muscles do not get enough oxygen?"],"time":40,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-030","subject":"Biology","topic":"Respiration","level":2,"type":"numerical","q":"Complete aerobic respiration of one glucose molecule yields about 38 ATP, while anaerobic respiration yields 2 ATP. Roughly how many times more energy does aerobic respiration release per glucose?","options":["36 times","19 times","76 times","2 times"],"answer":1,"explanation":"38 ÷ 2 = 19. Aerobic respiration oxidises glucose completely to CO₂ and water in the mitochondria, releasing far more of its energy; anaerobic respiration leaves much energy locked in lactic acid or ethanol. (Modern estimates are closer to 30–32 ATP, but the conclusion is the same.)","misconception":"36 is the difference, not the ratio.","hints":["“How many times” means divide."],"time":50,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-031","subject":"Biology","topic":"Respiration","level":3,"type":"reasoning","q":"Fish die when water becomes warm and polluted with sewage, even though no toxin is present. Which is the best explanation?","options":["Warm water makes fish too buoyant.","Sewage adds too much oxygen.","Fish cannot swim in warm water.","Warm water holds less dissolved oxygen, and bacteria decomposing sewage use up much of what remains."],"answer":3,"explanation":"Gases are less soluble in warmer water, so dissolved oxygen falls. Decomposer bacteria feeding on sewage respire aerobically and consume more oxygen (high biological oxygen demand). Together these can leave too little oxygen for fish gills to extract.","hints":["How does temperature affect how much gas a liquid can dissolve?","What do bacteria breaking down sewage need?"],"time":70,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-032","subject":"Biology","topic":"Respiration","level":1,"type":"mcq","q":"In which structures of the human lungs does gas exchange take place?","options":["Alveoli","Bronchi","Trachea","Diaphragm"],"answer":0,"explanation":"Alveoli are tiny, thin-walled air sacs surrounded by capillaries. Their huge total surface area (about 70 m²) and thin walls allow oxygen to diffuse into the blood and carbon dioxide out.","hints":["They are tiny balloon-like sacs at the ends of the airways."],"time":25,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-033","subject":"Biology","topic":"Circulation","level":2,"type":"mcq","q":"Which blood vessel carries oxygenated blood but is called a vein?","options":["Pulmonary vein","Pulmonary artery","Vena cava","Aorta"],"answer":0,"explanation":"Vessels are named by direction, not by oxygen content: veins carry blood TO the heart. The pulmonary vein brings oxygenated blood from the lungs to the left atrium. Similarly, the pulmonary artery carries deoxygenated blood away from the heart to the lungs.","misconception":"“Arteries carry oxygenated blood” is a rule with this important exception.","hints":["Veins carry blood towards which organ?"],"time":40,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-034","subject":"Biology","topic":"Circulation","level":3,"type":"reasoning","q":"Why is the muscular wall of the left ventricle much thicker than that of the right ventricle?","options":["The left ventricle pumps blood all round the body, needing much higher pressure than pumping to the nearby lungs.","The right ventricle pumps oxygenated blood, which is lighter.","The left ventricle holds more blood.","The left ventricle receives blood from the lungs at high pressure."],"answer":0,"explanation":"Both ventricles pump the same volume per beat. The right ventricle only sends blood to the lungs, close by and with delicate capillaries that would be damaged by high pressure. The left ventricle must push blood through the entire systemic circulation, so it needs a thicker, more powerful wall.","misconception":"Both ventricles pump the same volume; the difference is the pressure required.","hints":["Where does each ventricle send its blood?","Which journey is longer and has more resistance?"],"time":70,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"BIO-035","subject":"Biology","topic":"Circulation","level":1,"type":"mcq","q":"Which blood component helps blood to clot at a wound?","options":["Red blood cells","Plasma water","White blood cells","Platelets"],"answer":3,"explanation":"Platelets (cell fragments) gather at a damaged vessel and release substances that convert fibrinogen into a mesh of fibrin threads, trapping blood cells to form a clot.","hints":["They are tiny cell fragments, not full cells."],"time":25,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-036","subject":"Biology","topic":"Circulation","level":2,"type":"numerical","q":"The heart pumps about 70 mL of blood with each beat. At a resting rate of 72 beats per minute, about how many litres does it pump per minute?","options":["50.4 L","0.97 L","504 L","5.04 L"],"answer":3,"explanation":"Cardiac output = stroke volume × heart rate = 70 mL × 72 = 5040 mL ≈ 5.04 L per minute — roughly the whole blood volume of an adult every minute.","misconception":"50.4 L and 504 L come from converting mL to L incorrectly (1 L = 1000 mL).","hints":["Multiply volume per beat by beats per minute, then convert mL to L."],"time":50,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-037","subject":"Biology","topic":"Reproduction","level":1,"type":"mcq","q":"Bryophyllum can produce new plants from buds on the edges of its leaves. This is an example of:","options":["Vegetative propagation","Fragmentation of algae","Sexual reproduction","Pollination"],"answer":0,"explanation":"Vegetative propagation is asexual reproduction from parts such as leaves, stems or roots. New Bryophyllum plants are genetically identical to the parent.","hints":["No seeds or gametes are involved."],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-038","subject":"Biology","topic":"Reproduction","level":2,"type":"reasoning","q":"A farmer grows a banana variety only from cuttings for many years. A new fungal disease arrives. Why is the whole crop at high risk?","options":["Bananas cannot be infected by fungi.","Asexual reproduction increases variation.","All the plants are genetically identical, so if one is susceptible, all are.","Cuttings always produce weak plants."],"answer":2,"explanation":"Asexual reproduction produces clones with no genetic variation. Any plant that lacks resistance means every plant lacks it. Sexual reproduction, by mixing genes, produces variation that makes it more likely some individuals survive a new disease.","misconception":"Asexual reproduction reduces variation, it does not increase it.","hints":["How do offspring from cuttings compare genetically?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-039","subject":"Biology","topic":"Reproduction","level":2,"type":"mcq","q":"In a flowering plant, after fertilisation, the ovary develops into the ______ and the ovules develop into the ______.","options":["stigma; style","seeds; fruit","petals; pollen","fruit; seeds"],"answer":3,"explanation":"After fertilisation, each ovule (containing the zygote) becomes a seed, and the ovary wall ripens into the fruit that encloses the seeds.","hints":["How many seeds can one fruit contain?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-040","subject":"Biology","topic":"Reproduction","level":3,"type":"what-if","q":"A plant species’ flowers are pollinated by only one species of bee. If that bee became extinct, which would most likely happen first?","options":["Nothing, because plants make their own food.","Fruit would form without fertilisation in all cases.","The plant would start producing seeds by meiosis alone.","Seed production would fall sharply, threatening the plant’s survival."],"answer":3,"explanation":"Without its pollinator, pollen would not reach the stigma, so fertilisation — and seed formation — would largely stop. The plant could survive for a while but would fail to reproduce sexually. This dependence is why pollinator decline threatens both biodiversity and food crops.","misconception":"Photosynthesis feeds the plant but does not make seeds.","hints":["What is the bee’s role in the plant’s life cycle?","What must happen before seeds can form?"],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"BIO-041","subject":"Biology","topic":"Genetics","level":2,"type":"numerical","q":"In pea plants, tall (T) is dominant over dwarf (t). Two heterozygous tall plants (Tt × Tt) are crossed and produce 400 seedlings. About how many will be dwarf?","options":["100","200","300","0"],"answer":0,"explanation":"Tt × Tt gives TT : Tt : tt = 1 : 2 : 1. Only tt is dwarf: ¼ of 400 = 100. (300 are tall.)","misconception":"300 is the number of TALL plants.","hints":["Draw a Punnett square for Tt × Tt."],"time":60,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-042","subject":"Biology","topic":"Genetics","level":3,"type":"reasoning","q":"A tall pea plant of unknown genotype is crossed with a dwarf plant (tt). Of the offspring, about half are tall and half are dwarf. What was the genotype of the tall parent?","options":["Tt","tt","TT","It cannot be determined"],"answer":0,"explanation":"This is a test cross. If the tall parent were TT, every offspring would receive T and be tall. A 1 : 1 ratio means the tall parent passed on T to half and t to the other half: it is heterozygous, Tt.","hints":["What would the offspring look like if the tall parent were TT?","The dwarf parent can only give t. Which allele must come from the tall parent for a dwarf offspring?"],"time":90,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"BIO-043","subject":"Biology","topic":"Genetics","level":2,"type":"mcq","q":"Which parent determines whether a human baby is a boy or a girl?","options":["The mother, because the egg carries X or Y","Neither — it depends on diet during pregnancy","Both parents equally","The father, because a sperm can carry either an X or a Y chromosome"],"answer":3,"explanation":"Mothers are XX and every egg carries an X. Fathers are XY, so half the sperm carry X and half carry Y. An X sperm gives XX (girl); a Y sperm gives XY (boy).","hints":["Which parent has two different sex chromosomes?"],"time":40,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-044","subject":"Biology","topic":"Genetics","level":3,"type":"numerical","q":"In a cross between two pea plants that are both heterozygous for two independently inherited traits (TtRr × TtRr, tall/round dominant), about how many of every 16 offspring will be dwarf AND wrinkled (ttrr)?","options":["9","3","4","1"],"answer":3,"explanation":"Because the genes assort independently, multiply probabilities: P(tt) = ¼ and P(rr) = ¼, so P(ttrr) = 1/16 — one in every 16. This is the “1” in Mendel’s 9 : 3 : 3 : 1 ratio.","misconception":"9 is the number showing both DOMINANT traits.","hints":["Work out each trait separately.","Probability of two independent events = product of their probabilities."],"time":90,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-045","subject":"Biology","topic":"Genetics","level":1,"type":"mcq","q":"Genes are segments of which molecule?","options":["Protein","ATP","Glucose","DNA"],"answer":3,"explanation":"A gene is a section of DNA that carries the instructions for making a particular protein (or functional RNA). DNA is packed with proteins into chromosomes in the nucleus.","hints":["It is the molecule shaped like a double helix."],"time":25,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-046","subject":"Biology","topic":"Evolution","level":2,"type":"reasoning","q":"Bacteria in a patient become resistant to an antibiotic after a course of treatment is not completed. Which explanation fits natural selection?","options":["The antibiotic taught the bacteria how to resist it.","The antibiotic became weaker over time.","Bacteria chose to change their DNA to survive.","A few bacteria were already resistant by chance; they survived and multiplied when the others were killed."],"answer":3,"explanation":"Variation already existed: random mutations had made a few bacteria resistant. The antibiotic killed the susceptible ones, so the resistant survivors reproduced and passed on resistance. Stopping treatment early leaves more of these survivors. Organisms do not change on purpose.","misconception":"Natural selection acts on existing variation; it does not create changes in response to need.","hints":["Were all the bacteria identical before the antibiotic?"],"time":60,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-047","subject":"Biology","topic":"Evolution","level":2,"type":"mcq","q":"The forelimbs of a human, a bat and a whale have the same basic bone pattern but different functions. These are:","options":["Fossils","Homologous organs, evidence of common ancestry","Vestigial organs","Analogous organs, evidence of similar function"],"answer":1,"explanation":"Homologous organs share the same basic structure and origin but are adapted for different uses (grasping, flying, swimming) — evidence that these animals evolved from a common ancestor. Analogous organs (e.g. bird and insect wings) have similar functions but different structures and origins.","misconception":"Similar function → analogous; similar structure → homologous.","hints":["Is the structure or the function the same?"],"time":40,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-048","subject":"Biology","topic":"Evolution","level":3,"type":"data","q":"Pale and dark forms of a moth rest on tree trunks. Use the table of recaptured moths to decide which statement is best supported.","options":["Each form survives better where it matches the bark, consistent with predation by sight.","Dark moths survive better everywhere.","Survival does not depend on the type of woodland.","Soot directly changes pale moths into dark moths."],"answer":0,"explanation":"Recapture rates: clean woods — pale 25%, dark 6.25%; sooty woods — pale 7.5%, dark 30%. Each form survives better where it is camouflaged, consistent with birds eating the moths they can see. This is the classic industrial melanism example of natural selection.","misconception":"Moths do not change colour in their lifetime; selection changes how common each form is.","hints":["Convert recaptured numbers to percentages of those released.","Compare each form between the two woods."],"time":90,"tracks":["MVPP","GEN"],"iq":false,"table":{"head":["Woodland","Pale released","Pale recaptured","Dark released","Dark recaptured"],"rows":[["Clean (light bark)",400,100,400,25],["Sooty (dark bark)",400,30,400,120]]},"verified":true},{"id":"BIO-049","subject":"Biology","topic":"Ecology","level":2,"type":"numerical","q":"In the food chain grass → grasshopper → frog → snake, the grass captures 20,000 kJ of energy. Using the 10% law, how much energy reaches the snake?","options":["200 kJ","20 kJ","2000 kJ","2 kJ"],"answer":1,"explanation":"Each transfer passes on about 10%: grass 20,000 → grasshopper 2000 → frog 200 → snake 20 kJ. The rest is used in respiration and lost as heat at each level.","misconception":"200 kJ stops at the frog — count the transfers carefully (three of them).","hints":["How many transfers are there from grass to snake?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-050","subject":"Biology","topic":"Ecology","level":3,"type":"reasoning","q":"A non-biodegradable pesticide is sprayed on crops at a very low concentration. Years later, it is found at the HIGHEST concentration in eagles. Why?","options":["The pesticide multiplies inside animals.","Eagles are sprayed directly.","Eagles drink more water than other animals.","It is not broken down or excreted, so it accumulates at each trophic level (biomagnification)."],"answer":3,"explanation":"Each consumer eats many organisms from the level below, and the persistent chemical is stored (often in fat) rather than broken down. So its concentration increases up the food chain and is highest in top predators. DDT thinned eagles’ and falcons’ eggshells in this way.","misconception":"The pesticide does not reproduce; it concentrates because it is retained.","hints":["What happens to a chemical that is neither broken down nor excreted?","An eagle eats many fish, each of which ate many smaller organisms."],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"BIO-051","subject":"Biology","topic":"Ecology","level":2,"type":"mcq","q":"Which organisms convert nitrogen gas from the air into compounds that plants can use?","options":["Fungi that decompose leaves","Earthworms","Nitrogen-fixing bacteria such as Rhizobium in legume root nodules","Green plants directly from the air"],"answer":2,"explanation":"Most organisms cannot use N₂ gas. Nitrogen-fixing bacteria (e.g. Rhizobium in root nodules of peas and beans, and free-living cyanobacteria) convert it into ammonia/ammonium, which is then used to make amino acids. Lightning also fixes a small amount.","misconception":"Plants cannot absorb nitrogen gas directly, even though air is 78% nitrogen.","hints":["Farmers grow peas and beans to enrich soil. Why?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-052","subject":"Biology","topic":"Ecology","level":3,"type":"what-if","q":"In a pond ecosystem, all decomposers (bacteria and fungi) are suddenly killed. What would happen in the long run?","options":["Nothing would change, because energy comes from the Sun.","Dead matter would pile up and nutrients would stop being recycled, so plant growth would eventually decline.","Plants would grow faster with less competition.","Oxygen levels would fall immediately to zero."],"answer":1,"explanation":"Decomposers break down dead organisms and wastes, releasing nutrients (nitrates, phosphates, CO₂) back into the water and soil. Without them, nutrients stay locked in dead bodies; producers run short of nutrients and the whole food web would decline, even though sunlight is still available.","misconception":"Energy comes from the Sun, but nutrients must be recycled — and recycling depends on decomposers.","hints":["What do decomposers return to the environment?","Can producers grow on sunlight alone?"],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"BIO-053","subject":"Biology","topic":"Ecology","level":2,"type":"interdisciplinary","q":"Large-scale deforestation affects the carbon cycle mainly because:","options":["trees produce most of the nitrogen in the air","fewer trees absorb CO₂ by photosynthesis, and burning or rotting wood releases stored carbon","soil becomes colder","forests release CO₂ only at night"],"answer":1,"explanation":"Forests are major carbon stores. Cutting them removes a sink that absorbs CO₂ through photosynthesis, and burning or decay of the cleared wood releases the stored carbon as CO₂, adding to the greenhouse effect.","hints":["Which process removes CO₂ from the air?"],"time":55,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"BIO-054","subject":"Biology","topic":"Plant Biology","level":1,"type":"mcq","q":"What are the raw materials of photosynthesis?","options":["Oxygen and glucose","Carbon dioxide and water","Nitrogen and oxygen","Glucose and water"],"answer":1,"explanation":"6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ in the presence of light and chlorophyll. Glucose and oxygen are the products, not the raw materials.","misconception":"Oxygen and glucose are what photosynthesis makes; they are the raw materials of respiration.","hints":["Which gas do leaves take in from the air in sunlight?"],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-055","subject":"Biology","topic":"Plant Biology","level":3,"type":"what-if","q":"A healthy potted plant in bright light is suddenly moved into dim light. Which change is most likely in the first few hours?","options":["The plant stops respiring.","The rate of photosynthesis rises to compensate.","The plant immediately loses all its chlorophyll.","The rate of photosynthesis falls, possibly below the rate of respiration, so the plant may give out net CO₂."],"answer":3,"explanation":"Light intensity limits photosynthesis, so the rate falls. Respiration continues at about the same rate day and night. If photosynthesis drops below respiration (below the “compensation point”), the plant uses more sugar than it makes and releases net CO₂ instead of net O₂. Over days, it may grow towards the light (phototropism).","misconception":"Plants respire all the time, not only at night.","hints":["Which process depends on light? Which does not?","What happens when the plant uses sugar faster than it makes it?"],"time":80,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"BIO-056","subject":"Biology","topic":"Plant Biology","level":2,"type":"experiment","q":"A destarched potted plant has one leaf partly covered with black paper and is kept in sunlight for a day. When tested with iodine, only the uncovered part of the leaf turns blue-black. What does this show?","options":["CO₂ is necessary for photosynthesis.","Iodine is made in the leaf.","Chlorophyll is necessary for photosynthesis.","Light is necessary for photosynthesis (starch formation)."],"answer":3,"explanation":"Both parts of the leaf had chlorophyll, CO₂ and water; the only difference was light. Starch (shown by blue-black iodine) formed only where light reached, so light is necessary. Destarching first ensures that any starch found was made during the experiment.","misconception":"The chlorophyll conclusion needs a variegated leaf; this experiment varies only light.","hints":["What was the only difference between the covered and uncovered parts?"],"time":60,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-057","subject":"Biology","topic":"Plant Biology","level":2,"type":"reasoning","q":"On a hot, dry, windy day, many plants partly close their stomata. What is the main trade-off?","options":["It increases CO₂ intake.","It stops respiration completely.","It reduces water loss but also reduces CO₂ intake, slowing photosynthesis.","It increases water loss and photosynthesis."],"answer":2,"explanation":"Stomata let in CO₂ for photosynthesis but also let out water vapour (transpiration). Closing them saves water — vital on a hot, windy day — but cuts the CO₂ supply, so photosynthesis slows.","hints":["What passes in, and what passes out, through stomata?"],"time":50,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"BIO-058","subject":"Biology","topic":"Plant Biology","level":1,"type":"mcq","q":"Plant shoots bend towards a window. Which plant hormone causes this?","options":["Auxin","Insulin","Thyroxine","Adrenaline"],"answer":0,"explanation":"Auxin moves to the shaded side of the shoot tip and makes cells there grow longer, so the shoot bends towards the light (phototropism). Insulin, adrenaline and thyroxine are animal hormones.","hints":["Only one option is a plant hormone."],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true}]'),uv=Object.freeze(Object.defineProperty({__proto__:null,default:cv},Symbol.toStringTag,{value:"Module"})),hv=JSON.parse('[{"id":"CHE-001","subject":"Chemistry","topic":"Matter","level":1,"type":"reasoning","q":"The smell of hot, freshly cooked food reaches you from across a room much faster than the smell of the same food when cold. Why?","options":["Particles diffuse faster at higher temperature because they have more kinetic energy.","Cold air blocks smells completely.","Hot food releases heavier particles.","Hot food pushes the air towards you."],"answer":0,"explanation":"Smell reaches us by diffusion of vapour particles through air. At higher temperature the particles move faster (more kinetic energy) and more of them evaporate, so the aroma spreads faster.","misconception":"Diffusion happens at all temperatures — heat speeds it up rather than causing it.","hints":["How does temperature affect the speed of particles?"],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-002","subject":"Chemistry","topic":"Matter","level":2,"type":"mcq","q":"While ice is melting at 0 °C, heat is continuously supplied but the thermometer reading does not rise. Where does the heat go?","options":["It increases the kinetic energy of the particles.","It is lost to the surroundings.","It overcomes the forces of attraction between particles (latent heat of fusion).","It is stored as chemical energy in new bonds."],"answer":2,"explanation":"During a change of state, the energy supplied is used to break the attractions holding particles in the solid lattice rather than to make particles move faster. Temperature measures average kinetic energy, so it stays constant until all the ice has melted.","misconception":"Constant temperature does not mean no energy is being absorbed — the energy is “hidden” (latent) in the change of state.","hints":["What does temperature actually measure?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-003","subject":"Chemistry","topic":"Matter","level":1,"type":"application","q":"On which day would wet clothes on a line dry fastest?","options":["A cold, humid, windy day","A cold, still, foggy day","A warm, dry, windy day","A warm, humid, still day"],"answer":2,"explanation":"Evaporation is faster at higher temperature, lower humidity (air can hold more vapour) and with wind (which carries vapour away from the surface). All three favour a warm, dry, windy day.","misconception":"Temperature alone is not enough: humid, still air slows evaporation a lot.","hints":["List three factors that increase the rate of evaporation."],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-004","subject":"Chemistry","topic":"Matter","level":1,"type":"numerical","q":"Convert −40 °C to the Kelvin scale.","options":["313 K","273 K","233 K","−233 K"],"answer":2,"explanation":"T(K) = T(°C) + 273 = −40 + 273 = 233 K. The Kelvin scale has no negative values because 0 K is absolute zero.","misconception":"313 K subtracts instead of adds the −40.","hints":["K = °C + 273."],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-005","subject":"Chemistry","topic":"Matter","level":3,"type":"experiment","q":"Ice at −10 °C is heated at a constant rate until it has all turned to steam above 100 °C, and its temperature is plotted against time. The graph has two flat (horizontal) sections. Which is true?","options":["Both flat sections are equally long.","The flat section at 0 °C is much longer than the one at 100 °C.","The flat section at 100 °C is much longer than the one at 0 °C.","The flat sections show that heat is being lost."],"answer":2,"explanation":"Flat sections are changes of state. Their lengths are proportional to the latent heat needed. The latent heat of vaporisation of water (≈ 2260 kJ/kg) is about 7 times its latent heat of fusion (≈ 334 kJ/kg), because boiling must separate particles completely, while melting only loosens them. So at a constant heating rate, boiling takes about 7 times longer.","misconception":"Equal flat sections would require equal latent heats — but turning liquid into gas needs far more energy than melting.","hints":["What determines how long each flat section lasts at a constant heating rate?","Which needs more energy: loosening particles or separating them completely?"],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"CHE-006","subject":"Chemistry","topic":"Matter","level":2,"type":"experiment","q":"A block of dry ice (solid CO₂) left on a table gets smaller and produces a white fog, but no liquid puddle ever forms. Which process explains this?","options":["Condensation","Freezing","Sublimation","Melting"],"answer":2,"explanation":"At normal atmospheric pressure, solid CO₂ turns directly into gas (sublimation) at about −78 °C, without passing through a liquid state. The white fog is water vapour from the air condensing in the cold gas.","misconception":"The fog is not CO₂ “steam” — CO₂ gas is invisible; the fog is condensed water from the air.","hints":["Which change goes directly from solid to gas?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-007","subject":"Chemistry","topic":"Matter","level":2,"type":"numerical","q":"How much energy is needed to melt 0.5 kg of ice already at 0 °C? (latent heat of fusion of ice = 334 kJ/kg)","options":["334 kJ","83.5 kJ","167 kJ","668 kJ"],"answer":2,"explanation":"Q = mL = 0.5 × 334 = 167 kJ. No temperature change is involved because the ice is already at its melting point.","misconception":"668 kJ multiplies by 2 instead of 0.5.","hints":["Q = m × L."],"time":45,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-008","subject":"Chemistry","topic":"Matter","level":2,"type":"statement","q":"Consider:\\nI. Gases are highly compressible because their particles are far apart.\\nII. Liquids diffuse faster than gases.\\nIII. Solids have a definite shape and a definite volume.\\nIV. Particles of a solid do not move at all.\\nWhich are correct?","options":["I, II and III only","III and IV only","I and III only","I, III and IV only"],"answer":2,"explanation":"I is true (large spaces between gas particles). II is false: gas particles move faster with more space, so gases diffuse faster than liquids. III is true. IV is false: particles in a solid vibrate about fixed positions — they are never completely still above absolute zero.","misconception":"“Fixed positions” in a solid does not mean motionless; the particles vibrate.","hints":["Do the particles of a solid have any kinetic energy?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-009","subject":"Chemistry","topic":"Atoms & Molecules","level":1,"type":"numerical","q":"What is the molar mass of sulphuric acid, H₂SO₄? (H = 1, S = 32, O = 16)","options":["49 g/mol","100 g/mol","98 g/mol","96 g/mol"],"answer":2,"explanation":"Molar mass = 2(1) + 32 + 4(16) = 2 + 32 + 64 = 98 g/mol.","misconception":"96 g/mol forgets the two hydrogen atoms.","hints":["Add up the masses of every atom in the formula."],"time":35,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-010","subject":"Chemistry","topic":"Atoms & Molecules","level":2,"type":"numerical","q":"How many water molecules are in 9 g of water? (Avogadro constant = 6.022 × 10²³ mol⁻¹)","options":["1.204 × 10²⁴","5.42 × 10²⁴","3.011 × 10²³","6.022 × 10²³"],"answer":2,"explanation":"Molar mass of H₂O = 18 g/mol, so 9 g = 0.5 mol. Molecules = 0.5 × 6.022 × 10²³ = 3.011 × 10²³.","misconception":"5.42 × 10²⁴ multiplies the mass (9) by Avogadro’s number instead of the number of moles.","hints":["Convert grams to moles first: n = m/M."],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-011","subject":"Chemistry","topic":"Atoms & Molecules","level":1,"type":"numerical","q":"What is the mass of 0.25 mol of calcium carbonate, CaCO₃? (Ca = 40, C = 12, O = 16)","options":["25 g","100 g","400 g","50 g"],"answer":0,"explanation":"M(CaCO₃) = 40 + 12 + 48 = 100 g/mol. Mass = n × M = 0.25 × 100 = 25 g.","misconception":"400 g divides by 0.25 instead of multiplying.","hints":["m = n × M."],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-012","subject":"Chemistry","topic":"Atoms & Molecules","level":3,"type":"reasoning","q":"Which of the following contains the greatest number of ATOMS?","options":["32 g of oxygen gas (O₂)","18 g of water (H₂O)","44 g of carbon dioxide (CO₂)","4 g of hydrogen gas (H₂)"],"answer":3,"explanation":"Count moles of atoms: H₂: 4/2 = 2 mol molecules × 2 = 4 mol atoms. O₂: 32/32 = 1 mol × 2 = 2 mol atoms. H₂O: 18/18 = 1 mol × 3 = 3 mol atoms. CO₂: 44/44 = 1 mol × 3 = 3 mol atoms. Hydrogen wins with 4 mol of atoms (≈ 2.4 × 10²⁴ atoms).","misconception":"The largest mass does not mean the most atoms; light atoms like hydrogen give many atoms per gram.","hints":["Convert each mass to moles of molecules.","Multiply by the number of atoms in each molecule."],"time":120,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"CHE-013","subject":"Chemistry","topic":"Atoms & Molecules","level":2,"type":"numerical","q":"In water, hydrogen and oxygen always combine in the mass ratio 1 : 8. What mass of oxygen is needed to react completely with 3 g of hydrogen?","options":["3 g","24 g","27 g","8 g"],"answer":1,"explanation":"Law of constant proportions: mass ratio H : O = 1 : 8, so 3 g of hydrogen needs 3 × 8 = 24 g of oxygen, forming 27 g of water.","misconception":"27 g is the mass of water formed, not of oxygen needed.","hints":["Scale the ratio 1 : 8 up by 3."],"time":45,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-014","subject":"Chemistry","topic":"Atoms & Molecules","level":3,"type":"numerical","q":"Ammonium nitrate (NH₄NO₃) is used as a fertiliser. What percentage of its mass is nitrogen? (N = 14, H = 1, O = 16)","options":["17.5%","35%","46.7%","28%"],"answer":1,"explanation":"Molar mass = 14 + 4 + 14 + 48 = 80 g/mol. It contains TWO nitrogen atoms (one in NH₄⁺ and one in NO₃⁻): 28 g. Percentage = 28/80 × 100 = 35%.","misconception":"17.5% counts only one nitrogen atom — always count every atom of the element in the formula.","hints":["How many N atoms are in NH₄NO₃?","% = (mass of N in formula ÷ molar mass) × 100."],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-015","subject":"Chemistry","topic":"Atoms & Molecules","level":2,"type":"mcq","q":"Aluminium has a valency of 3 and the sulphate ion (SO₄) has a valency of 2. What is the formula of aluminium sulphate?","options":["Al₂(SO₄)₃","Al₂SO₄","Al₃(SO₄)₂","AlSO₄"],"answer":0,"explanation":"Criss-cross the valencies: Al³⁺ and SO₄²⁻ combine as 2 × (+3) = +6 and 3 × (−2) = −6, giving Al₂(SO₄)₃, which is electrically neutral.","misconception":"Al₃(SO₄)₂ swaps the subscripts; check that the total charge is zero.","hints":["Total positive charge must equal total negative charge."],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-016","subject":"Chemistry","topic":"Atoms & Molecules","level":2,"type":"reasoning","q":"A magnesium ribbon is burnt in air and all the white ash is collected. The ash weighs MORE than the original ribbon. Does this violate the law of conservation of mass?","options":["Yes — burning always increases mass.","No — the balance must be faulty.","Yes — mass is created during combustion.","No — the ash includes oxygen from the air that combined with the magnesium."],"answer":3,"explanation":"2Mg + O₂ → 2MgO. The mass of magnesium oxide = mass of magnesium + mass of oxygen taken from the air. Total mass of all reactants (including the oxygen) equals the total mass of products, so mass is conserved.","misconception":"When a reaction takes in a gas from the air, the solid product can weigh more than the starting solid.","hints":["What does magnesium combine with when it burns?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-017","subject":"Chemistry","topic":"Atoms & Molecules","level":3,"type":"reasoning","q":"A compound contains 40% carbon, 6.7% hydrogen and 53.3% oxygen by mass. What is its simplest (empirical) formula? (C = 12, H = 1, O = 16)","options":["CH₂O","C₂H₄O","CH₄O","CHO"],"answer":0,"explanation":"In 100 g: C = 40/12 = 3.33 mol, H = 6.7/1 = 6.7 mol, O = 53.3/16 = 3.33 mol. Dividing by the smallest (3.33): C : H : O = 1 : 2 : 1, so the empirical formula is CH₂O. (Glucose, C₆H₁₂O₆, has this empirical formula.)","misconception":"Mass percentages cannot be used directly as ratios — they must be converted to moles first.","hints":["Assume 100 g of compound and convert each mass to moles.","Divide every mole value by the smallest one."],"time":120,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"CHE-018","subject":"Chemistry","topic":"Atomic Structure","level":1,"type":"experiment","q":"In Rutherford’s gold-foil experiment, most alpha particles passed straight through the foil. What did this show?","options":["Gold atoms have no nucleus.","Most of the atom is empty space.","Electrons are heavier than protons.","Atoms are solid, hard spheres."],"answer":1,"explanation":"If the atom were a uniform solid ball, the particles would be blocked or deflected. Most passed straight through, so most of the atom must be empty space. The rare large deflections showed a tiny, dense, positive nucleus.","misconception":"The few particles that bounced back are the evidence for the nucleus; the many that passed through are the evidence for empty space.","hints":["If the atom were a solid ball, what would happen to the alpha particles?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-019","subject":"Chemistry","topic":"Atomic Structure","level":2,"type":"mcq","q":"Sodium has atomic number 11. What is the electronic configuration of the sodium ion, Na⁺?","options":["2, 8, 2","2, 8","2, 7","2, 8, 1"],"answer":1,"explanation":"A sodium atom is 2, 8, 1. It loses its single outer electron to form Na⁺, leaving 10 electrons arranged 2, 8 — the same stable arrangement as neon.","misconception":"2, 8, 1 is the neutral atom; a positive ion has LOST electrons.","hints":["How many electrons does Na⁺ have?"],"time":40,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-020","subject":"Chemistry","topic":"Atomic Structure","level":1,"type":"numerical","q":"An aluminium atom has mass number 27 and atomic number 13. How many neutrons does it have?","options":["40","13","14","27"],"answer":2,"explanation":"Neutrons = mass number − atomic number = 27 − 13 = 14.","hints":["Mass number = protons + neutrons."],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-021","subject":"Chemistry","topic":"Atomic Structure","level":2,"type":"numerical","q":"Natural chlorine is about 75% chlorine-35 and 25% chlorine-37. What is its average atomic mass?","options":["35 u","35.5 u","37.5 u","36 u"],"answer":1,"explanation":"Average = 0.75 × 35 + 0.25 × 37 = 26.25 + 9.25 = 35.5 u. It is closer to 35 because chlorine-35 is three times as abundant.","misconception":"36 u is the simple average, which ignores the abundances.","hints":["Weight each isotope’s mass by its abundance."],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-022","subject":"Chemistry","topic":"Atomic Structure","level":3,"type":"numerical","q":"An element has only two isotopes, of mass 10 u and 11 u, and an average atomic mass of 10.8 u. What percentage of its atoms are the lighter isotope?","options":["8%","50%","80%","20%"],"answer":3,"explanation":"Let x be the fraction of mass-10 atoms: 10x + 11(1 − x) = 10.8 → 11 − x = 10.8 → x = 0.2, i.e. 20%. Sense check: the average (10.8) is much closer to 11, so the heavier isotope must dominate. (This is boron.)","misconception":"80% is the abundance of the heavier isotope — check which side the average lies on.","hints":["Let the fraction of mass-10 atoms be x; the rest are mass 11.","Is 10.8 closer to 10 or to 11? Which isotope is more common?"],"time":100,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"CHE-023","subject":"Chemistry","topic":"Atomic Structure","level":1,"type":"mcq","q":"Which pair of atoms are isobars?","options":["⁴⁰₁₈Ar and ⁴⁰₂₀Ca","²³Na and ²⁴Mg","¹H and ²H","¹²₆C and ¹⁴₆C"],"answer":0,"explanation":"Isobars have the same mass number but different atomic numbers: argon-40 (Z = 18) and calcium-40 (Z = 20). C-12/C-14 and ¹H/²H are isotopes (same Z, different A).","misconception":"Isotopes = same element (same Z); isobars = same mass number (same A).","hints":["Isobars share the same mass number."],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-024","subject":"Chemistry","topic":"Atomic Structure","level":2,"type":"assertion-reason","q":"Assertion (A): Isotopes of an element have almost identical chemical properties.\\nReason (R): Chemical properties depend mainly on the number and arrangement of electrons, which is the same for isotopes.","options":["Both A and R are true, and R correctly explains A.","Both A and R are true, but R does not explain A.","A is true, but R is false.","A is false, but R is true."],"answer":0,"explanation":"Isotopes differ only in the number of neutrons. They have the same number of protons and therefore the same electron arrangement, and electrons — especially valence electrons — govern chemical behaviour. R correctly explains A.","misconception":"Neutrons change the mass (and nuclear stability), not the chemistry.","hints":["What differs between isotopes?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-025","subject":"Chemistry","topic":"Atomic Structure","level":3,"type":"reasoning","q":"The M shell can hold up to 18 electrons, yet potassium (Z = 19) has the configuration 2, 8, 8, 1 rather than 2, 8, 9. Why?","options":["Potassium has only 18 electrons.","The N shell fills before the M shell in every atom.","The M shell can only hold 8 electrons.","The outermost shell of an atom cannot hold more than 8 electrons."],"answer":3,"explanation":"In the Bohr–Bury scheme taught in Class IX, the outermost shell can hold at most 8 electrons. Putting 9 in the M shell would make it an outermost shell with 9, so the 19th electron goes into the N shell. (The deeper reason — energy levels of sub-shells — is studied in higher classes.)","misconception":"The M shell can hold 18, but not while it is the outermost shell.","hints":["What is the maximum number of electrons allowed in the OUTERMOST shell?"],"time":70,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-026","subject":"Chemistry","topic":"Atomic Structure","level":1,"type":"mcq","q":"Which correctly describes a neutron?","options":["Positive charge, mass about equal to a proton","Negative charge, negligible mass","No charge, negligible mass","No charge, mass about equal to a proton"],"answer":3,"explanation":"Neutrons, discovered by James Chadwick in 1932, are neutral particles in the nucleus with a mass very slightly greater than a proton’s (≈ 1 u).","misconception":"Neutral does not mean massless.","hints":["Neutrons are found in the nucleus with protons."],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-027","subject":"Chemistry","topic":"Atomic Structure","level":3,"type":"what-if","q":"Suppose Thomson’s “plum-pudding” model (positive charge spread evenly through the atom, electrons embedded in it) had been correct. What would Rutherford’s gold-foil experiment have shown?","options":["No alpha particles passing through at all","Nearly all alpha particles passing through with only small deflections and none bouncing back","Most alpha particles bouncing straight back","Alpha particles being absorbed and turned into gold"],"answer":1,"explanation":"With positive charge spread thinly, no region of the atom would have a strong enough concentrated charge to turn back a fast, heavy alpha particle — only slight deflections would occur. The observed rare large deflections (about 1 in 20,000 bounced back) proved that the positive charge is concentrated in a tiny nucleus.","misconception":"Spreading the same charge over a bigger volume makes the repulsion at any point much weaker.","hints":["Where is the positive charge in Thomson’s model — concentrated or spread out?","Can a thinly spread charge exert a strong force on a fast, heavy particle?"],"time":80,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"CHE-028","subject":"Chemistry","topic":"Elements, Compounds & Mixtures","level":1,"type":"mcq","q":"Which of these is a compound?","options":["Air","Water","Sea water","Brass"],"answer":1,"explanation":"Water (H₂O) has hydrogen and oxygen chemically combined in a fixed ratio with new properties. Air and sea water are mixtures; brass is an alloy of copper and zinc — a mixture whose composition can vary.","misconception":"Alloys look uniform, but they are mixtures, not compounds.","hints":["Which substance has a fixed chemical formula?"],"time":25,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-029","subject":"Chemistry","topic":"Elements, Compounds & Mixtures","level":1,"type":"application","q":"How can camphor be separated from a mixture of camphor and common salt?","options":["Chromatography","Sublimation","Magnetic separation","Filtration"],"answer":1,"explanation":"Camphor sublimes (turns directly to vapour on gentle heating) and re-solidifies on a cool surface, while salt does not. Both are soluble-ish solids, so filtration alone would not work.","hints":["Which of the two substances changes from solid directly to vapour?"],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-030","subject":"Chemistry","topic":"Elements, Compounds & Mixtures","level":2,"type":"experiment","q":"A drop of black marker ink on filter paper is dipped in water. After some time the spot spreads into separate blue, yellow and red bands. What can you conclude?","options":["The paper contains coloured dyes.","The ink is a mixture of dyes that travel at different rates.","Water reacts with the ink to make new coloured compounds.","The ink is a pure compound that decomposes."],"answer":1,"explanation":"This is paper chromatography. Each dye has a different solubility in the solvent and attraction to the paper, so they move different distances and separate. A pure substance gives a single spot.","misconception":"No chemical reaction occurs — chromatography is a physical separation.","hints":["What would a pure substance look like on the paper?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-031","subject":"Chemistry","topic":"Elements, Compounds & Mixtures","level":2,"type":"numerical","q":"20 g of salt is dissolved in 180 g of water. What is the concentration of the solution as a mass-by-mass percentage?","options":["10%","20%","11.1%","9%"],"answer":0,"explanation":"Mass % = mass of solute ÷ mass of SOLUTION × 100 = 20 ÷ (20 + 180) × 100 = 20/200 × 100 = 10%.","misconception":"11.1% divides by the mass of the solvent (180 g) instead of the whole solution (200 g).","hints":["Mass of solution = mass of solute + mass of solvent."],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-032","subject":"Chemistry","topic":"Elements, Compounds & Mixtures","level":1,"type":"application","q":"Which technique is used in dairies to separate cream from milk?","options":["Centrifugation","Evaporation","Distillation","Sublimation"],"answer":0,"explanation":"Spinning milk at high speed in a centrifuge forces the denser parts outward and the lighter fat (cream) collects near the centre, where it is drawn off. The same principle is used to separate blood cells from plasma.","hints":["Cream is less dense than the rest of milk."],"time":30,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-033","subject":"Chemistry","topic":"Elements, Compounds & Mixtures","level":2,"type":"experiment","q":"A narrow torch beam is shone through four liquids. In which will the path of the beam be clearly visible from the side?","options":["Sugar solution","Copper sulphate solution","Diluted milk","Salt solution"],"answer":2,"explanation":"Milk is a colloid: its fat and protein particles are big enough to scatter light (the Tyndall effect), making the beam visible. In true solutions (salt, sugar, copper sulphate) the particles are too small to scatter light noticeably.","misconception":"A coloured solution (copper sulphate) is still a true solution — colour is not the same as scattering.","hints":["Which liquid is a colloid?"],"time":50,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-034","subject":"Chemistry","topic":"Elements, Compounds & Mixtures","level":2,"type":"statement","q":"Iron filings and sulphur powder are (i) simply mixed, and (ii) heated strongly to form iron sulphide. Which statement is correct?","options":["In both cases a magnet can pull out the iron.","In (ii) the product keeps the properties of both iron and sulphur.","In (i) the components are in a fixed ratio; in (ii) they are in any ratio.","In (i) a magnet can pull out the iron; in (ii) it cannot, because a new substance has formed."],"answer":3,"explanation":"A mixture keeps the properties of its components (iron stays magnetic) and can have any proportions. Heating causes a chemical reaction, Fe + S → FeS; iron sulphide is a compound with new properties — it is not attracted like iron and has a fixed composition.","misconception":"Compounds have fixed composition and new properties; mixtures keep the properties of their parts.","hints":["Is iron sulphide the same substance as iron?"],"time":60,"tracks":["MVPP","VVM","GEN"],"iq":false,"verified":true},{"id":"CHE-035","subject":"Chemistry","topic":"Elements, Compounds & Mixtures","level":3,"type":"reasoning","q":"You must recover all three components of a mixture of iron filings, sand and common salt. Which order of steps works?","options":["Add water → evaporate → magnet → filter","Evaporate → add water → magnet → filter","Filter → magnet → add water → evaporate","Magnet → add water and stir → filter → evaporate the filtrate"],"answer":3,"explanation":"First remove the iron with a magnet (dry). Then add water: salt dissolves, sand does not. Filtering leaves sand on the paper; the salt solution passes through. Evaporating the filtrate recovers the salt. Other orders fail — e.g. you cannot filter a dry mixture, and evaporating first does nothing useful.","misconception":"Using the magnet after adding water works but leaves the iron wet and rusting; the key point is that dissolving must come before filtering, and filtering before evaporating.","hints":["Which component has a unique property you can use without any liquid?","Which component dissolves in water and which does not?"],"time":90,"tracks":["MVPP","VVM","GEN"],"iq":true,"verified":true},{"id":"CHE-036","subject":"Chemistry","topic":"Periodic Classification","level":2,"type":"reasoning","q":"Moving from left to right across Period 3 (Na → Cl), atomic radius decreases. Why?","options":["Nuclear charge increases while electrons are added to the same shell, so they are pulled in more strongly.","The number of shells decreases.","Atoms lose neutrons across the period.","Electrons are added to new shells."],"answer":0,"explanation":"Across a period, each element has one more proton but its extra electron goes into the same (third) shell. The greater nuclear charge pulls all the electrons closer, so the atom shrinks.","misconception":"More electrons does not automatically mean a bigger atom; what matters is the number of shells and the nuclear pull.","hints":["Does the number of shells change across a period?"],"time":50,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-037","subject":"Chemistry","topic":"Periodic Classification","level":1,"type":"mcq","q":"Lithium, sodium and potassium are placed in the same group of the periodic table because they all have:","options":["eight valence electrons","one valence electron","the same number of shells","the same atomic mass"],"answer":1,"explanation":"Elements of a group have the same number of electrons in their outermost shell — here one (Li 2,1; Na 2,8,1; K 2,8,8,1) — so they show similar chemical properties, such as reacting vigorously with water to form alkalis.","misconception":"Same group = same valence electrons; same period = same number of shells.","hints":["Write their electronic configurations."],"time":30,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-038","subject":"Chemistry","topic":"Periodic Classification","level":3,"type":"reasoning","q":"An unknown element X has atomic number 20. Which set of predictions is correct?","options":["Group 2, Period 4; a non-metal; its chloride is XCl","Group 2, Period 4; a metal; its chloride is XCl₂","Group 4, Period 2; a metal; its chloride is XCl₄","Group 18, Period 4; an unreactive gas"],"answer":1,"explanation":"Z = 20 → configuration 2, 8, 8, 2: four shells (Period 4) and two valence electrons (Group 2). It loses two electrons easily, so it is a metal forming X²⁺ and therefore XCl₂. (X is calcium — CaCl₂.)","misconception":"Group 4, Period 2 swaps the meaning of the two numbers: shells give the period, valence electrons give the group.","hints":["Write the electronic configuration of Z = 20.","Shells → period; valence electrons → group and valency."],"time":80,"tracks":["MVPP","GEN"],"iq":true,"verified":true},{"id":"CHE-039","subject":"Chemistry","topic":"Periodic Classification","level":2,"type":"mcq","q":"Mendeleev left gaps in his periodic table and predicted the properties of “eka-aluminium”. Which element was later discovered to fit this gap?","options":["Gallium","Germanium","Silicon","Scandium"],"answer":0,"explanation":"Gallium (discovered 1875) matched Mendeleev’s predictions for eka-aluminium closely, including its atomic mass and density. Eka-silicon became germanium and eka-boron became scandium. These successful predictions convinced chemists of his table’s value.","misconception":"Germanium was eka-silicon, not eka-aluminium.","hints":["“Eka” means “one below”: which element lies just below aluminium?"],"time":40,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-040","subject":"Chemistry","topic":"Chemical Reactions","level":1,"type":"mcq","q":"Which equation for the formation of water is correctly balanced?","options":["2H₂ + O₂ → 2H₂O","H₂ + O₂ → H₂O","H₂ + 2O₂ → 2H₂O","H₂ + O₂ → H₂O₂"],"answer":0,"explanation":"Count atoms: left 4 H and 2 O; right 2 × H₂O = 4 H and 2 O ✓. H₂ + O₂ → H₂O has 2 O on the left but 1 on the right; H₂ + O₂ → H₂O₂ forms hydrogen peroxide, a different substance — balancing must never change formulas.","misconception":"Balancing is done by changing coefficients only; changing subscripts (H₂O → H₂O₂) changes the substance.","hints":["Count H and O atoms on both sides."],"time":35,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-041","subject":"Chemistry","topic":"Chemical Reactions","level":2,"type":"experiment","q":"A zinc strip is placed in blue copper sulphate solution. After an hour the solution is nearly colourless and the strip is coated with a reddish-brown layer. Which explanation is correct?","options":["Zinc dissolves physically without any reaction.","The solution simply evaporates.","Zinc, being more reactive, displaces copper from copper sulphate.","Copper displaces zinc from zinc sulphate."],"answer":2,"explanation":"Zn + CuSO₄ → ZnSO₄ + Cu. Zinc is above copper in the reactivity series, so it displaces copper; reddish-brown copper deposits on the strip, and the blue colour (due to Cu²⁺ ions) fades as colourless zinc sulphate forms.","misconception":"A less reactive metal cannot displace a more reactive one — the reverse reaction does not happen.","hints":["Which is more reactive: zinc or copper?","What makes copper sulphate blue?"],"time":50,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-042","subject":"Chemistry","topic":"Chemical Reactions","level":3,"type":"reasoning","q":"Burning magnesium keeps burning in carbon dioxide: 2Mg + CO₂ → 2MgO + C. Which substance is reduced?","options":["Carbon dioxide","Magnesium","Carbon","Magnesium oxide"],"answer":0,"explanation":"CO₂ loses its oxygen to become carbon — loss of oxygen is reduction. Magnesium gains oxygen (oxidised) and acts as the reducing agent. This is why CO₂ fire extinguishers must never be used on magnesium fires.","misconception":"Carbon is a product of the reduction; the substance that WAS reduced is the reactant that lost oxygen.","hints":["Which reactant loses oxygen?"],"time":70,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-043","subject":"Chemistry","topic":"Chemical Reactions","level":2,"type":"experiment","q":"White silver chloride kept in sunlight slowly turns grey. What type of reaction is this?","options":["Combination","Photochemical decomposition","Double displacement","Neutralisation"],"answer":1,"explanation":"2AgCl → 2Ag + Cl₂ in the presence of light. Light energy decomposes silver chloride, and the grey colour is finely divided silver metal. Silver halides were used in black-and-white photography for this reason.","hints":["Is one substance breaking into two, or are two combining?"],"time":45,"tracks":["MVPP","GEN"],"iq":false,"verified":true},{"id":"CHE-044","subject":"Chemistry","topic":"Chemical Reactions","level":3,"type":"numerical","q":"Calcium carbonate decomposes on heating: CaCO₃ → CaO + CO₂. What mass of carbon dioxide is released when 50 g of CaCO₃ decomposes completely? (Ca = 40, C = 12, O = 16)","options
